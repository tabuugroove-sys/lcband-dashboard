<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC Band — Последние отправленные (72ч)</title>
<link rel="stylesheet" href="_theme.css">
<script src="_theme.js"></script>
<style>
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
    --card: #161b22; --border: #30363d;
    --accent: #58a6ff; --green: #3fb950; --orange: #f0883e; --red: #f85149;
    --purple: #bc8cff; --gold: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); padding:20px;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; line-height:1.5; }
  .header { display:flex; justify-content:space-between; align-items:center;
            margin-bottom:18px; gap:12px; flex-wrap:wrap; }
  .header h1 { margin:0; font-size:20px; }
  .header .nav { display:flex; gap:10px; flex-wrap:wrap; }
  .header .nav a { color:var(--muted); text-decoration:none; font-size:13px;
                   padding:4px 8px; border-radius:4px; }
  .header .nav a:hover { color:var(--accent); background:rgba(255,255,255,0.05); }
  .theme-toggle { background:var(--card); border:1px solid var(--border); color:var(--fg);
                  border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
  html[data-theme="light"] .theme-toggle { background:#fff; border-color:#d0d7de; color:#1f2328; }
  .lcb-theme-toggle { display:none !important; }

  .meta { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .filters { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-btn { padding:5px 10px; border-radius:14px; border:1px solid var(--border);
                background:var(--card); color:var(--fg); font-size:12px; cursor:pointer; }
  .filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .search { flex:1; min-width:200px; padding:6px 10px; border-radius:6px;
            border:1px solid var(--border); background:var(--card); color:var(--fg);
            font-size:13px; }

  .msg-row { background:var(--card); border:1px solid var(--border); border-radius:8px;
             padding:12px 14px; margin-bottom:8px; display:grid;
             grid-template-columns: 130px 200px 90px 1fr 100px; gap:12px;
             align-items:start; font-size:13px; position:relative; }
  .msg-row:hover { border-color:var(--accent); }
  .msg-row:hover .conv-popup { display:block; }
  .conv-popup {
    display:none; position:absolute; top:100%; left:140px; right:120px; z-index:200;
    background:var(--card); border:1px solid var(--accent); border-radius:8px;
    padding:12px; max-height:420px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.5);
    font-size:12px; margin-top:4px;
  }
  .conv-popup .conv-header { color:var(--muted); font-size:11px; margin-bottom:8px;
                              padding-bottom:6px; border-bottom:1px solid var(--border); }
  .conv-popup .msg { padding:6px 0; border-bottom:1px dashed var(--border); white-space:pre-wrap; }
  .conv-popup .msg:last-child { border-bottom:none; }
  .conv-popup .msg.out { color:var(--accent); padding-left:16px; }
  .conv-popup .msg.in { color:var(--fg); padding-right:16px; }
  .conv-popup .msg .when { color:var(--muted); font-size:10px; margin-right:6px; }
  .conv-popup .msg .who { font-weight:600; margin-right:4px; }
  html[data-theme="light"] .conv-popup { background:#fff; border-color:#0969da;
                                          box-shadow:0 8px 24px rgba(0,0,0,0.15); }
  html[data-theme="light"] .conv-popup .msg.in { color:#1f2328; }
  html[data-theme="light"] .conv-popup .msg.out { color:#0969da; }
  html[data-theme="light"] .conv-popup .msg .when { color:#656d76; }
  html[data-theme="light"] .conv-popup .conv-header { color:#656d76; border-bottom-color:#d0d7de; }
  .msg-row.cold { border-left:3px solid var(--gold); }
  .msg-row.sent { border-left:3px solid var(--green); }
  .msg-row.awaiting { border-left:3px solid var(--orange); }
  .ts { color:var(--muted); font-size:11px; white-space:nowrap; }
  .user { color:var(--accent); font-weight:600; }
  .user-name { display:block; color:var(--muted); font-size:11px; }
  .channel { font-size:11px; color:var(--muted); text-transform:uppercase; }
  .status { font-size:11px; padding:2px 6px; border-radius:3px; display:inline-block; }
  .status.sent { background:rgba(63,185,80,0.18); color:var(--green); }
  .status.awaiting { background:rgba(240,136,62,0.18); color:var(--orange); }
  .status.cold { background:rgba(210,153,34,0.18); color:var(--gold); }
  .text { white-space:pre-wrap; word-break:break-word; max-height:80px; overflow:hidden;
          position:relative; }
  .text.expanded { max-height:none; }
  .text-fade { position:absolute; bottom:0; left:0; right:0; height:24px;
               background:linear-gradient(transparent, var(--card)); pointer-events:none; }
  .text.expanded .text-fade { display:none; }
  .toggle-text { color:var(--accent); font-size:11px; cursor:pointer; margin-top:4px;
                 display:inline-block; }

  html[data-theme="light"] body { background:#fafbfc; color:#1f2328; }
  html[data-theme="light"] .msg-row { background:#fff; border-color:#d0d7de; }
  html[data-theme="light"] .filter-btn { background:#fff; border-color:#d0d7de; color:#1f2328; }
  html[data-theme="light"] .filter-btn.active { background:#0969da; color:#fff; }
  html[data-theme="light"] .search { background:#fff; border-color:#d0d7de; color:#1f2328; }
  html[data-theme="light"] .text-fade { background:linear-gradient(transparent, #fff); }
  html[data-theme="light"] .user { color:#0969da; }
  html[data-theme="light"] .header .nav a:hover { background:rgba(0,0,0,0.05); color:#0969da; }
  html[data-theme="light"] .ts, html[data-theme="light"] .meta, html[data-theme="light"] .channel,
  html[data-theme="light"] .user-name { color:#656d76; }

  .empty { text-align:center; padding:30px; color:var(--muted); font-style:italic; }
  .wa-panel { background:var(--card); border:1px solid var(--border); border-radius:8px;
              padding:14px; margin:0 0 16px; }
  .wa-panel-head { display:flex; justify-content:space-between; align-items:flex-start;
                   gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .wa-panel-title { font-size:15px; font-weight:700; }
  .wa-panel-note { color:var(--muted); font-size:12px; max-width:780px; margin-top:2px; }
  .wa-refresh { border:1px solid var(--border); background:transparent; color:var(--fg);
                border-radius:6px; padding:5px 9px; font-size:12px; cursor:pointer; }
  .wa-refresh:hover { border-color:var(--accent); color:var(--accent); }
  .wa-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; }
  .wa-card { border:1px solid var(--border); border-radius:8px; padding:11px 12px;
             background:rgba(255,255,255,0.025); }
  .wa-card.pending_approval { border-left:3px solid var(--orange); }
  .wa-card.queued { border-left:3px solid var(--accent); }
  .wa-card.cancelled { opacity:.65; }
  .wa-top { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .wa-recipient { font-weight:700; color:var(--fg); word-break:break-word; }
  .wa-source { color:var(--muted); font-size:11px; margin-top:2px; word-break:break-word; }
  .wa-status { font-size:11px; border-radius:3px; padding:2px 6px; white-space:nowrap; height:fit-content; }
  .wa-status.pending_approval { background:rgba(240,136,62,.18); color:var(--orange); }
  .wa-status.queued { background:rgba(88,166,255,.15); color:var(--accent); }
  .wa-text { white-space:pre-wrap; color:var(--fg); font-size:12px; max-height:92px;
             overflow:auto; border-top:1px dashed var(--border); padding-top:8px; }
  .wa-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .wa-actions button { border:1px solid var(--border); border-radius:6px; padding:5px 9px;
                       font-size:12px; cursor:pointer; background:transparent; color:var(--fg); }
  .wa-actions button.approve { border-color:rgba(63,185,80,.45); color:var(--green); }
  .wa-actions button.cancel { border-color:rgba(248,81,73,.45); color:var(--red); }
  .wa-command { color:var(--muted); font-size:11px; margin-top:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  html[data-theme="light"] .wa-panel { background:#fff; border-color:#d0d7de; }
  html[data-theme="light"] .wa-card { background:#f6f8fa; border-color:#d0d7de; }
</style>
</head>
<body>
<div class="header">
  <h1>📤 Последние отправленные за 72 часа</h1>
  <div class="nav">
    <button class="theme-toggle" id="theme-toggle">🌙 Тёмная</button>
    <a href="index.html">← Dashboard</a>
    <a href="architecture.html">Architecture</a>
    <a href="broker.html">Broker</a>
  </div>
</div>
<div class="meta" id="meta">Загрузка…</div>
<section class="wa-panel" id="wa-panel">
  <div class="wa-panel-head">
    <div>
      <div class="wa-panel-title">WhatsApp approval queue</div>
      <div class="wa-panel-note">
        WA follow-up остаётся manual/approved: approve переводит draft в queued для native WhatsApp Desktop.
        Auto-sender не отправляет эти follow-up автоматически.
      </div>
    </div>
    <button class="wa-refresh" id="wa-refresh">Обновить</button>
  </div>
  <div id="wa-queue-meta" class="meta">Загрузка WA queue…</div>
  <div id="wa-queue-list"></div>
</section>
<div class="filters">
  <button class="filter-btn active" data-filter="all">Все</button>
  <button class="filter-btn" data-filter="sent">✅ Отправлено</button>
  <button class="filter-btn" data-filter="awaiting_approve">⏳ В боте</button>
  <button class="filter-btn" data-filter="cold_outreach">🎯 Холодные</button>
  <input type="text" class="search" id="search" placeholder="🔍 поиск по @username / клиенту / тексту…">
</div>
<div id="list"></div>

<script>
(function syncThemeButton() {
  const btn = document.getElementById('theme-toggle');
  function update() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    btn.textContent = cur === 'light' ? '☀️ Светлая' : '🌙 Тёмная';
  }
  update();
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('lcb_theme', next); } catch {}
    update();
  });
})();

async function getBackendUrl() {
  return location.protocol === 'file:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost'
    ? `${location.protocol}//${location.hostname}:8878`
    : 'http://127.0.0.1:8878';
}
function escHtml(s) {
  return (s||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0,16);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (isToday) return `сегодня ${hh}:${mm}`;
  const dd = String(d.getDate()).padStart(2,'0');
  const mon = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mon} ${hh}:${mm}`;
}

let ALL_ITEMS = [];
let CURRENT_FILTER = 'all';
let WA_QUEUE_ITEMS = [];

function renderWaQueue() {
  const list = document.getElementById('wa-queue-list');
  const meta = document.getElementById('wa-queue-meta');
  if (!list || !meta) return;
  const counts = WA_QUEUE_ITEMS.reduce((acc, it) => {
    acc[it.status] = (acc[it.status] || 0) + 1;
    return acc;
  }, {});
  meta.innerHTML = `pending: <strong>${counts.pending_approval || 0}</strong> · queued: <strong>${counts.queued || 0}</strong>`;
  if (!WA_QUEUE_ITEMS.length) {
    list.innerHTML = '<div class="empty" style="padding:16px">Нет pending/queued WhatsApp drafts.</div>';
    return;
  }
  list.innerHTML = `<div class="wa-grid">${WA_QUEUE_ITEMS.map(it => {
    const title = it.recipient || it.phone || 'unknown';
    const source = [it.source, it.source_key].filter(Boolean).join(' · ');
    const isFollowup = it.source === 'wa_followup';
    const command = it.status === 'queued'
      ? (it.auto_sender_eligible
          ? '⏳ авто-отправка ≤1 мин (wa_auto_sender)'
          : `python3 wa_cu_agent.py instruction --id ${escHtml(it.id)}`)
      : '';
    const approveLabel = isFollowup ? 'Approve → авто-отправка' : 'Approve → queued';
    const actions = it.status === 'pending_approval'
      ? `<button class="approve" data-wa-action="approve" data-id="${escHtml(it.id)}">${approveLabel}</button>
         <button class="cancel" data-wa-action="cancel" data-id="${escHtml(it.id)}">Cancel</button>`
      : `<button class="cancel" data-wa-action="cancel" data-id="${escHtml(it.id)}">Cancel</button>`;
    return `<div class="wa-card ${escHtml(it.status)}">
      <div class="wa-top">
        <div>
          <div class="wa-recipient">${escHtml(title)}</div>
          <div class="wa-source">${escHtml(source || it.id)}</div>
        </div>
        <span class="wa-status ${escHtml(it.status)}">${escHtml(it.status)}</span>
      </div>
      <div class="wa-text">${escHtml(it.text || it.text_preview || '')}</div>
      ${command ? `<div class="wa-command">${command}</div>` : ''}
      <div class="wa-actions">${actions}</div>
    </div>`;
  }).join('')}</div>`;

  list.querySelectorAll('[data-wa-action]').forEach(btn => {
    btn.onclick = () => mutateWaQueue(btn.dataset.waAction, btn.dataset.id);
  });
}

async function loadWaQueue() {
  const base = await getBackendUrl();
  const meta = document.getElementById('wa-queue-meta');
  try {
    const r = await fetch(`${base}/api/wa_cu_queue?status=pending_approval,queued&limit=60`, { cache:'no-store' });
    const data = await r.json();
    if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
    WA_QUEUE_ITEMS = data.items || [];
    renderWaQueue();
  } catch (e) {
    if (meta) meta.innerHTML = `<span style="color:var(--red)">WA queue error: ${escHtml(e.message)}</span>`;
  }
}

async function mutateWaQueue(action, id) {
  if (!id) return;
  if (action === 'cancel' && !confirm('Cancel this WhatsApp queue item?')) return;
  const base = await getBackendUrl();
  const endpoint = action === 'approve' ? 'approve' : 'cancel';
  try {
    const r = await fetch(`${base}/api/wa_cu_queue/${endpoint}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id, note:'via dashboard', reason:'via dashboard' }),
    });
    const data = await r.json();
    if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
    await loadWaQueue();
  } catch (e) {
    alert(`WA ${action} failed: ${e.message}`);
  }
}

function render() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const filtered = ALL_ITEMS.filter(it => {
    if (CURRENT_FILTER !== 'all' && it.status !== CURRENT_FILTER) return false;
    if (search) {
      const hay = `${it.username||''} ${it.client_name||''} ${it.text||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
  if (!filtered.length) {
    document.getElementById('list').innerHTML = '<div class="empty">Нет сообщений по фильтру.</div>';
    return;
  }
  document.getElementById('list').innerHTML = filtered.map((it, idx) => {
    const statusClass = it.status === 'sent' ? 'sent' : it.status === 'cold_outreach' ? 'cold' : 'awaiting';
    const text = it.text || '(текст не сохранён)';
    const isLong = text.length > 200;
    const conv = it.conv || [];
    const convHtml = conv.length
      ? `<div class="conv-popup">
          <div class="conv-header">📜 Переписка с @${escHtml(it.username)} · ${conv.length} сообщ.</div>
          ${conv.map(m => `<div class="msg ${m.out?'out':'in'}">
            <span class="when">${escHtml((m.date||'').slice(5,16))}</span>
            <span class="who">${m.out?'WE':'THEY'}:</span>${escHtml(m.text||'')}
          </div>`).join('')}
        </div>`
      : `<div class="conv-popup">
          <div class="conv-header" style="text-align:center;padding:20px;font-style:italic">
            Переписка с @${escHtml(it.username)} не найдена в кэше
          </div>
        </div>`;
    return `<div class="msg-row ${statusClass}">
      <div class="ts">${escHtml(fmtTime(it.ts))}</div>
      <div>
        <span class="user">@${escHtml(it.username || '—')}</span>
        ${it.client_name ? `<span class="user-name">${escHtml(it.client_name)}</span>` : ''}
      </div>
      <div class="channel">${escHtml(it.channel || 'TG')}</div>
      <div>
        <div class="text" data-idx="${idx}">${escHtml(text)}${isLong ? '<div class="text-fade"></div>' : ''}</div>
        ${isLong ? `<span class="toggle-text" data-idx="${idx}">показать всё</span>` : ''}
        ${it.details ? `<div style="color:var(--muted);font-size:10px;margin-top:4px">${escHtml(it.details)}</div>` : ''}
      </div>
      <div><span class="status ${statusClass}">${escHtml(it.status_label || it.status)}</span></div>
      ${convHtml}
    </div>`;
  }).join('');

  document.querySelectorAll('.toggle-text').forEach(el => {
    el.onclick = () => {
      const idx = el.dataset.idx;
      const t = document.querySelector(`.text[data-idx="${idx}"]`);
      t.classList.toggle('expanded');
      el.textContent = t.classList.contains('expanded') ? 'свернуть' : 'показать всё';
    };
  });
}

async function load() {
  const base = await getBackendUrl();
  try {
    const r = await fetch(`${base}/api/outgoing_72h`, { cache:'no-store' });
    const data = await r.json();
    ALL_ITEMS = data.items || [];
    const m = data._meta || {};
    document.getElementById('meta').innerHTML =
      `Всего отправок: <strong>${m.total}</strong> · с ${(m.cutoff_iso||'').slice(5,16)} · ` +
      `обновлено ${(m.generated_at||'').slice(11,19)}`;
    render();
  } catch (e) {
    document.getElementById('meta').innerHTML =
      `<span style="color:var(--red)">Ошибка: ${escHtml(e.message)}</span>`;
  }
}

document.querySelectorAll('.filter-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    CURRENT_FILTER = b.dataset.filter;
    render();
  };
});
document.getElementById('search').oninput = render;

document.getElementById('wa-refresh').onclick = loadWaQueue;

load();
loadWaQueue();
setInterval(load, 60000); // refresh каждую минуту
setInterval(loadWaQueue, 60000);
</script>
</body>
</html>
