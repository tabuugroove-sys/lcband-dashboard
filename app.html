<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0E6B54">
<title>LCB</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="icon" type="image/png" href="app-icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="topbar">
  <span class="brand">LCB</span>
  <input id="search" type="search" placeholder="Поиск: контакт, событие…" autocomplete="off">
  <button id="reloadBtn" title="Обновить данные">⟳</button>
  <button id="themeBtn" title="Тема">◐</button>
  <button id="connPill" class="st-init" aria-label="Состояние соединения" title="Состояние соединения"><span class="cdot"></span><span class="clabel">Подключение…</span></button>
</div>
<div id="offline">Офлайн — показан последний снимок данных</div>
<div id="connDrawer" hidden><div class="dbody" id="drawerBody"></div></div>

<main>
  <section id="scr-cal" class="screen"></section>
  <section id="scr-chats" class="screen"></section>
  <section id="scr-today" class="screen"></section>
  <section id="scr-sys" class="screen"></section>
  <section id="scr-tokens" class="screen"></section>
  <section id="scr-cast" class="screen"></section>
  <section id="scr-core2" class="screen"></section>
  <section id="scr-assurance" class="screen"></section>
  <section id="scr-view" class="screen"></section>
</main>

<nav id="tabbar">
  <button data-tab="cal"><span class="ic">▦</span>Календарь</button>
  <button data-tab="chats"><span class="ic">✉<span class="tabbadge" id="chatsTabBadge" hidden></span></span>Чаты</button>
  <button data-tab="today"><span class="ic">☉</span>Сегодня</button>
  <button data-tab="sys"><span class="ic">◔</span>Система</button>
  <button data-tab="tokens"><span class="ic">◈</span>Токены</button>
  <button data-tab="cast"><span class="ic">✈</span>Рассылка</button>
  <button data-tab="core2"><span class="ic">⚛</span>LCB 2.0</button>
</nav>

<script src="app-api.js"></script>
<script src="app-cal.js"></script>
<script src="app-chats.js"></script>
<script src="app-today.js"></script>
<script src="app-event.js"></script>
<script src="app-assurance.js"></script>
<script src="app-sys.js"></script>
<script src="app-tokens.js"></script>
<script src="app-broadcast.js"></script>
<script src="app-core2.js"></script>
<script src="app.js"></script>
</body>
</html>
