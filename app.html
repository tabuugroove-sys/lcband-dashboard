<!doctype html>
<!-- Надгробие legacy-приложения (CHG-20260815-007). Решение Михаила 15.08.2026:
     остаётся только локальное V2-приложение (core-app.html, :8880). Файл
     сохраняет URL живым для старых закладок/PWA и переводит на V2; парный
     app-sw.js — самоликвидирующийся service worker, чистящий старый PWA-кэш.
     Десктопный дашборд index.html этим не затронут. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LCB — приложение переехало</title>
<link rel="icon" type="image/png" href="app-icon-192.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
         background: #f5f2ec; color: #2b2b28; }
  @media (prefers-color-scheme: dark) { body { background: #191815; color: #e8e4da; } }
  main { max-width: 26em; padding: 32px; text-align: center; }
  a.go { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 8px;
         background: #2f5d50; color: #fff; text-decoration: none; font-weight: 600; }
  p.small { opacity: .65; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>Приложение переехало</h1>
  <p>Теперь всё живёт в одном месте — локальном приложении LC Band 2.0.</p>
  <a class="go" id="goLink" href="http://127.0.0.1:8880/core-app.html">Открыть V2-приложение</a>
  <p class="small">Старая PWA-копия и её кэш удаляются автоматически.</p>
</main>
<script>
(function () {
  "use strict";
  // Старый PWA-кэш: снять service worker и вычистить lcb-app-кэши, иначе
  // телефон Михаила может вечно показывать закэшированное старое приложение.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => regs.forEach((reg) => reg.unregister()))
      .catch(() => {});
  }
  if (window.caches && caches.keys) {
    caches.keys()
      .then((keys) => keys.filter((k) => k.startsWith("lcb-app-")).forEach((k) => caches.delete(k)))
      .catch(() => {});
  }
  // Вкладки старого приложения → экраны V2.
  var tabMap = { cal: "calendar", chats: "chats", today: "today", sys: "system",
                 tokens: "tokens", cast: "broadcast", core2: "arbitr" };
  var oldTab = (location.hash || "").replace("#", "");
  var target = "/core-app.html" + (tabMap[oldTab] ? "#" + tabMap[oldTab] : "");
  var host = location.hostname;
  var local = host === "127.0.0.1" || host === "localhost";
  // Хост известен только для локального доступа; на tailnet/Pages порт 8880
  // может быть замаплен иначе — там даём ссылку, но не редиректим вслепую.
  var url = location.protocol + "//" + (host || "127.0.0.1") + ":8880" + target;
  document.getElementById("goLink").href = url;
  if (local) location.replace(url);
})();
</script>
</body>
</html>
