<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Direct Funnel</title>
  <style>
    :root {
      --bg:       #0a0a12;
      --card:     #13131f;
      --border:   #23233a;
      --gold:     #f5c518;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --ok:       #10b981;
    }
    :root[data-theme="light"] {
      --bg:       #fafbfc;
      --card:     #ffffff;
      --border:   #d0d7de;
      --gold:     #9a6700;
      --text:     #1f2328;
      --muted:    #656d76;
      --ok:       #1a7f37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      padding: 20px;
    }
    .app { max-width: 1200px; margin: 0 auto; padding-top: 54px; }

    h1 { font-size: 28px; margin-bottom: 10px; color: var(--gold); }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 30px; }

    .funnel-wrap {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 30px;
      padding: 10px 0;
    }
    .funnel-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      min-width: 140px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .funnel-box:hover {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(245,197,24,0.2);
    }
    .funnel-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .funnel-name {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .funnel-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }

    .refresh-time {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
  <link rel="stylesheet" href="_theme.css">
  <script src="_theme.js"></script>
  <script src="_nav.js"></script>
</head>
<body>
  <div class="app">
    <h1>📊 DM Direct Funnel — 7-Stage Pipeline</h1>
    <div class="subtitle">Real-time direct message leads distribution</div>

    <div class="funnel-wrap" id="funnelContainer"></div>

    <div class="refresh-time">
      🔄 Auto-refreshing every 10 seconds | Last update: <span id="lastUpdate">--:--:--</span>
    </div>
  </div>

  <script>
    const STAGES = [
      { key: 'active_future',      icon: '🎯', name: 'Active Future',     desc: 'Ready for pitch' },
      { key: 'event_scheduled',    icon: '📅', name: 'Event Scheduled',   desc: 'Date confirmed' },
      { key: 'event_done_success', icon: '✅', name: 'Done — Success',    desc: 'Event successful' },
      { key: 'event_done_review',  icon: '📸', name: 'Done — Review',     desc: 'Awaiting testimonial' },
      { key: 'cancelled',          icon: '❌', name: 'Cancelled',         desc: 'Event cancelled' },
      { key: 'rejected_offer',     icon: '🚫', name: 'Rejected',          desc: 'Rejected pitch' },
      { key: 'pending_followup',   icon: '📞', name: 'Pending Followup',  desc: 'Needs clarification' },
      { key: 'out_of_scope',       icon: '⬜', name: 'Out of Scope',      desc: 'Not relevant' }
    ];

    async function getBackendUrl() {
      try {
        const r = await fetch('./backend_url.json?_=' + Date.now());
        if (r.ok) { const j = await r.json(); if (j && j.url) return j.url.replace(/\/$/, ''); }
      } catch (_) {}
      return 'http://127.0.0.1:8878';
    }

    async function fetchData() {
      const base = await getBackendUrl();
      try {
        const response = await fetch(`${base}/api/dm_direct_funnel`, { cache: 'no-store' });
        if (!response.ok) throw new Error('API ' + response.status);
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error('Fetch error:', error);
        document.getElementById('lastUpdate').textContent = 'API unavailable';
      }
    }

    function updateUI(data) {
      const leads   = data.leads || [];
      const byStage = data.by_stage || {};

      const html = STAGES.map(stage => {
        const count = byStage[stage.key] || 0;
        const stageLeads = leads.filter(l => l.stage === stage.key).slice(0, 3);

        return `
          <div class="funnel-box">
            <div style="font-size:24px;margin-bottom:8px">${stage.icon}</div>
            <div class="funnel-num">${count}</div>
            <div class="funnel-name">${stage.name}</div>
            <div class="funnel-desc">${stage.desc}</div>
            ${stageLeads.length > 0 ? `
              <div style="font-size:11px;color:var(--muted);margin-top:8px">
                ${stageLeads.map(l => '@' + (l.username || '')).join(', ')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('funnelContainer').innerHTML = html;
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    fetchData();
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
