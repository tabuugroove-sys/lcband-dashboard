<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Direct Funnel</title>
  <style>
    :root {
      --bg:       #0a0a12;
      --card:     #13131f;
      --border:   #23233a;
      --gold:     #f5c518;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --ok:       #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      padding: 20px;
    }
    .app { max-width: 1200px; margin: 0 auto; }

    h1 { font-size: 28px; margin-bottom: 10px; color: var(--gold); }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 30px; }

    .funnel-wrap {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 30px;
      padding: 10px 0;
    }
    .funnel-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      min-width: 140px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .funnel-box:hover {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(245,197,24,0.2);
    }
    .funnel-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .funnel-name {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .funnel-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }

    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .lead-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .lead-username {
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .lead-info {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .refresh-time {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app">
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
      <a href="./index.html" style="padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; background:rgba(245,197,24,0.12); color:#f5c518; border:1px solid rgba(245,197,24,0.35);">← Дашборд</a>
      <a href="./events.html" style="padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; background:rgba(63,185,80,0.12); color:#3fb950; border:1px solid rgba(63,185,80,0.35);">📋 Events</a>
      <a href="./architecture.html" style="padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; background:rgba(188,140,255,0.12); color:#bc8cff; border:1px solid rgba(188,140,255,0.35);">🧠 Архитектура</a>
    </div>
    <h1>📊 DM Direct Funnel — 7-Stage Pipeline</h1>
    <div class="subtitle">Real-time direct message leads distribution</div>

    <div class="funnel-wrap" id="funnelContainer"></div>

    <div class="refresh-time">
      🔄 Auto-refreshing every 10 seconds | Last update: <span id="lastUpdate">--:--:--</span>
    </div>
  </div>

  <script>
    const STAGES = [
      { key: 'active_future', icon: '🎯', name: 'Active Future', desc: 'Ready for pitch' },
      { key: 'event_scheduled', icon: '📅', name: 'Event Scheduled', desc: 'Date confirmed' },
      { key: 'event_done_success', icon: '✅', name: 'Done — Success', desc: 'Event successful' },
      { key: 'event_done_review', icon: '📸', name: 'Done — Review', desc: 'Awaiting testimonial' },
      { key: 'canceled_by_client', icon: '❌', name: 'Canceled', desc: 'Event canceled' },
      { key: 'rejected_offer', icon: '🚫', name: 'Rejected', desc: 'Rejected pitch' },
      { key: 'pending_followup', icon: '📞', name: 'Pending Followup', desc: 'Needs clarification' },
      { key: 'out_of_scope', icon: '⬜', name: 'Out of Scope', desc: 'Not relevant' }
    ];

    const API_URL = 'http://localhost:8878/api/dm_direct_funnel';

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error('Fetch error:', error);
        document.getElementById('lastUpdate').textContent = 'API unavailable';
      }
    }

    function updateUI(data) {
      const leads = data.leads || [];
      const byStage = data.by_stage || {};

      const html = STAGES.map(stage => {
        const count = byStage[stage.key] || 0;
        const stageLeads = leads.filter(l => l.stage === stage.key).slice(0, 3);

        return `
          <div class="funnel-box">
            <div style="font-size:24px;margin-bottom:8px">${stage.icon}</div>
            <div class="funnel-num">${count}</div>
            <div class="funnel-name">${stage.name}</div>
            <div class="funnel-desc">${stage.desc}</div>
            ${stageLeads.length > 0 ? `
              <div style="font-size:11px;color:var(--muted);margin-top:8px">
                ${stageLeads.map(l => `@${l.username}`).join(', ')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('funnelContainer').innerHTML = html;
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    fetchData();
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
