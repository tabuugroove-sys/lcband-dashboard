<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LCB Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LCB" />
  <style>
    :root {
      --bg:       #0a0a12;
      --card:     #13131f;
      --card2:    #1a1a2a;
      --border:   #23233a;
      --gold:     #f5c518;
      --gold-dim: #c9a20044;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --ok:       #10b981;
      --warn:     #f59e0b;
      --err:      #ef4444;
      --blue:     #3b82f6;
      --r:        12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }
    #root { min-height: 100%; }

    /* ── App shell ── */
    .app { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }

    /* Чуть шире на планшете/десктопе — контент дышит, но mobile не ломаем */
    .app { transition: max-width .25s ease, margin .25s ease; }
    @media (min-width: 768px) {
      .app { max-width: 720px; }
    }
    @media (min-width: 1024px) {
      .app {
        max-width: calc(100vw - 32px);
        padding-left: 16px;
        padding-right: 16px;
      }
    }
    @media (min-width: 1728px) {
      .app { max-width: 1680px; }
    }

    /* Когда открыт чат-панель (440px справа) — сдвигаем .app так,
       чтобы правая граница контента УПИРАЛАСЬ в левый край панели */
    @media (min-width: 900px) {
      body.chat-open .app {
        max-width: calc(100vw - 440px - 16px);
        margin-left: 16px;
        margin-right: 440px;
      }
      /* 06.06: переписка слева (hover брокер-заказа) — зеркалим сдвиг на левый край */
      body.chat-open-left .app {
        max-width: calc(100vw - 440px - 16px);
        margin-left: 440px;
        margin-right: 16px;
      }
    }

    /* Шире → KPI-плитки могут быть 4-6 в ряд */
    @media (min-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .kpi-row  { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(6, 1fr); }
      .kpi-row  { grid-template-columns: repeat(5, 1fr); }
      .kpi-val  { font-size: 28px; }
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(180deg, #0f0f20 0%, #0a0a12 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px env(safe-area-inset-top, 0);
      position: sticky; top: 0; z-index: 100;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .header-brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .header-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .header-nav::-webkit-scrollbar { display: none; }
    .header-note { font-size: 20px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.3px; }
    .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .refresh-btn {
      background: rgba(245,197,24,.08);
      border: 1px solid rgba(245,197,24,.2);
      border-radius: 8px; color: var(--gold);
      padding: 6px 14px; font-size: 13px; cursor: pointer;
      transition: opacity .15s;
    }
    .refresh-btn:active { opacity: .6; }
    .refresh-btn:disabled { opacity: .4; cursor: default; }
    .spin { display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .theme-header-btn {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .theme-header-btn:hover { filter: brightness(1.08); }
    /* Light theme: текст максимально контрастный — чистый чёрный.
       --text/--fg/--muted ранее наследовали тёмные значения и в light-режиме
       выглядели низкоконтрастными (бледно-серый на белом). user rule 13.06. */
    html[data-theme="light"] {
      --text:  #000000;
      --fg:    #000000;
      --muted: #1a1a1a;
    }
    html[data-theme="light"] body,
    html[data-theme="light"] .funnel-expand-title,
    html[data-theme="light"] .funnel-lead-name,
    html[data-theme="light"] .funnel-branch-chip-num {
      color: #000000;
    }
    html[data-theme="light"] .header {
      background: #ffffff;
      border-bottom-color: #e5e5e7;
      box-shadow: 0 8px 22px rgba(0,0,0,.04);
    }
    html[data-theme="light"] .header-title { color: var(--gold); }
    html[data-theme="light"] .theme-header-btn {
      background: #f6f8fa !important;
      color: #1a1a1a !important;
      border-color: #d0d7de !important;
    }
    /* На главной переключатель живёт в header, нижнюю floating-кнопку прячем. */
    .lcb-theme-toggle { display: none !important; }

    /* ── Sections ── */
    .section { padding: 14px 14px 0; }
    .section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.4px; color: var(--muted); margin-bottom: 10px;
    }

    /* ── KPI top row ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 8px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 8px; text-align: center;
      position: relative;
    }
    .kpi-emoji { font-size: 18px; margin-bottom: 4px; }
    .kpi-val { font-size: 24px; font-weight: 800; color: var(--gold); line-height: 1; }
    .kpi-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ── KPI secondary ── */
    .kpi-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .kpi-mini {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px;
      position: relative;
    }
    .kpi-mini-val { font-size: 18px; font-weight: 700; }
    .kpi-mini-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Info-иконка + кастомная подсказка ── */
    .kpi-info {
      position: absolute; top: 5px; right: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(96,165,250,0.15); color: var(--blue);
      font-size: 10px; font-weight: 700; font-family: serif;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: help; opacity: 0.55; user-select: none;
      transition: opacity .15s, background .15s;
    }
    .kpi-info:hover, .kpi-info:focus { opacity: 1; background: rgba(96,165,250,0.3); outline: none; }
    .kpi-tip {
      visibility: hidden; opacity: 0;
      position: absolute; z-index: 60;
      top: 24px; right: 0;
      width: 220px; padding: 8px 10px;
      background: #1e293b; color: #e2e8f0;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 11px; line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      text-align: left; white-space: normal;
      transition: opacity .15s, visibility .15s;
      pointer-events: none;
    }
    .kpi-info:hover + .kpi-tip,
    .kpi-info:focus + .kpi-tip { visibility: visible; opacity: 1; }

    /* ── Клик по KPI-карточке = навигация к заказам/табу ── */
    .kpi-clickable { cursor: pointer; transition: transform .12s, border-color .12s, background .12s; }
    .kpi-clickable:hover { transform: translateY(-1px); border-color: var(--blue);
                            background: rgba(96,165,250,0.06); }
    .kpi-clickable:active { transform: translateY(0); }

    /* ── Funnel ── */
    .funnel-wrap {
      display: flex; overflow-x: auto; gap: 0; padding: 2px 0 10px;
      scrollbar-width: none;
    }
    .funnel-wrap::-webkit-scrollbar { display: none; }
    .funnel-step { display: flex; align-items: center; flex-shrink: 0; }
    .funnel-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px 12px; text-align: center; min-width: 76px;
    }
    .funnel-num { font-size: 22px; font-weight: 800; color: var(--gold); }
    .funnel-name { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
    .funnel-pct { font-size: 9px; color: var(--ok); margin-top: 2px; }
    .funnel-arr { color: var(--muted); font-size: 14px; padding: 0 3px; flex-shrink: 0; }
    .funnel-box--clickable { cursor: pointer; transition: border-color .15s, transform .12s; }
    .funnel-box--clickable:hover { border-color: var(--gold); transform: translateY(-1px); }
    .funnel-box--active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }

    /* ── Funnel expanded leads panel ── */
    .funnel-expand {
      margin-top: 12px; background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px;
    }
    .funnel-expand-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .funnel-expand-title { font-size: 13px; font-weight: 700; color: var(--fg); }
    .funnel-expand-count { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .funnel-expand-close {
      background: transparent; border: none; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 4px 8px;
    }
    .funnel-expand-close:hover { color: var(--gold); }
    .funnel-lead-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 420px; overflow-y: auto;
    }
    .funnel-lead-card {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .funnel-lead-info { flex: 1; min-width: 0; }
    .funnel-lead-name { font-size: 13px; font-weight: 600; color: var(--fg); }
    .funnel-lead-status { font-size: 10px; color: var(--blue); font-weight: 600; margin-left: 4px; }
    .funnel-lead-meta {
      font-size: 10px; color: var(--muted); margin-top: 3px;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .funnel-lead-desc {
      font-size: 11px; color: var(--muted); margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .funnel-lead-chat {
      flex-shrink: 0; background: var(--card2); border: 1px solid var(--border);
      color: var(--fg); border-radius: 6px; padding: 8px 12px;
      font-size: 15px; text-decoration: none; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, color .15s;
    }
    .funnel-lead-chat:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    .funnel-lead-chat--disabled { opacity: 0.35; cursor: default; pointer-events: none; }

    /* ── Funnel branches row (under main strip) ── */
    .funnel-branches-wrap {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 8px; padding: 0 2px;
    }
    .funnel-branch-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px dashed var(--border);
      border-radius: 8px; padding: 5px 9px;
      font-size: 10px; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .funnel-branch-chip:hover { border-color: var(--gold); color: var(--fg); border-style: solid; }
    .funnel-branch-chip--active { border-color: var(--gold); border-style: solid; color: var(--fg); background: var(--card); }
    .funnel-branch-chip-icon { font-size: 12px; }
    .funnel-branch-chip-num { font-weight: 700; color: var(--fg); }
    .funnel-branch-chip-parent { font-size: 9px; color: var(--muted); opacity: 0.7; }

    /* ── Orders ── */
    .orders-list { display: flex; flex-direction: column; gap: 8px; }
    .order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .order-info { flex: 1; min-width: 0; }
    .order-client { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .order-desc-preview {
      font-size: 11px; color: var(--muted); margin-top: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0.8;
    }
    .order-card-hoverable { position: relative; }
    .order-card-hoverable:hover { border-color: var(--blue); }
    .order-tip {
      visibility: hidden; opacity: 0;
      position: absolute; z-index: 50;
      padding: 12px 14px;
      background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      font-size: 12px; line-height: 1.5;
      transition: opacity .15s, visibility .15s;
      pointer-events: none;
    }
    .order-tip-side-left > .order-tip {
      top: 0; right: calc(100% + 8px); left: auto;
      width: 440px; max-width: calc(100vw - 40px);
    }
    .order-tip-side-right > .order-tip {
      top: 0; left: calc(100% + 8px); right: auto;
      width: 440px; max-width: calc(100vw - 40px);
    }
    .order-tip-side-bottom > .order-tip {
      top: calc(100% + 6px); left: 0; right: 0;
      max-width: 520px;
    }
    .order-card-hoverable:hover .order-tip,
    .order-card-hoverable:focus-within .order-tip { visibility: visible; opacity: 1; }
    .order-tip-label {
      font-size: 10px; font-weight: 700; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .order-tip-body {
      font-size: 12px; color: #e2e8f0; white-space: pre-wrap;
      max-height: 180px; overflow-y: auto;
    }
    .order-tip-history { font-size: 11px; color: #cbd5e1; }
    .order-tip-hist-line {
      padding: 3px 0; border-top: 1px solid #1e293b;
    }
    .order-tip-hist-line:first-child { border-top: none; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 3px 9px;
      border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .badge-new  { background: rgba(59,130,246,.15); color: #60a5fa; }
    .badge-wip  { background: rgba(16,185,129,.15);  color: #34d399; }
    .badge-done { background: rgba(245,197,24,.15);  color: var(--gold); }
    .badge-no   { background: rgba(239,68,68,.15);   color: #f87171; }
    .badge-gray { background: rgba(100,116,139,.15); color: var(--muted); }

    /* ── Process status ── */
    .status-list { display: flex; flex-direction: column; gap: 6px; }
    .status-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .process-tip-row > .order-tip {
      top: calc(100% + 6px); right: 12px; left: auto;
      width: 520px; max-width: calc(100vw - 80px);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-ok   { background: var(--ok);   box-shadow: 0 0 6px var(--ok); }
    .dot-warn { background: var(--warn); }
    .dot-err  { background: var(--err);  }
    .dot-unk  { background: var(--muted); }
    .status-name { flex: 1; font-size: 13px; }
    .status-age  { font-size: 11px; color: var(--muted); }

    /* ── Followups ── */
    .followup-list { display: flex; flex-direction: column; gap: 6px; }

    /* ── Scan status (REMOVED 16.05.2026: TG-scan widget удалён — устаревший) ── */
    .followup-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .followup-left { min-width: 0; }
    .followup-user { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .followup-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .chip {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 12px; flex-shrink: 0; white-space: nowrap;
    }
    .chip-noreply    { background: rgba(100,116,139,.15); color: var(--muted); }
    .chip-interested { background: rgba(245,197,24,.15);  color: var(--gold); }
    .chip-customer   { background: rgba(16,185,129,.15);  color: var(--ok); }
    .chip-declined   { background: rgba(239,68,68,.15);   color: #f87171; }

    /* ── Overdue order alert ── */
    @keyframes pulse-overdue {
      0%, 100% { border-color: rgba(239,68,68,.55); box-shadow: 0 0 8px rgba(239,68,68,.25); }
      50% { border-color: rgba(239,68,68,1); box-shadow: 0 0 18px rgba(239,68,68,.55); }
    }
    .order-card-overdue {
      animation: pulse-overdue 1.6s ease infinite;
      border-color: rgba(239,68,68,.55) !important;
      background: rgba(239,68,68,.05) !important;
    }

    /* ── Loading skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skel {
      background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--r);
    }

    /* ── Error ── */
    .err-box {
      background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25);
      border-radius: var(--r); padding: 14px; margin: 14px;
      font-size: 13px; color: #f87171; line-height: 1.5;
    }
    .err-box small { color: var(--muted); display: block; margin-top: 6px; }

    /* ── Offline pill ── */
    .offline-pill {
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
      border-radius: 20px; padding: 3px 10px; font-size: 11px; color: #f87171;
      display: inline-block; margin-left: 8px;
    }

    /* ── Connection status ── */
    .conn-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    .conn-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .conn-dot-ok    { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
    .conn-dot-err   { background: var(--err);  box-shadow: 0 0 8px var(--err); animation: pulse-err 1.5s ease infinite; }
    .conn-dot-deg   { background: #fbbf24;     box-shadow: 0 0 8px #fbbf24; }
    .conn-dot-unk   { background: var(--muted); }
    @keyframes pulse-err {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .conn-info { flex: 1; min-width: 0; }
    .conn-label { font-size: 13px; font-weight: 600; }
    .conn-purpose { font-size: 11px; color: var(--muted); margin-top: 1px; line-height: 1.25; }
    .conn-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .conn-extra {
      flex-basis: 100%;
      margin-left: 24px;
      margin-top: 10px;
    }
    .conn-tg-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px; margin-bottom: 8px;
    }
    .tg-chat-list { margin-top: 6px; }
    .tg-chat-list-header {
      font-size: 10px; color: #8b949e; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
    }
    .tg-chat-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .tg-chat-chip {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 10px; font-size: 10px;
      border: 1px solid rgba(255,255,255,.08);
    }
    .tg-chat-chip.chat-pub { background: rgba(110,215,106,.08); color: #7ee787; border-color: rgba(110,215,106,.18); }
    .tg-chat-chip.chat-priv { background: rgba(255,123,114,.08); color: #ff9e9e; border-color: rgba(255,123,114,.18); }
    .conn-actions {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
      min-width: 88px;
    }
    .conn-reconnect-btn {

    .conn-sessions { display: flex; gap: 8px; margin-top: 8px; }
    .conn-session-chip {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      display: flex; align-items: center; gap: 4px;
    }
    .conn-chip-ok  { background: rgba(16,185,129,.12); color: var(--ok); }
    .conn-chip-err { background: rgba(239,68,68,.12); color: #f87171; }
    .conn-chip-unk { background: rgba(100,116,139,.12); color: var(--muted); }

    /* ── Action buttons ── */
    .action-btns { display: flex; gap: 8px; margin: 4px 16px 0; }
    .action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px 8px;
      color: var(--text); font-size: 12px; font-weight: 600;
      text-decoration: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .action-btn:active { background: var(--card2); }
    .action-btn-restart { border-color: rgba(16,185,129,.3); }
    .action-btn-restart:active { background: rgba(16,185,129,.08); }
    .action-btn-status { border-color: rgba(59,130,246,.3); }
    .action-btn-status:active { background: rgba(59,130,246,.08); }

    /* ── Empty state ── */
    .empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 13px; }

    /* ── TG Leads button ── */
    .tg-leads-btn {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px; width: 100%;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .tg-leads-btn:active { background: var(--card2); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.72);
      display: flex; align-items: flex-end;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal-sheet {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
      margin: 0 auto; padding: 12px 16px 36px;
      animation: slideUp .22s ease;
    }
    .modal-sheet.ai-layer-sheet {
      max-width: min(920px, calc(100vw - 24px));
      max-height: min(86vh, 820px);
      overflow: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity:.5; }
      to   { transform: translateY(0);    opacity:1; }
    }
    .modal-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--border); margin: 0 auto 12px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .modal-close {
      background: none; border: none; color: var(--muted);
      font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .ai-layer-card {
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .ai-layer-card:hover {
      border-color: rgba(245,197,24,.55) !important;
      background: rgba(139,92,246,.14) !important;
      transform: translateY(-1px);
    }
    .pipeline-gates {
      background: rgba(15,23,42,.5);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 9px;
      padding: 9px 10px;
      display: grid;
      gap: 8px;
    }
    .pipeline-gates-title {
      font-size: 10.5px;
      font-weight: 900;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: .45px;
    }
    .pipeline-gates-sub {
      font-size: 8.5px;
      color: var(--muted);
    }
    .pipeline-gate-card {
      background: rgba(2,6,23,.42);
      border: 1px solid var(--gate-accent);
      border-radius: 7px;
      padding: 7px 8px;
      min-width: 0;
    }
    .pipeline-gate-heading {
      font-size: 9.5px;
      font-weight: 850;
      color: var(--gate-accent);
      margin-bottom: 5px;
    }
    .pipeline-gate-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 5px;
      align-items: start;
    }
    .pipeline-gate-code {
      font-size: 7.7px;
      color: var(--gate-accent);
      background: rgba(148,163,184,.08);
      border: 1px solid rgba(148,163,184,.12);
      padding: 1px 4px;
      border-radius: 4px;
      white-space: normal;
      line-height: 1.25;
    }
    .pipeline-gate-desc {
      font-size: 8.2px;
      color: #cbd5e1;
      line-height: 1.25;
    }
    .pipeline-gates-owner {
      font-size: 8.2px;
      color: #94a3b8;
      line-height: 1.35;
    }
    html[data-theme="light"] .pipeline-gates {
      background: #ffffff !important;
      border-color: #d0d7de !important;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    html[data-theme="light"] .pipeline-gates-title {
      color: #1f2328 !important;
    }
    html[data-theme="light"] .pipeline-gate-card {
      background: #f6f8fa !important;
      border-color: #d0d7de !important;
      box-shadow: inset 3px 0 0 var(--gate-accent-light);
    }
    html[data-theme="light"] .pipeline-gate-heading {
      color: var(--gate-accent-light) !important;
    }
    html[data-theme="light"] .pipeline-gate-code {
      background: #ffffff !important;
      color: var(--gate-accent-light) !important;
      border-color: #d0d7de !important;
    }
    html[data-theme="light"] .pipeline-gate-desc {
      color: #1f2328 !important;
    }
    html[data-theme="light"] .pipeline-gates-owner {
      color: #656d76 !important;
    }
    .ai-layer-source {
      display: flex; flex-direction: column; gap: 5px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .ai-layer-prompt {
      background: #0d1117; border: 1px solid rgba(148,163,184,.22);
      border-radius: 8px; padding: 10px; max-height: 280px; overflow: auto;
      white-space: pre-wrap; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #cbd5e1;
    }

    /* ── Period tabs ── */
    .period-tabs {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 6px;
      margin-bottom: 18px;
    }
    .period-tab {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted);
      padding: 8px 4px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .15s;
    }
    .period-tab.active {
      background: rgba(245,197,24,.1); border-color: rgba(245,197,24,.35);
      color: var(--gold);
    }

    /* ── TG Funnel in modal ── */
    .tg-funnel-list { display: flex; flex-direction: column; gap: 14px; }
    .tg-funnel-item-header {
      display: flex; justify-content: space-between; margin-bottom: 6px;
    }
    .tg-funnel-item-label { font-size: 12px; color: var(--muted); }
    .tg-funnel-item-conv  { font-size: 11px; color: var(--ok); font-weight: 600; }
    .tg-funnel-bar-track  {
      background: var(--card2); border-radius: 8px; height: 44px; overflow: hidden;
    }
    .tg-funnel-bar-fill {
      height: 100%; border-radius: 8px; min-width: 44px;
      display: flex; align-items: center; padding-left: 14px;
      transition: width .35s ease;
    }
    .tg-funnel-bar-num { font-size: 20px; font-weight: 800; color: #fff; }
    .tg-earned-row {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tg-earned-label { font-size: 13px; color: var(--muted); }
    .tg-earned-val { font-size: 22px; font-weight: 800; color: var(--ok); }
    /* ── Chat panel (slide from side) ── */
    .chat-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(440px, 100vw); background: #0e0e18; border-left: 1px solid var(--border);
      box-shadow: -6px 0 24px rgba(0,0,0,.4); display: flex; flex-direction: column; z-index: 100;
      transform: translateX(100%); transition: transform .25s ease;
    }
    .chat-panel.left {
      left: 0; right: auto; border-left: none; border-right: 1px solid var(--border);
      box-shadow: 6px 0 24px rgba(0,0,0,.4);
      transform: translateX(-100%);
    }
    .chat-panel.open { transform: translateX(0); }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.02);
    }
    .chat-title { font-weight: 700; font-size: 15px; }
    .chat-sub { font-size: 11px; color: var(--muted); }
    .chat-close {
      background: transparent; border: none; color: var(--muted); font-size: 22px; cursor: pointer;
      padding: 0 6px; line-height: 1;
    }
    .chat-close:hover { color: var(--text); }
    .chat-body {
      flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .chat-msg {
      max-width: 82%; padding: 7px 10px; border-radius: 12px; font-size: 13px; line-height: 1.35;
      word-wrap: break-word; white-space: pre-wrap;
    }
    .chat-msg-in  { align-self: flex-start; background: rgba(255,255,255,.06); border-top-left-radius: 4px; }
    .chat-msg-out { align-self: flex-end;   background: rgba(34,197,94,.18);   border-top-right-radius: 4px; }
    .chat-msg-time { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .chat-loading { padding: 30px; text-align: center; color: var(--muted); font-size: 12px; }
    .chat-input-row {
      padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end;
      background: rgba(255,255,255,.02);
    }
    .chat-input {
      flex: 1; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 8px; font-size: 13px; resize: none; font-family: inherit;
      min-height: 38px; max-height: 120px;
    }
    .chat-input:focus { outline: 1px solid var(--blue); }
    .chat-send {
      background: var(--blue); color: white; border: none; padding: 9px 14px; border-radius: 8px;
      font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-send:not(:disabled):hover { filter: brightness(1.1); }
    .chat-error {
      padding: 8px 12px; background: rgba(239,68,68,.15); color: #fca5a5; font-size: 12px; margin: 8px 14px;
      border-radius: 6px;
    }
    .order-card[data-clickable="true"] { cursor: pointer; transition: background .15s; }
    .order-card[data-clickable="true"]:hover { background: rgba(96,165,250,.08) !important; }

    /* ── 26.06 design pass: two-mode operations console ──
       Смысловая карта: клиентская воронка = золото, broker/ops = teal,
       infra/processes = blue, risk/recovery = red. Light mode keeps high contrast. */
    :root {
      --surface: #11121c;
      --surface-strong: #171927;
      --surface-soft: #0e1019;
      --ink-strong: #f8fafc;
      --ink: #d8dee9;
      --ink-muted: #9aa8bd;
      --line: rgba(142, 154, 180, .22);
      --shadow-soft: 0 12px 36px rgba(0, 0, 0, .26);
      --accent-client: #f5c542;
      --accent-client-ink: #ffd86b;
      --accent-ops: #2dd4bf;
      --accent-infra: #7db7ff;
      --accent-risk: #ff6b74;
      --accent-ok: #19c37d;
      --pill-bg: rgba(255,255,255,.045);
    }
    html[data-theme="light"] {
      --bg: #f7f7f4;
      --card: #ffffff;
      --card2: #f1f3f0;
      --border: #d9ded6;
      --surface: #ffffff;
      --surface-strong: #fdfdfb;
      --surface-soft: #eef1ed;
      --text: #16181d;
      --fg: #16181d;
      --ink-strong: #111318;
      --ink: #222833;
      --ink-muted: #4c5665;
      --muted: #4c5665;
      --line: rgba(42, 50, 62, .16);
      --gold: #8b5d00;
      --blue: #005fbd;
      --ok: #087443;
      --warn: #a15c00;
      --err: #b4232c;
      --accent-client: #9a6700;
      --accent-client-ink: #7a4f00;
      --accent-ops: #00796b;
      --accent-infra: #075fb8;
      --accent-risk: #bd1e2d;
      --accent-ok: #087443;
      --pill-bg: rgba(21, 25, 32, .045);
      --shadow-soft: 0 12px 30px rgba(25, 31, 38, .09);
    }
    body {
      background:
        radial-gradient(circle at 18% -10%, rgba(245,197,66,.13), transparent 26%),
        radial-gradient(circle at 100% 0%, rgba(45,212,191,.10), transparent 24%),
        linear-gradient(180deg, var(--bg) 0%, var(--surface-soft) 100%);
      color: var(--ink);
    }
    html[data-theme="light"] body {
      background:
        linear-gradient(90deg, rgba(22,24,29,.035) 1px, transparent 1px),
        linear-gradient(180deg, #fbfbf8 0%, #f2f4ef 100%) !important;
      background-size: 48px 48px, auto;
      color: var(--ink) !important;
    }
    .app { max-width: 1500px; }
    .header {
      background: rgba(10,10,18,.82);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(0,0,0,.24);
      backdrop-filter: blur(18px) saturate(1.1);
    }
    html[data-theme="light"] .header {
      background: rgba(253,253,251,.90) !important;
      border-bottom-color: #d9ded6 !important;
      box-shadow: 0 10px 26px rgba(25,31,38,.08) !important;
    }
    .header-title {
      color: var(--accent-client-ink);
      font-size: 19px;
      letter-spacing: 0;
    }
    .header-sub { color: var(--ink-muted); }
    .header-nav a,
    .theme-header-btn,
    .refresh-btn {
      min-height: 36px;
      border-radius: 8px !important;
      background: var(--pill-bg) !important;
      color: var(--ink) !important;
      border: 1px solid var(--line) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      font-weight: 780 !important;
    }
    .header-nav a:hover,
    .theme-header-btn:hover,
    .refresh-btn:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent-infra) 48%, var(--line)) !important;
      color: var(--ink-strong) !important;
    }
    html[data-theme="light"] .header-nav a,
    html[data-theme="light"] .theme-header-btn,
    html[data-theme="light"] .refresh-btn {
      background: #fff !important;
      color: #16181d !important;
      border-color: #ccd4cd !important;
      box-shadow: 0 1px 2px rgba(25,31,38,.06);
    }
    html[data-theme="light"] .header-nav a span,
    html[data-theme="light"] .theme-header-btn span { color: inherit !important; }
    .section {
      padding: 18px 14px 0;
    }
    .section-title {
      color: var(--ink-muted);
      letter-spacing: 1.7px;
      font-size: 10.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: "";
      width: 18px;
      height: 2px;
      border-radius: 999px;
      background: var(--accent-client);
      opacity: .78;
    }
    .conn-card,
    .kpi-card,
    .kpi-mini,
    .funnel-box,
    .funnel-expand,
    .funnel-lead-card,
    .order-card,
    .status-row,
    .followup-card,
    .tg-earned-row,
    .tg-leads-btn,
    .card {
      background: linear-gradient(180deg, var(--surface-strong), var(--surface)) !important;
      border: 1px solid var(--line) !important;
      color: var(--ink) !important;
      box-shadow: var(--shadow-soft);
    }
    html[data-theme="light"] .conn-card,
    html[data-theme="light"] .kpi-card,
    html[data-theme="light"] .kpi-mini,
    html[data-theme="light"] .funnel-box,
    html[data-theme="light"] .funnel-expand,
    html[data-theme="light"] .funnel-lead-card,
    html[data-theme="light"] .order-card,
    html[data-theme="light"] .status-row,

<script>
// Service Worker registration + periodic version check.
// Проблема была: SW кешировал index.html и пользователь не видел новые
// деплои даже после reload. v29 переключил SW на network-first, плюс
// этот блок сам ловит новые деплои каждые 60с по Last-Modified.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(r => {
        console.log('[SW] registered', r.scope);
        // Force update check on each page load
        r.update();
      })
      .catch(e => console.log('[SW] failed', e));
  });
}

// ─── Auto-update check (Last-Modified polling) ────────────────────
(function setupVersionCheck() {
  let initialLastModified = null;
  let bannerShown = false;

  async function checkVersion() {
    try {
      const r = await fetch('./index.html', {
        method: 'HEAD',
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' },
      });
      const lm = r.headers.get('Last-Modified') || r.headers.get('ETag');
      if (!lm) return;
      if (initialLastModified === null) {
        initialLastModified = lm;
        return;
      }
      if (lm !== initialLastModified && !bannerShown) {
        showUpdateBanner();
        bannerShown = true;
      }
    } catch (e) {
      // network down or other issue — silently retry next tick
    }
  }

  function showUpdateBanner() {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#3fb950;color:#0d1117;padding:10px 16px;font:600 14px system-ui;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,0.4);';
    banner.innerHTML = '🔄 Доступна новая версия дашборда — <button id="reload-now" style="background:#0d1117;color:#3fb950;border:none;padding:6px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;">обновить</button>';
    document.body.appendChild(banner);
    document.getElementById('reload-now').onclick = async () => {
      // Очистить SW caches и перезагрузить
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      location.reload();
    };
  }

  // First check after 5s (let page settle), then every 60s
  setTimeout(checkVersion, 5000);
  setInterval(checkVersion, 60000);
})();
</script>
