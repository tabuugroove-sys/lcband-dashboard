<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LCB Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LCB" />
  <style>
    :root {
      --bg:       #0a0a12;
      --card:     #13131f;
      --card2:    #1a1a2a;
      --border:   #23233a;
      --gold:     #f5c518;
      --gold-dim: #c9a20044;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --ok:       #10b981;
      --warn:     #f59e0b;
      --err:      #ef4444;
      --blue:     #3b82f6;
      --r:        12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }
    #root { min-height: 100%; }

    /* ── App shell ── */
    .app { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }

    /* Чуть шире на планшете/десктопе — контент дышит, но mobile не ломаем */
    .app { transition: max-width .25s ease, margin .25s ease; }
    @media (min-width: 768px) {
      .app { max-width: 720px; }
    }
    @media (min-width: 1024px) {
      .app { max-width: 960px; padding-left: 16px; padding-right: 16px; }
    }
    @media (min-width: 1440px) {
      .app { max-width: 1180px; }
    }

    /* Когда открыт чат-панель (440px справа) — сдвигаем .app так,
       чтобы правая граница контента УПИРАЛАСЬ в левый край панели */
    @media (min-width: 900px) {
      body.chat-open .app {
        max-width: calc(100vw - 440px - 16px);
        margin-left: 16px;
        margin-right: 440px;
      }
    }

    /* Шире → KPI-плитки могут быть 4-6 в ряд */
    @media (min-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .kpi-row  { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(6, 1fr); }
      .kpi-row  { grid-template-columns: repeat(5, 1fr); }
      .kpi-val  { font-size: 28px; }
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(180deg, #0f0f20 0%, #0a0a12 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px env(safe-area-inset-top, 0);
      position: sticky; top: 0; z-index: 100;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .header-brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .header-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .header-nav::-webkit-scrollbar { display: none; }
    .header-note { font-size: 20px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.3px; }
    .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .refresh-btn {
      background: rgba(245,197,24,.08);
      border: 1px solid rgba(245,197,24,.2);
      border-radius: 8px; color: var(--gold);
      padding: 6px 14px; font-size: 13px; cursor: pointer;
      transition: opacity .15s;
    }
    .refresh-btn:active { opacity: .6; }
    .refresh-btn:disabled { opacity: .4; cursor: default; }
    .spin { display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .theme-header-btn {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .theme-header-btn:hover { filter: brightness(1.08); }
    html[data-theme="light"] .header {
      background: #ffffff;
      border-bottom-color: #e5e5e7;
      box-shadow: 0 8px 22px rgba(0,0,0,.04);
    }
    html[data-theme="light"] .header-title { color: var(--gold); }
    html[data-theme="light"] .theme-header-btn {
      background: #f6f8fa !important;
      color: #1a1a1a !important;
      border-color: #d0d7de !important;
    }
    /* На главной переключатель живёт в header, нижнюю floating-кнопку прячем. */
    .lcb-theme-toggle { display: none !important; }

    /* ── Sections ── */
    .section { padding: 14px 14px 0; }
    .section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.4px; color: var(--muted); margin-bottom: 10px;
    }

    /* ── KPI top row ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 8px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 8px; text-align: center;
      position: relative;
    }
    .kpi-emoji { font-size: 18px; margin-bottom: 4px; }
    .kpi-val { font-size: 24px; font-weight: 800; color: var(--gold); line-height: 1; }
    .kpi-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ── KPI secondary ── */
    .kpi-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .kpi-mini {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px;
      position: relative;
    }
    .kpi-mini-val { font-size: 18px; font-weight: 700; }
    .kpi-mini-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Info-иконка + кастомная подсказка ── */
    .kpi-info {
      position: absolute; top: 5px; right: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(96,165,250,0.15); color: var(--blue);
      font-size: 10px; font-weight: 700; font-family: serif;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: help; opacity: 0.55; user-select: none;
      transition: opacity .15s, background .15s;
    }
    .kpi-info:hover, .kpi-info:focus { opacity: 1; background: rgba(96,165,250,0.3); outline: none; }
    .kpi-tip {
      visibility: hidden; opacity: 0;
      position: absolute; z-index: 60;
      top: 24px; right: 0;
      width: 220px; padding: 8px 10px;
      background: #1e293b; color: #e2e8f0;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 11px; line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      text-align: left; white-space: normal;
      transition: opacity .15s, visibility .15s;
      pointer-events: none;
    }
    .kpi-info:hover + .kpi-tip,
    .kpi-info:focus + .kpi-tip { visibility: visible; opacity: 1; }

    /* ── Клик по KPI-карточке = навигация к заказам/табу ── */
    .kpi-clickable { cursor: pointer; transition: transform .12s, border-color .12s, background .12s; }
    .kpi-clickable:hover { transform: translateY(-1px); border-color: var(--blue);
                            background: rgba(96,165,250,0.06); }
    .kpi-clickable:active { transform: translateY(0); }

    /* ── Funnel ── */
    .funnel-wrap {
      display: flex; overflow-x: auto; gap: 0; padding: 2px 0 10px;
      scrollbar-width: none;
    }
    .funnel-wrap::-webkit-scrollbar { display: none; }
    .funnel-step { display: flex; align-items: center; flex-shrink: 0; }
    .funnel-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px 12px; text-align: center; min-width: 76px;
    }
    .funnel-num { font-size: 22px; font-weight: 800; color: var(--gold); }
    .funnel-name { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
    .funnel-pct { font-size: 9px; color: var(--ok); margin-top: 2px; }
    .funnel-arr { color: var(--muted); font-size: 14px; padding: 0 3px; flex-shrink: 0; }
    .funnel-box--clickable { cursor: pointer; transition: border-color .15s, transform .12s; }
    .funnel-box--clickable:hover { border-color: var(--gold); transform: translateY(-1px); }
    .funnel-box--active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }

    /* ── Funnel expanded leads panel ── */
    .funnel-expand {
      margin-top: 12px; background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px;
    }
    .funnel-expand-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .funnel-expand-title { font-size: 13px; font-weight: 700; color: var(--fg); }
    .funnel-expand-count { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .funnel-expand-close {
      background: transparent; border: none; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 4px 8px;
    }
    .funnel-expand-close:hover { color: var(--gold); }
    .funnel-lead-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 420px; overflow-y: auto;
    }
    .funnel-lead-card {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .funnel-lead-info { flex: 1; min-width: 0; }
    .funnel-lead-name { font-size: 13px; font-weight: 600; color: var(--fg); }
    .funnel-lead-status { font-size: 10px; color: var(--blue); font-weight: 600; margin-left: 4px; }
    .funnel-lead-meta {
      font-size: 10px; color: var(--muted); margin-top: 3px;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .funnel-lead-desc {
      font-size: 11px; color: var(--muted); margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .funnel-lead-chat {
      flex-shrink: 0; background: var(--card2); border: 1px solid var(--border);
      color: var(--fg); border-radius: 6px; padding: 8px 12px;
      font-size: 15px; text-decoration: none; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, color .15s;
    }
    .funnel-lead-chat:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    .funnel-lead-chat--disabled { opacity: 0.35; cursor: default; pointer-events: none; }

    /* ── Funnel branches row (under main strip) ── */
    .funnel-branches-wrap {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 8px; padding: 0 2px;
    }
    .funnel-branch-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px dashed var(--border);
      border-radius: 8px; padding: 5px 9px;
      font-size: 10px; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .funnel-branch-chip:hover { border-color: var(--gold); color: var(--fg); border-style: solid; }
    .funnel-branch-chip--active { border-color: var(--gold); border-style: solid; color: var(--fg); background: var(--card); }
    .funnel-branch-chip-icon { font-size: 12px; }
    .funnel-branch-chip-num { font-weight: 700; color: var(--fg); }
    .funnel-branch-chip-parent { font-size: 9px; color: var(--muted); opacity: 0.7; }

    /* ── Orders ── */
    .orders-list { display: flex; flex-direction: column; gap: 8px; }
    .order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .order-info { flex: 1; min-width: 0; }
    .order-client { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .order-desc-preview {
      font-size: 11px; color: var(--muted); margin-top: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0.8;
    }
    .order-card-hoverable { position: relative; }
    .order-card-hoverable:hover { border-color: var(--blue); }
    .order-tip {
      visibility: hidden; opacity: 0;
      position: absolute; z-index: 50;
      padding: 12px 14px;
      background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      font-size: 12px; line-height: 1.5;
      transition: opacity .15s, visibility .15s;
      pointer-events: none;
    }
    .order-tip-side-left > .order-tip {
      top: 0; right: calc(100% + 8px); left: auto;
      width: 440px; max-width: calc(100vw - 40px);
    }
    .order-tip-side-right > .order-tip {
      top: 0; left: calc(100% + 8px); right: auto;
      width: 440px; max-width: calc(100vw - 40px);
    }
    .order-tip-side-bottom > .order-tip {
      top: calc(100% + 6px); left: 0; right: 0;
      max-width: 520px;
    }
    .order-card-hoverable:hover .order-tip,
    .order-card-hoverable:focus-within .order-tip { visibility: visible; opacity: 1; }
    .order-tip-label {
      font-size: 10px; font-weight: 700; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .order-tip-body {
      font-size: 12px; color: #e2e8f0; white-space: pre-wrap;
      max-height: 180px; overflow-y: auto;
    }
    .order-tip-history { font-size: 11px; color: #cbd5e1; }
    .order-tip-hist-line {
      padding: 3px 0; border-top: 1px solid #1e293b;
    }
    .order-tip-hist-line:first-child { border-top: none; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 3px 9px;
      border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .badge-new  { background: rgba(59,130,246,.15); color: #60a5fa; }
    .badge-wip  { background: rgba(16,185,129,.15);  color: #34d399; }
    .badge-done { background: rgba(245,197,24,.15);  color: var(--gold); }
    .badge-no   { background: rgba(239,68,68,.15);   color: #f87171; }
    .badge-gray { background: rgba(100,116,139,.15); color: var(--muted); }

    /* ── Process status ── */
    .status-list { display: flex; flex-direction: column; gap: 6px; }
    .status-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .process-tip-row > .order-tip {
      top: calc(100% + 6px); right: 12px; left: auto;
      width: 520px; max-width: calc(100vw - 80px);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-ok   { background: var(--ok);   box-shadow: 0 0 6px var(--ok); }
    .dot-warn { background: var(--warn); }
    .dot-err  { background: var(--err);  }
    .dot-unk  { background: var(--muted); }
    .status-name { flex: 1; font-size: 13px; }
    .status-age  { font-size: 11px; color: var(--muted); }

    /* ── Followups ── */
    .followup-list { display: flex; flex-direction: column; gap: 6px; }

    /* ── Scan status ── */
    .scan-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px; margin-top: 8px;
    }
    .scan-card-active { border-color: var(--gold); }
    .scan-card-permission { border-color: var(--err); animation: pulse-err 1.5s ease infinite; }
    .scan-card-error { border-color: var(--err); }
    .scan-card-done { border-color: var(--ok); }
    .scan-progress-bar {
      height: 6px; border-radius: 3px; background: var(--card2);
      margin: 10px 0 8px; overflow: hidden;
    }
    .scan-progress-fill {
      height: 100%; border-radius: 3px; background: var(--gold);
      transition: width .4s ease;
    }
    .scan-result-item {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; margin-top: 6px;
      font-size: 12px; line-height: 1.4;
    }
    .followup-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .followup-left { min-width: 0; }
    .followup-user { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .followup-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .chip {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 12px; flex-shrink: 0; white-space: nowrap;
    }
    .chip-noreply    { background: rgba(100,116,139,.15); color: var(--muted); }
    .chip-interested { background: rgba(245,197,24,.15);  color: var(--gold); }
    .chip-customer   { background: rgba(16,185,129,.15);  color: var(--ok); }
    .chip-declined   { background: rgba(239,68,68,.15);   color: #f87171; }

    /* ── Overdue order alert ── */
    @keyframes pulse-overdue {
      0%, 100% { border-color: rgba(239,68,68,.55); box-shadow: 0 0 8px rgba(239,68,68,.25); }
      50% { border-color: rgba(239,68,68,1); box-shadow: 0 0 18px rgba(239,68,68,.55); }
    }
    .order-card-overdue {
      animation: pulse-overdue 1.6s ease infinite;
      border-color: rgba(239,68,68,.55) !important;
      background: rgba(239,68,68,.05) !important;
    }

    /* ── Loading skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skel {
      background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--r);
    }

    /* ── Error ── */
    .err-box {
      background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25);
      border-radius: var(--r); padding: 14px; margin: 14px;
      font-size: 13px; color: #f87171; line-height: 1.5;
    }
    .err-box small { color: var(--muted); display: block; margin-top: 6px; }

    /* ── Offline pill ── */
    .offline-pill {
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
      border-radius: 20px; padding: 3px 10px; font-size: 11px; color: #f87171;
      display: inline-block; margin-left: 8px;
    }

    /* ── Connection status ── */
    .conn-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .conn-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .conn-dot-ok    { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
    .conn-dot-err   { background: var(--err);  box-shadow: 0 0 8px var(--err); animation: pulse-err 1.5s ease infinite; }
    .conn-dot-unk   { background: var(--muted); }
    @keyframes pulse-err {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .conn-info { flex: 1; }
    .conn-label { font-size: 13px; font-weight: 600; }
    .conn-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .conn-sessions { display: flex; gap: 8px; margin-top: 8px; }
    .conn-session-chip {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      display: flex; align-items: center; gap: 4px;
    }
    .conn-chip-ok  { background: rgba(16,185,129,.12); color: var(--ok); }
    .conn-chip-err { background: rgba(239,68,68,.12); color: #f87171; }
    .conn-chip-unk { background: rgba(100,116,139,.12); color: var(--muted); }

    /* ── Action buttons ── */
    .action-btns { display: flex; gap: 8px; margin: 4px 16px 0; }
    .action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px 8px;
      color: var(--text); font-size: 12px; font-weight: 600;
      text-decoration: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .action-btn:active { background: var(--card2); }
    .action-btn-restart { border-color: rgba(16,185,129,.3); }
    .action-btn-restart:active { background: rgba(16,185,129,.08); }
    .action-btn-status { border-color: rgba(59,130,246,.3); }
    .action-btn-status:active { background: rgba(59,130,246,.08); }

    /* ── Empty state ── */
    .empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 13px; }

    /* ── TG Leads button ── */
    .tg-leads-btn {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px; width: 100%;

// ── Google Sheets gviz parser ─────────────────────────────────────────────────
function parseGviz(text) {
  try {
    const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)\s*;?\s*$/);
    if (!m) throw new Error('No gviz wrapper');
    const obj = JSON.parse(m[1]);
    if (!obj.table) return [];
    const { cols, rows } = obj.table;
    const headers = cols.map(c => c.label || c.id || '');
    return (rows || []).map(row =>
      Object.fromEntries((row.c || []).map((cell, i) => [headers[i], cell?.v ?? null]))
    );
  } catch (e) {
    console.error('[parseGviz]', e.message);
    return [];
  }
}

async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheetName)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} для листа «${sheetName}»`);
  return parseGviz(await resp.text());
}

// ── Data processing ───────────────────────────────────────────────────────────
function processRows(rows) {
  const kpi      = {};
  const funnel   = [];
  const status   = [];
  const followups = [];
  const orders   = [];
  const refused  = { total: 0, recent: [] };
  const attention = { total: 0, requires_user: 0, today: 0, overdue: 0, items: [] };
  const paid = { total: 0, items: [] };
  const refusalCategories = {};  // { low_budget: 15, format_mismatch: 1, ... }
  const channels = {};  // { TG: 91, VK: 5, ... }
  const tgFunnel = {};  // { day: {sent,leads,paid,earned}, week: {…}, … }
  const connection = { status: 'unknown', lastCheck: null, sessions: {} };
  const vkConnection = { status: 'unknown', lastCheck: null, reason: '', tokens: {} };
  const scan = { status: 'idle', progress: 0, message: '', results: [], chatsChecked: [], updated: '' };
  const agents = { total: 0, running: 0, missing: 0, staleSla: 0, items: [] };
  const newLeads = { total: 0, items: [] };
  const aiSkips = { total: 0, items: [] };
  const aiUsage = { totalCalls: 0, totalCost: 0, skip: 0, adapt: 0, ok: 0, services: {} };
  const timeline = { total: 0, items: [] };
  const browserWalk = { leads: 0, refusals: 0, chats: 0, ranAt: '', hours: 48, items: [] };

  for (const row of rows) {
    if (!row.key) continue;
    const section = row.section;
    if (section === 'KPI')     kpi[row.key]    = row.value;
    if (section === 'Funnel')  funnel.push({ key: row.key, n: Number(row.value) || 0, label: row.label });
    if (section === 'Status') {
      const parts = (row.value || '').split('|');
      status.push({ key: row.key, val: parts[0], reason: parts[1] || '', action: parts[2] || '', label: row.label });
    }
    if (section === 'Followup') {
      try { followups.push(JSON.parse(row.value)); } catch { followups.push({ user: row.label }); }
    }
    if (section === 'Order') {
      try { orders.push(JSON.parse(row.value)); } catch { /* skip */ }
    }
    if (section === 'Refused') {
      if (row.key === 'refused_total') {
        refused.total = Number(row.value) || 0;
        kpi.refused_total = row.value;  // продублировать в KPI — для мини-плитки
      } else if (row.key?.startsWith('refused_')) {
        try { refused.recent.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
    if (section === 'Attention') {
      if (row.key === 'attention_total')    attention.total = Number(row.value) || 0;
      if (row.key === 'attention_user')     attention.requires_user = Number(row.value) || 0;
      if (row.key === 'attention_today')    attention.today = Number(row.value) || 0;
      if (row.key === 'attention_overdue')  attention.overdue = Number(row.value) || 0;
      if (row.key?.match(/^attention_\d+$/)) {
        try { attention.items.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
    if (section === 'Paid') {
      if (row.key === 'paid_total') paid.total = Number(row.value) || 0;
      if (row.key?.match(/^paid_\d+$/)) {
        try { paid.items.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
    if (section === 'RefusalCategory' && row.key?.startsWith('refcat_')) {
      const cat = row.key.replace('refcat_', '');
      refusalCategories[cat] = Number(row.value) || 0;
    }
    if (section === 'Channel' && row.key?.startsWith('channel_')) {
      const ch = row.key.replace('channel_', '');
      channels[ch] = Number(row.value) || 0;
    }
    if (section === 'TGFunnel') {
      const m = (row.key || '').match(/^tg_funnel_(day|week|month|year)_(sent|leads|paid|earned)$/);
      if (m) {
        const [, period, metric] = m;
        if (!tgFunnel[period]) tgFunnel[period] = {};
        tgFunnel[period][metric] = Number(row.value) || 0;
      }
    }
    if (section === 'Scan') {
      if (row.key === 'scan_status') scan.status = row.value || 'idle';
      if (row.key === 'scan_progress') scan.progress = Number(row.value) || 0;
      if (row.key === 'scan_message') scan.message = row.value || '';
      if (row.key === 'scan_updated') scan.updated = row.value || '';
      if (row.key === 'scan_results') {
        try { scan.results = JSON.parse(row.value); } catch { scan.results = []; }
      }
      if (row.key === 'scan_chats_checked') {
        try { scan.chatsChecked = JSON.parse(row.value); } catch { scan.chatsChecked = []; }
      }
    }
    if (section === 'Connection') {
      if (row.key === 'conn_status') {
        const [st, reason] = (row.value || '').split('|');
        connection.status = st;
        connection.reason = reason || '';
      } else if (row.key === 'conn_last_check') {
        connection.lastCheck = row.value;
      } else if (row.key?.startsWith('conn_')) {
        const sessName = row.label || row.key.replace('conn_', '');
        const [st, reason] = (row.value || '').split('|');
        connection.sessions[sessName] = st;
        if (!connection.sessionReasons) connection.sessionReasons = {};
        if (reason) connection.sessionReasons[sessName] = reason;
      }
    }
    if (section === 'VKConnection') {
      if (row.key === 'vk_conn_status') {
        const [st, reason] = (row.value || '').split('|');
        vkConnection.status = st;
        vkConnection.reason = reason || '';
      } else if (row.key === 'vk_conn_last_check') {
        vkConnection.lastCheck = row.value;
      } else if (row.key?.startsWith('vk_conn_')) {
        const tokenName = row.key.replace('vk_conn_', '');
        const [st, reason] = (row.value || '').split('|');
        vkConnection.tokens[tokenName] = { status: st, reason, label: row.label };
      }
    }
    if (section === 'Agents') {
      if (row.key === 'agents_total')   agents.total = Number(row.value) || 0;
      else if (row.key === 'agents_running') agents.running = Number(row.value) || 0;
      else if (row.key === 'agents_missing') agents.missing = Number(row.value) || 0;
      else if (row.key === 'agents_stale_sla') agents.staleSla = Number(row.value) || 0;
      else if (row.key?.match(/^agent_\d+$/)) {
        try { agents.items.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
    if (section === 'NewLeads') {
      if (row.key === 'newleads_total') newLeads.total = Number(row.value) || 0;
      else if (row.key?.match(/^newlead_\d+$/)) {
        try { newLeads.items.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
    if (section === 'AISkip') {
      if (row.key === 'aiskip_total') aiSkips.total = Number(row.value) || 0;
      else if (row.key?.match(/^aiskip_\d+$/)) {
        try { aiSkips.items.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
    if (section === 'BrowserWalk') {
      if (row.key === 'bw_leads')    browserWalk.leads    = Number(row.value) || 0;
      else if (row.key === 'bw_refusals') browserWalk.refusals = Number(row.value) || 0;
      else if (row.key === 'bw_chats')    browserWalk.chats    = Number(row.value) || 0;
      else if (row.key === 'bw_ran_at')   browserWalk.ranAt    = row.value || '';
      else if (row.key === 'bw_hours')    browserWalk.hours    = Number(row.value) || 48;
      else if (row.key?.match(/^bw_lead_\d+$/)) {
        try { browserWalk.items.push(JSON.parse(row.value)); } catch {}
      }
    }
    if (section === 'AIUsage') {
      if (row.key === 'ai_total_calls')    aiUsage.totalCalls = Number(row.value) || 0;
      else if (row.key === 'ai_total_cost_usd') aiUsage.totalCost = Number(row.value) || 0;
      else if (row.key === 'ai_skip_count')  aiUsage.skip = Number(row.value) || 0;
      else if (row.key === 'ai_adapt_count') aiUsage.adapt = Number(row.value) || 0;
      else if (row.key === 'ai_ok_count')    aiUsage.ok = Number(row.value) || 0;
      else if (row.key?.startsWith('ai_svc_')) {
        try {
          const svcName = row.key.replace('ai_svc_', '');
          aiUsage.services[svcName] = JSON.parse(row.value);
        } catch { /* skip */ }
      }
    }
    if (section === 'Timeline') {
      if (row.key === 'timeline_total') timeline.total = Number(row.value) || 0;
      else if (row.key?.match(/^timeline_\d+$/)) {
        try { timeline.items.push(JSON.parse(row.value)); } catch { /* skip */ }
      }
    }
  }
  return { kpi, funnel, status, followups, orders, refused, attention, refusalCategories, channels, tgFunnel, connection, vkConnection, scan, agents, newLeads, aiSkips, paid, aiUsage, timeline, browserWalk };
}

// ── Status helpers ────────────────────────────────────────────────────────────
function dotClass(val) {
  if (!val || val === 'missing' || val.startsWith('stale')) return 'dot-warn';
  if (val.startsWith('error')) return 'dot-err';
  if (val.startsWith('ok')) return 'dot-ok';
  return 'dot-unk';
}

function orderBadge(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('нов') || s === 'new')  return ['badge-new',  status];
  if (s.includes('работ') || s === 'wip') return ['badge-wip', status];
  if (s.includes('подтверж') || s.includes('confirm') || s.includes('готов'))
    return ['badge-done', status];
  if (s.includes('отказ') || s === 'declined') return ['badge-no', status];
  return ['badge-gray', status || '—'];
}

function convChip(status) {
  const s = (status || '').toLowerCase();
  if (s === 'customer') return ['chip-customer', 'Клиент 🎉'];
  if (s === 'interested') return ['chip-interested', 'Интерес'];
  if (s === 'no_reply') return ['chip-noreply', 'Без ответа'];
  if (s === 'declined') return ['chip-declined', 'Отказ'];
  return ['chip-noreply', s || '—'];
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
  } catch { return iso.slice(0, 10); }
}

// ── Order overdue check ───────────────────────────────────────────────────────
function isOverdue(order) {
  const s = (order.status || '').toLowerCase();
  const waitKw = ['ждёт', 'ждет', 'обещал', 'pending', 'ожидает'];
  if (!waitKw.some(kw => s.includes(kw))) return false;
  const dateStr = order.date_posted || order.date_event;
  if (!dateStr) return false;
  try {
    let d;
    if (/^\d{2}\.\d{2}\.\d{4}/.test(dateStr)) {
      const [day, month, year] = dateStr.split('.');
      d = new Date(Number(year), Number(month) - 1, Number(day));
    } else {
      d = new Date(dateStr);
    }
    return (Date.now() - d.getTime()) > 2 * 24 * 60 * 60 * 1000;
  } catch { return false; }
}

function _fmtCountdown(sec) {
  if (!sec || sec <= 0) return '<1с';
  if (sec < 60) return sec + 'с';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return s === 0 ? `${m}м` : `${m}м ${s}с`;
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return mm === 0 ? `${h}ч` : `${h}ч ${mm}м`;
}

function _fmtAgo(lastCheck) {
  if (!lastCheck || lastCheck === '—') return '';
  try {
    const d = new Date(lastCheck);
    const mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return 'только что';
    if (mins < 60) return mins + ' мин назад';
    if (mins < 1440) return Math.round(mins / 60) + ' ч назад';
    return Math.round(mins / 1440) + ' д назад';
  } catch { return lastCheck; }
}

function ConnectionRow({ title, status, reason, lastCheck }) {
  const st = status || 'unknown';
  const dotCls = st === 'ok' ? 'conn-dot-ok' : st === 'error' ? 'conn-dot-err' : 'conn-dot-unk';
  const label  = st === 'ok' ? 'Подключено' : st === 'error' ? 'Соединение потеряно' : 'Нет данных';
  const labelColor = st === 'ok' ? 'var(--ok)' : st === 'error' ? '#f87171' : 'var(--muted)';
  const accountColor = st === 'ok' ? '#60a5fa' : '#f87171';
  const timeAgo = _fmtAgo(lastCheck);
  return (
    <div className="conn-card" style={{marginBottom:8}}>
      <div className={`conn-dot ${dotCls}`} />
      <div className="conn-info">
        <div style={{fontSize:11,color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:0.5,marginBottom:2}}>
          {title}
        </div>
        <div className="conn-label" style={{color: labelColor}}>{label}</div>
        {reason && (
          <div style={{fontSize:12,color:accountColor,marginTop:2,fontWeight:500}}>
            {reason}
          </div>
        )}
        {timeAgo && <div className="conn-sub">Проверено: {timeAgo}</div>}
      </div>
    </div>
  );
}

function ConnectionStatus({ connection, vkConnection }) {
  const sessionReasons = connection?.sessionReasons || {};
  const firstSessionReason = Object.values(sessionReasons).find(Boolean) || '';
  const tgReason = connection?.reason || firstSessionReason;

  const vkTokens = vkConnection?.tokens || {};
  // Для VK формируем reason из первого ok токена (обычно Kate Mobile — показывает имя аккаунта)
  const kateReason = vkTokens.kate_mobile?.reason || '';
  const svcReason  = vkTokens.service_key?.reason || '';
  const vkReason = vkConnection?.reason ||
    (kateReason && svcReason ? `${kateReason} · ${svcReason}` : (kateReason || svcReason));

  return (
    <div className="section">
      <div className="section-title">Соединения</div>
      <ConnectionRow
        title="📨 Telegram"
        status={connection?.status}
        reason={tgReason}
        lastCheck={connection?.lastCheck}
      />
      {vkConnection && vkConnection.status !== 'unknown' && (
        <ConnectionRow
          title="🌐 VK (Kate Mobile + Service)"
          status={vkConnection.status}
          reason={vkReason}
          lastCheck={vkConnection.lastCheck}
        />
      )}
    </div>
  );
}

function BrowserWalkCard({ data }) {
  const [expanded, setExpanded] = React.useState(false);
  const [progress, setProgress] = React.useState(null);
  const [requesting, setRequesting] = React.useState(false);
  const [requestedNote, setRequestedNote] = React.useState(null);
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';

  const leads = data?.leads || 0;
  const refusals = data?.refusals || 0;
  const totalChats = data?.chats || 0;
  const items = data?.items || [];
  const ranAt = data?.ranAt ? new Date(data.ranAt) : null;

  const fmtAgo = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'только что';
    if (m < 60) return `${m} мин назад`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} ч назад`;
    return `${Math.floor(h/24)} дн назад`;
  };
  const timeAgo = ranAt ? fmtAgo(ranAt.toISOString()) : 'не было';

  // Poll progress endpoint every 10s (faster 3s while running).
  React.useEffect(() => {
    let cancelled = false;
    const fetchProgress = async () => {
      try {
        const r = await fetch(`${backendUrl}/api/browser_walk_progress`, { cache: 'no-store' });
        if (!r.ok) return;
        const j = await r.json();
        if (!cancelled) setProgress(j);
      } catch { /* offline */ }
    };
    fetchProgress();
    const running = progress && progress.status === 'running';
    const t = setInterval(fetchProgress, running ? 3000 : 10000);
    return () => { cancelled = true; clearInterval(t); };
  }, [backendUrl, progress?.status]);

  const isRunning = progress?.status === 'running';
  const isQueued = progress?.status === 'queued';
  const isDoneFresh = progress?.status === 'done';
  const isError = progress?.status === 'error';
  const scanned = progress?.scanned_chats ?? 0;
  const totalPlan = progress?.total_chats ?? totalChats ?? 18;
  const currentChat = progress?.current_chat || '';
  const startedAt = progress?.started_at || progress?.requested_at;
  const statusAge = fmtAgo(startedAt);
  const freshPosts  = progress?.posts ?? null;
  const freshOrders = progress?.orders ?? null;
  const finishedAt  = progress?.finished_at || '';

  const requestWalk = async (e) => {
    e.stopPropagation();
    if (requesting || isRunning || isQueued) return;
    setRequesting(true);
    try {
      await fetch(`${backendUrl}/api/browser_walk_request`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({source: 'tg', hours: 48}),
      });
      setRequestedNote('в очереди');
      setTimeout(() => setRequestedNote(null), 6000);
    } catch (err) {
      console.error('[walk] err:', err);
      setRequestedNote('ошибка');
      setTimeout(() => setRequestedNote(null), 4000);
    }
    setRequesting(false);
  };

  const valColor = isRunning ? '#3b82f6' : (leads > 0 ? '#fbbf24' : 'var(--text)');
  const pct = totalPlan > 0 ? Math.min(100, Math.round((scanned / totalPlan) * 100)) : 0;

  return (
    <div className="kpi-mini" style={{position:'relative'}}>
      <span className="kpi-info" tabIndex="0" aria-label="Описание"
            onClick={e => e.stopPropagation()}>i</span>
      <div className="kpi-tip">Auto Browser Walk — launchd запускает каждый час в :00 SP time через Claude CLI (Opus 4.7) + Chrome MCP. Проходит 17 event-чатов глазами, шлёт питчи через Telethon с pre-send AI review.</div>

      <div style={{minWidth:0}}>
        {isRunning ? (
          <>
            <div className="kpi-mini-val" style={{color: valColor, fontVariantNumeric:'tabular-nums'}}>
              {scanned}<span style={{fontSize:14, color:'var(--muted)', fontWeight:500}}> / {totalPlan}</span>
              <span style={{fontSize:11, color:'var(--blue)', fontWeight:700, marginLeft:6}}>{pct}%</span>
            </div>
            <div className="kpi-mini-lbl">🤖 Скан идёт · {scanned} из {totalPlan} чатов</div>
          </>
        ) : isDoneFresh ? (
          <>
            <div className="kpi-mini-val" style={{color: freshOrders > 0 ? '#fbbf24' : '#10b981', fontVariantNumeric:'tabular-nums'}}>
              {freshOrders ?? 0}
              <span style={{fontSize:11,color:'var(--muted)',fontWeight:500,marginLeft:4}}>
                {freshOrders === 1 ? 'лид' : 'лидов'} · {freshPosts ?? 0} постов
              </span>
            </div>
            <div className="kpi-mini-lbl">✓ Скан готов</div>
          </>
        ) : isError ? (
          <>
            <div className="kpi-mini-val" style={{color:'#ef4444'}}>err</div>
            <div className="kpi-mini-lbl" style={{fontSize:10}}>{String(progress?.error || '').slice(0,32) || 'ошибка'}</div>
          </>
        ) : (
          <>
            <div className="kpi-mini-val" style={{color: valColor}}>
              {leads}
              {refusals > 0 && <span style={{fontSize:11,color:'#f87171',fontWeight:500,marginLeft:4}}>· {refusals} ❌</span>}
            </div>
            <div className="kpi-mini-lbl">👁️ Browser Walk · {totalChats} чат · 🔁 auto 1h</div>
          </>
        )}
      </div>

      {isRunning && (
        <div style={{marginTop:6}}>
          <div style={{
            height:8, background:'rgba(59,130,246,0.18)',
            borderRadius:4, overflow:'hidden', position:'relative',
            border:'1px solid rgba(59,130,246,0.35)',
          }}>
            <div style={{
              width: pct + '%', height:'100%',
              background:'linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%)',

        {(items.length > 0 || (Array.isArray(progress?.events) && progress.events.length > 0)) && (
          <button onClick={() => setExpanded(v => !v)}
            style={{marginLeft:5, fontSize:9, padding:'0 4px', background:'transparent',

      </div>


      {expanded && (items.length > 0 || (Array.isArray(progress?.events) && progress.events.length > 0)) && (
        <div style={{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, zIndex:55,
                      background:'#0f172a', border:'1px solid #334155', borderRadius:6,

          {Array.isArray(progress?.events) && progress.events.length > 0 && (

                Решения по постам · {progress.events.length}
              </div>
              {progress.events.slice().reverse().map((ev, i) => {
                const isSummary = ev.outcome === 'summary';
                const icon = ev.outcome === 'kept'     ? '✅'

                return (

          {items.length > 0 && (

// ── Funnel pipeline (amoCRM-style) ─────────────────────────────────────────
// 6 main stages + 3 branches, computed from dbSnapshot.active / .archived / .pending_drafts.
//
// Stage flow (exclusive assignment by lead status):
//   1. Новые          — status "Новый"
//   2. Отправили питч — status "Написал"
//     └ 2b. Питч в боте — pending_approvals.json entries with status="pending"
//   3. Интерес        — status "Интерес" OR "Переговоры" without commercial/deep negotiation text
//     ├ 3b. Follow-up — status "Follow-up" (silent, we pinged)
//     └ 3c. Отмена    — status "Не актуален" (active) + archived "Неактуально"
//   4. Переговоры     — status "Переговоры" with history hints of price/rider discussion
//   5. Предоплата     — status "ОПЛАТИЛА"
//   6. Концерт        — status "Оплачен" (post-event, fully closed)
//
// The distinction between stage 3 (Интерес) and stage 4 (Переговоры) is:
// both share DB status "Переговоры" but stage 4 is the subset whose history
// contains commercial keywords (цена/прайс/райдер/бюджет/депозит/аванс).

const FUNNEL_NEGOTIATION_RE = /ц[ее]н[аы]|прайс|прайсик|райдер|бюджет|депозит|аванс|предоплат|рассчит|смет|скидк|договор|контракт/i;

// 🔴 27.04: «Потерянные обещания» — мы что-то обещали отправить (промо, видео,
// райдер, договор) и не отправили. Признаки:
//   - наше сообщение содержит «отправлю / пришлю / скину / вышлю / обещаю / подготовлю»
//   - в последующей переписке нет маркеров доставки (link, файл, .pdf, disk.yandex,
//     drive.google, обновлённое промо и т.д.)
//   - клиент молчит ≥ 1 дня (видимо ждёт)
// 🔴 27.04 fix: только 1-е лицо ед. ч. будущее время (НЕ past passive «отправлен»,
// которое попадало в лог-маркеры [SENT: питч отправлен (auto)] и давало false positives).
const PROMISE_RE = /\b(?:отправлю|пришлю|вышлю|перешлю|скину|обещаю|подготовлю|подгоню|поделюсь|расскажу|покажу|сейчас\s+(?:скину|пришлю|подгон[юе]))\b/i;
const DELIVERED_RE = /(?:disk\.yandex|drive\.google|youtu(?:be)?|t\.me\/|vk\.com\/|instagram|\.pdf\b|\.mp4\b|\.jpg\b|вот\s+(?:наше|промо|ссылка|видео|материал)|вот\s+ссылка)/i;

const FUNNEL_STALE_DAYS = 3;
function _funnelCalendarDaysSince(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return null;
  const [, d, mo, y] = m;
  const past = new Date(`${y}-${mo}-${d}T00:00:00+03:00`);
  if (isNaN(past.getTime())) return null;
  const nowMsk = new Date(Date.now());
  const today = new Date(Date.UTC(
    nowMsk.getUTCFullYear(), nowMsk.getUTCMonth(), nowMsk.getUTCDate()
  ));
  const pastUtc = new Date(Date.UTC(
    past.getUTCFullYear(), past.getUTCMonth(), past.getUTCDate()
  ));
  return Math.round((today - pastUtc) / 86400000);
}
function _funnelIsStaleNegotiation(o) {
  const d = _funnelCalendarDaysSince(o.last_activity);
  return d !== null && d >= FUNNEL_STALE_DAYS;
}

// «Потерянное обещание»: в нашем сообщении есть promise-маркер, и в последующих
// строках истории нет маркеров доставки (linkов, .pdf, «вот наше промо», etc).
// Используем сегментацию по строкам — каждое сообщение в `history` начинается
// с timestamp [...], так что split по \n даёт грубую но рабочую последовательность.
function _funnelHasUnfulfilledPromise(o) {
  const h = (o.history || '');
  if (!h) return false;
  if (!PROMISE_RE.test(h)) return false;
  // Найдём ИНДЕКС последнего обещания и посмотрим что после него
  let lastPromiseIdx = -1;
  let m;
  const reGlobal = new RegExp(PROMISE_RE.source, 'gi');
  while ((m = reGlobal.exec(h)) !== null) {
    lastPromiseIdx = m.index;
  }
  if (lastPromiseIdx < 0) return false;
  const tail = h.slice(lastPromiseIdx + 50);  // skip ~50 chars after promise word
  if (DELIVERED_RE.test(tail)) return false;  // доставлено
  // Дополнительно — лид молчит ≥1 дня (видимо ждёт)
  const d = _funnelCalendarDaysSince(o.last_activity);
  if (d === null || d < 1) return false;
  return true;
}

// Drum-show detector: client's own request OR explicit workflow (pitch routed to Noize Drum / brief to Вадим).
// Workflow-regex matches "drum-питч отправлен" (auto drum pitch), "drum-show package",
// "drum promo sent", "бриф вадиму", "@vadimnoize", "пит­ч Noize Drum (msg …)" — i.e. actual drum content
// or Вадим routing. Bare "Noize Drum" mentions (e.g. "IG Noize Drum" in meta-notes) no longer match.
const DRUM_DESC_RE     = /drum[-\s]*show|drum[-\s]*забег|барабанн(?:ое|ые)\s+(?:шоу|представлен|перформанс)|перкуссион(?:ное|ный)/i;
const DRUM_RACE_RE     = /(?:забег|марафон)[^.\n]{0,60}барабан/i;
const DRUM_WORKFLOW_RE = /vadimnoize|drum[-\s]*(?:show|пит[чц]|promo)|бриф.{0,30}вадим|пит[чц].{0,12}noize|noize\s*drum.{0,20}(?:msg|пит|отправ|бриф)/i;
// Negation context: negation fragment (не предлагать/без/исключая/кроме) появляется
// в пределах ~80 chars ДО или ПОСЛЕ drum-фразы. Если да — клиент его ИСКЛЮЧИЛ.
// Примеры false-positives:
//   «Бумажное шоу, барабанное шоу и кавер группу не предлагать» (@nesvetsky 26.06)
//   «Барабанное шоу — нет»
//   «Без drum show»
const NEG_FRAG   = '(?:не\\s+(?:предлаг|надо|нужн|интересн)|без\\s+|исключ|кроме\\s+|[—-]\\s*нет\\b)';
const DRUM_WORD  = '(?:drum|барабан|перкусс)';
const DRUM_NEG_BEFORE = new RegExp(NEG_FRAG + '[^.\\n]{0,80}' + DRUM_WORD, 'i');
const DRUM_NEG_AFTER  = new RegExp(DRUM_WORD + '\\w*\\s*[^.\\n]{0,80}' + NEG_FRAG, 'i');

function leadText(o, { preferRequest = false } = {}) {
  const desc = o?.desc || '';
  const fallback = [
    o?.next_action || '',
    o?.history || '',
    o?.client || '',
    o?.source_chat || '',
    o?.status || '',
  ].join(' ');
  return preferRequest ? (desc || fallback) : [desc, fallback].join(' ');
}

const SOLO_SHOW_INSTR_RE = /саксофонист(?:к[аи])?|сакс\b|sax(?:ophone)?|пианист(?:к[аи])?|pianist|piano|гитарист(?:-вокалист)?|guitarist/i;
const SOLO_SHOW_CONTEXT_RE = /solo|соло|welcome|велком|фон(?:овая|овый)?|коктейл|церемон|регистрац|встреч[аи]\s+гостей|банкет|день\s*рожден|др\b|юбилей|на\s+\d+\s*(?:час|ч\b)|\d+\s*(?:час|ч\b)/i;
const BAND_COMPOSITION_RE = /кавер|групп|бэнд|бенд|жив(?:ая|ую)\s+музык|состав|ансамбль/i;
const SAX_RE = /саксофонист(?:к[аи])?|саксофон|сакс\b|sax(?:ophone)?/i;
const BAND_INSTR_RE = /(вокал|солист|гитар|бас\b|барабан|ударн|клавиш|пиан|сакс)/gi;

function hasBandSaxComposition(o) {
  const t = leadText(o, { preferRequest: true });
  if (!SAX_RE.test(t)) return false;
  if (/сакс(?:офон)?\s+в\s+составе|состав[^.\n]{0,80}сакс|сакс[^.\n]{0,80}состав/i.test(t)) return true;
  if (!BAND_COMPOSITION_RE.test(t)) return false;
  const instruments = new Set((t.match(BAND_INSTR_RE) || []).map(x => x.toLowerCase().slice(0, 5)));
  return instruments.size >= 3;
}

function isSoloShowLead(o) {
  const t = leadText(o, { preferRequest: true });
  if (!SOLO_SHOW_INSTR_RE.test(t)) return false;
  if (hasBandSaxComposition(o)) return false;
  return SOLO_SHOW_CONTEXT_RE.test(t);
}

function hasSaxLead(o) {
  return SAX_RE.test(leadText(o));
}

const THREE_PLUS_VOCALS_RE = /(?:[3-9]\+?|1[0-9]|три|четыре|пять|шесть|семь|восемь|девять|десять)\s*(?:[-–—]\s*(?:[3-9]|1[0-9]))?(?:\s+[а-яёa-z-]+){0,4}\s+(?:вокалист|вокала|вокал\b|солист|певц)|(?:больше|более)\s+(?:двух|2)\s+(?:вокалист|вокал|солист)/i;
function hasThreePlusVocalsLead(o) {
  return THREE_PLUS_VOCALS_RE.test(leadText(o, { preferRequest: true }));
}

function isDrumLead(o) {
  // Priority #1: AI-classifier result (funnel_brand column written by classify_brand.py).
  // Opus решает с полным контекстом — надёжнее regex. Regex остаётся как fallback если
  // AI ещё не классифицировал (новый лид, cold start).
  const brand = (o.funnel_brand || '').toLowerCase();
  if (isSoloShowLead(o)) return true;
  if (brand === 'drum') return true;
  if (brand === 'lcb')  return false;

  // Fallback: regex-based routing (для лидов где AI ещё не прошёл).
  if (/бриф\s*вадим/i.test(o.status || '')) return true;
  const d = o.desc || '';
  const h = (o.history || '') + ' ' + (o.next_action || '');
  if (DRUM_NEG_BEFORE.test(d) || DRUM_NEG_AFTER.test(d)) return false;
  return DRUM_DESC_RE.test(d) || DRUM_RACE_RE.test(d) || DRUM_WORKFLOW_RE.test(h);
}

function leadChatUrl(o) {
  // Prefer TG username → direct t.me link. Fallback: contact URL (could be vk, tg, etc.)
  if (o.username) {
    const u = String(o.username).replace(/^@/, '').trim();
    if (u) return `https://t.me/${u}`;
  }
  const c = o.contact || '';
  if (c.startsWith('http')) return c;
  if (c.startsWith('@')) return `https://t.me/${c.slice(1)}`;
  return '';
}

// 🔴 28.04: pretty-label for the channel badge.
// DB codes are short (TG / VK / WA / IG / TG_DIRECT / WA_DIRECT) so dashboard
// filters can match exact strings, but the badge shows a friendlier form.
// «str» = «стрит» / direct inbound (клиент написал первым, не из event-чата).
function displayChannel(ch) {
  const s = String(ch || '').toUpperCase();
  if (s === 'TG_DIRECT') return 'TG str';
  if (s === 'WA_DIRECT') return 'WA str';
  return s;  // TG / VK / WA / IG / '' → as-is
}

// 🔴 26.04: extract VK screen_name or numeric id ("id12345") from item.
// Used to enable hover-chat panel for VK leads.
// 🔴 26.04 v2: no longer requires channel='VK' — TG-sourced leads where
// клиент оставил ТОЛЬКО vk-контакт (post в TG event-чате с vk.com ссылкой)
// тоже должны работать. Ищем VK-айдишник в username / contact / client.
function vkChatId(item) {
  if (!item) return '';
  // Helper: parse a string and return VK id ('id12345' / 'screen_name') or ''.
  const parseField = (raw) => {
    if (!raw) return '';
    let s = String(raw).trim();
    // Quick reject: TG-only forms
    if (s.startsWith('@') && !/vk\.com/i.test(s)) return '';
    if (/^t\.me\//i.test(s)) return '';
    s = s.replace(/^https?:\/\//i, '');
    // Drop vk.ru (alt VK domain) too
    s = s.replace(/^vk\.(com|ru)\//i, '');
    s = s.replace(/^VK:\s*/i, '').replace(/^@/, '').replace(/\/+$/, '').trim();
    if (!s) return '';
    if (/^id\d+$/i.test(s)) return s.toLowerCase();
    if (/^[A-Za-z0-9_.]{2,32}$/.test(s)) return s;
    return '';
  };
  // Order of preference:
  // 1. channel='VK' username (most authoritative)
  const ch = (item.channel || '').toUpperCase();
  if (ch === 'VK') {
    const u = parseField(item.username);
    if (u) return u;
  }
  // 2. contact field — works for any channel (TG-sourced lead with vk-only contact)
  if (/vk\.(com|ru)|^VK:|^id\d+$/i.test(String(item.contact || ''))) {
    const c = parseField(item.contact);
    if (c) return c;
  }
  // 3. fallback: client field (some leads have raw "vk.com/idXXXX" stuffed into client)
  if (/vk\.(com|ru)/i.test(String(item.client || ''))) {
    const c = parseField(item.client);
    if (c) return c;
  }
  // 4. username may contain VK URL even when channel != 'VK'
  if (ch !== 'VK' && /vk\.(com|ru)|^id\d+$/i.test(String(item.username || ''))) {
    const u = parseField(item.username);
    if (u) return u;
  }
  return '';
}

function tgChatUsername(item) {
  if (!item) return '';
  const parseField = (raw) => {
    if (!raw) return '';
    const s = String(raw).trim();
    const m = s.match(/(?:https?:\/\/)?t\.me\/([A-Za-z0-9_]{3,32})/i);
    if (m) return m[1];
    if (/^@[A-Za-z0-9_]{3,32}$/.test(s)) return s.slice(1);
    if (/^[A-Za-z0-9_]{3,32}$/.test(s)) return s;
    return '';
  };
  const ch = String(item.channel || '').toUpperCase();
  const username = parseField(item.username);
  if (username && (ch === 'TG' || ch.startsWith('TG_'))) return username;
  return parseField(item.contact);
}

// computePipeline(active, archived, branchSpec)
// branchSpec is an array of branch descriptors: {key, label, icon, parent, leads, hint?}
// These are appended as branch rows under the main 6 stages.
function computePipeline(allLeads, archived, branchSpec) {
  const active = allLeads || [];
  const arch = archived || [];
  const hasNegotiationText = (o) =>
    FUNNEL_NEGOTIATION_RE.test((o.history || '') + ' ' + (o.desc || ''));
  const st = (o) => (o.status || '').trim();
  const eq = (s) => (o) => st(o).toLowerCase() === s.toLowerCase();
  const any = (re) => (o) => re.test(st(o));

  const stage_new      = active.filter(eq('Новый'));
  const stage_sent     = active.filter(eq('Написал'));
  const neg_all        = active.filter(eq('Переговоры'));
  const neg_stale      = neg_all.filter(_funnelIsStaleNegotiation);
  const neg_fresh      = neg_all.filter(o => !_funnelIsStaleNegotiation(o));
  const stage_interest_status = active.filter(eq('Интерес'));
  const stage_interest = [
    ...stage_interest_status,
    ...neg_fresh.filter(o => !hasNegotiationText(o)),
  ];
  const stage_negot    = neg_fresh.filter(hasNegotiationText);
  const stage_prepaid  = active.filter(eq('ОПЛАТИЛА'));
  // Stage 6 «Отзыв/контент» — post-event workflow: клиент отыграл, просим отзыв/фото/видео.
  // DB-статусы: Оплачен (fully paid), Концерт/Сыграл/Выступил (explicit markers),
  // Отзыв (future status when review collected).
  const stage_review   = active.filter(any(/^(Оплачен|Концерт|Сыграл|Выступил|Отзыв)/i));
  const stage_followup_all = [...active.filter(eq('Follow-up')), ...neg_stale];
  // 🔴 27.04: разделяем Follow-up на «обычные» и «Потерянные обещания»
  const stage_promises   = stage_followup_all.filter(_funnelHasUnfulfilledPromise);
  const stage_followup   = stage_followup_all.filter(o => !_funnelHasUnfulfilledPromise(o));
  const stage_direct   = active.filter(eq('Прямой лид'));
  const stage_cancel_active = active.filter(any(/^(Не актуал|Отказ|Отмена)/i));
  const stage_cancel_arch   = arch.filter(any(/(Неактуал|Не актуал|Отказ|Отмена)/i));
  const stage_cancel   = [...stage_cancel_active, ...stage_cancel_arch];

  const branches = [];
  (branchSpec || []).forEach(b => branches.push({ ...b, kind: 'branch' }));
  // 🔴 25.04: Follow-up — теперь обычный main stage между «Отправили питч» и «Интерес».
  // Раньше был branch под «Интерес», но это смысловой шаг воронки: клиент что-то ответил,
  // но дальше молчит. Per user 25.04: «обычный шаг воронки фолоуап».
  branches.push({ key: 'cancelled', label: 'Отмена',    leads: stage_cancel,   kind: 'branch', parent: 'interest', icon: '❌' });

  return [
    { key: 'new',      label: 'Новые',          leads: stage_new,      kind: 'main' },
    { key: 'sent',     label: 'Отправили питч', leads: stage_sent,     kind: 'main' },
    ...branches.filter(b => b.parent === 'sent'),
    { key: 'followup', label: 'Follow-up',      leads: stage_followup, kind: 'main' },
    // 🔴 27.04: «Потерянные обещания» временно скрыто — regex даёт false positives
    // (например «питч отправлен (auto)» → ложное обещание). Включится после
    // того как funnel_maintenance начнёт писать AI-флаги в orders.db.flags.
    // { key: 'promises', label: 'Потерянные обещания', leads: stage_promises, kind: 'main' },
    { key: 'interest', label: 'Интерес',        leads: stage_interest, kind: 'main' },
    ...branches.filter(b => b.parent === 'interest'),
    { key: 'negot',    label: 'Переговоры',     leads: stage_negot,    kind: 'main' },
    { key: 'direct',   label: 'Прямые лиды',   leads: stage_direct,   kind: 'main' },
    { key: 'prepaid',  label: 'Предоплата',     leads: stage_prepaid,  kind: 'main' },
    { key: 'review',   label: 'Отзыв/контент',  leads: stage_review,   kind: 'main' },
  ];
}

const PIPELINE_HINTS = {
  new:       'Новые заявки. Монитор только что классифицировал — ещё не тронуты.',
  sent:      'Отправили питч. Ждём первого ответа клиента.',
  bot:       'Бот подготовил draft, но не хватило правила для авто-отправки (язык/цирк/public-reply). Ждёт твоего ✅ в @lcband_notify_bot.',
  brief:     'Бриф отправлен @vadimnoize (директор Noize Drum). Ждём его ✅/❌ прежде чем пит­чить клиенту.',
  followup:  'Клиент что-то ответил на питч (показал интерес), но дальше молчит. Автомат делает follow-up пинги через cooldown 3 дня, urgency override через 3 дня тишины.',
  promises:  'Мы что-то обещали клиенту (промо, видео, райдер) и не отправили. AI-детект: в нашем сообщении есть «отправлю/пришлю/скину», в последующих нет linkов/файлов/«вот наше». Funnel maintenance приоритетно доставит обещанное.',
  interest:  'Активная нейтральная переписка с клиентом без обсуждения цены/райдера. Опережает «Переговоры».',
  cancelled: 'Отказались: «взяли других», «не актуально», бюджет не совпал.',
  negot:     'Активно обсуждают цену, райдер, состав. Hot — нужна личная реакция. TG-папка «Переговоры» 🤝.',
  direct:    'Прямые входящие лиды — написали сами в DM без нашего cold outreach. Отдельный трек без конверсии в другие стадии.',
  prepaid:   'Получили предоплату (статус ОПЛАТИЛА, папка 💰).',
  review:    'Концерт отыграли, полный расчёт. Post-event workflow: отзыв, фото/видео, реферралы. TG-папка «Отзыв/фото» ⭐.',
};

function FunnelSection({ title, allLeads, archived, branchSpec }) {
  const [expanded, setExpanded] = React.useState(null);
  // 🔴 22.04: chat panel on hover/click для лидов внутри expanded stage
  const chatCtx = React.useContext(ChatContext);
  const hoverTimer = React.useRef(null);
  const pipeline = React.useMemo(
    () => computePipeline(allLeads, archived, branchSpec),
    [allLeads, archived, branchSpec]
  );
  const hasAnyData =
    (allLeads || []).length > 0 ||
    (archived || []).length > 0 ||
    (branchSpec || []).some(b => (b.leads || []).length > 0);
  if (!hasAnyData) return null;

  const main     = pipeline.filter(s => s.kind === 'main');
  const branches = pipeline.filter(s => s.kind === 'branch');

  const expandedStage = expanded ? pipeline.find(s => s.key === expanded) : null;
  const stageLeads    = expandedStage ? [...expandedStage.leads] : [];
  // Sort by event_date ascending (most urgent first); leads without date at end
  stageLeads.sort((a, b) => {
    const da = a.event_date || '9999-99-99';
    const db = b.event_date || '9999-99-99';
    return da.localeCompare(db);
  });

  return (
    <div id="funnel-section" className="section" style={{ marginTop: 14 }}>
      <div className="section-title">{title || 'Воронка (TG)'}</div>
      <div className="funnel-wrap">
        {main.map((step, i) => {
          const prev = main[i - 1];
          const n = step.leads.length;
          // 🔴 24.04: НЕ показывать % на стадии «sent» (Новые → Отправили питч) —
          // эта конверсия ничего не значит, бот пушит pitch независимо от Новых.
          // 🔴 26.04: убран % и для «followup» — конверсия Sent → Follow-up
          // тоже бессмысленна (followup — это автомат-пинги, не действие клиента).
          // 🔴 27.04: + «promises» (Потерянные обещания) — это ответвление, а не
          // прогрессия по воронке, % тут не несёт смысла.
          const skipPct = step.key === 'sent' || step.key === 'followup' || step.key === 'promises' || step.key === 'direct';
          const pct = (!skipPct && prev && prev.leads.length > 0)
            ? Math.round(n / prev.leads.length * 100) + '%'
            : null;
          const clickable = n > 0;
          const isActive  = expanded === step.key;
          return (
            <div key={step.key} className="funnel-step" title={PIPELINE_HINTS[step.key] || ''}>
              {i > 0 && <span className="funnel-arr">›</span>}
              <div
                className={
                  'funnel-box' +
                  (clickable ? ' funnel-box--clickable' : '') +
                  (isActive  ? ' funnel-box--active' : '')
                }
                onClick={() => clickable && setExpanded(isActive ? null : step.key)}
              >
                <div className="funnel-num">{n}</div>
                <div className="funnel-name">{step.label}</div>
                {pct && <div className="funnel-pct">{pct}</div>}
              </div>
            </div>
          );
        })}
      </div>

      {branches.length > 0 && (
        <div className="funnel-branches-wrap">
          {branches.map(br => {
            const n = br.leads.length;
            const clickable = n > 0;
            const isActive  = expanded === br.key;
            const parentLabel = main.find(m => m.key === br.parent)?.label || '';
            return (
              <div
                key={br.key}
                className={
                  'funnel-branch-chip' +
                  (isActive ? ' funnel-branch-chip--active' : '')
                }
                onClick={() => clickable && setExpanded(isActive ? null : br.key)}
                title={PIPELINE_HINTS[br.key] || ''}
                style={{ cursor: clickable ? 'pointer' : 'default', opacity: clickable ? 1 : 0.45 }}
              >
                <span className="funnel-branch-chip-icon">{br.icon}</span>
                <span>{br.label}</span>
                <span className="funnel-branch-chip-num">{n}</span>
                <span className="funnel-branch-chip-parent">· из «{parentLabel}»</span>
              </div>
            );
          })}
        </div>
      )}

      {expanded && expandedStage && (
        <div className="funnel-expand">
          <div className="funnel-expand-header">
            <span className="funnel-expand-title">
              {expandedStage.label}
              <span className="funnel-expand-count">({stageLeads.length})</span>
            </span>
            <button className="funnel-expand-close" onClick={() => setExpanded(null)}>✕</button>
          </div>
          {stageLeads.length === 0 ? (
            <div className="empty">Нет лидов на этом этапе</div>
          ) : (
            <div className="funnel-lead-list">
              {stageLeads.map((o, i) => {
                const chatUrl = leadChatUrl(o);
                const name = o.client || o.username || '—';
                // 🔴 22.04: hover → открывает панель переписки справа (как в «Горячих»)
                const uname = (o.username || '').replace(/^@/, '').trim();
                const vkId = vkChatId(o);
                const canChat = !!uname || !!vkId;
                const chatChannel = vkId ? 'VK' : 'TG';
                const openChatPanel = () => canChat && chatCtx?.openChat({
                  user_id: null,
                  username: vkId || uname,
                  client: o.client || name,
                  channel: chatChannel,
                });
                const onEnter = canChat ? () => {
                  clearTimeout(hoverTimer.current);
                  hoverTimer.current = setTimeout(openChatPanel, 250);
                } : undefined;
                const onLeave = canChat ? () => clearTimeout(hoverTimer.current) : undefined;
                return (
                  <div key={o.id || (o.username + '-' + i)} className="funnel-lead-card"
                       onMouseEnter={onEnter}
                       onMouseLeave={onLeave}
                       onClick={canChat ? (e) => {
                         // Не открывать если клик по approval-кнопке/input/a
                         const tag = (e.target.tagName || '').toLowerCase();
                         if (tag === 'button' || tag === 'textarea' || tag === 'a' || tag === 'input') return;
                         openChatPanel();
                       } : undefined}
                       style={canChat ? {cursor: 'pointer'} : undefined}>
                    <div className="funnel-lead-info">
                      <div className="funnel-lead-name">
                        {name}
                        {/* chip показывает ЭТАП воронки (куда лид реально попал),
                            а не сырой DB-статус — чтобы при переносе лида chip
                            обновлялся автоматически. */}
                        {expandedStage.label && (
                          <span className="funnel-lead-status">· {expandedStage.label}</span>
                        )}
                      </div>
                      <div className="funnel-lead-meta">
                        {o.event_date && <span>📅 {o.event_date}</span>}
                        {o.location   && <span>📍 {o.location}</span>}

function FunnelSummarySection({ funnel }) {
  const steps = (funnel || [])
    .filter(step => step && step.key && (step.label || step.n !== undefined))
    .map(step => ({
      ...step,
      n: Number(step.n) || 0,
      label: step.label || step.key,
    }));
  if (!steps.length) return null;

  return (
    <div id="funnel-section" className="section" style={{ marginTop: 14 }}>
      <div className="section-title">Воронка</div>
      <div className="funnel-wrap">
        {steps.map((step, i) => {
          const prev = steps[i - 1];
          const skipPct = step.key === 'sent' || step.key === 'followup' || step.key === 'promises' || step.key === 'direct';
          const pct = (!skipPct && prev && prev.n > 0)
            ? Math.round(step.n / prev.n * 100) + '%'
            : null;
          return (
            <div key={step.key} className="funnel-step" title={PIPELINE_HINTS[step.key] || ''}>
              {i > 0 && <span className="funnel-arr">›</span>}
              <div className="funnel-box">
                <div className="funnel-num">{step.n}</div>
                <div className="funnel-name">{step.label}</div>
                {pct && <div className="funnel-pct">{pct}</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RecentSentMessageCard({ message: m, index }) {
  const fmtTime = (ts) => {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    } catch { return String(ts).slice(0, 16).replace('T', ' '); }
  };
  const username = (m.username || '').replace(/^@/, '');
  const client = username
    ? <a href={`https://t.me/${username}`} target="_blank" rel="noopener"
         style={{color:'var(--blue)',textDecoration:'none'}}>{m.client || '@' + username}</a>
    : (m.client || '—');
  const [badgeCls, badgeText] = orderBadge(m.status_label || m.source || 'sent');
  const hasDetails = !!(m.text || m.event_type || m.source);
  const cardRef = React.useRef(null);
  const [tipSide, setTipSide] = React.useState('right');
  React.useLayoutEffect(() => {
    if (!hasDetails) return;
    const card = cardRef.current;
    if (!card) return;
    const compute = () => {
      const r = card.getBoundingClientRect();
      const TIP_W = 440, GAP = 8, MARGIN = 8;
      if (window.innerWidth <= 900) { setTipSide('bottom'); return; }
      if (window.innerWidth - r.right >= TIP_W + GAP + MARGIN) setTipSide('right');
      else if (r.left >= TIP_W + GAP + MARGIN) setTipSide('left');
      else setTipSide('bottom');
    };
    compute();
    window.addEventListener('resize', compute);
    return () => window.removeEventListener('resize', compute);
  }, [hasDetails]);

  return (
    <div
      ref={cardRef}
      className={`order-card order-card-hoverable order-tip-side-${tipSide}`}
      key={`${m.ts || index}-${m.client || ''}-${index}`}
    >
      <div className="order-info">
        <div className="order-client">{client}</div>
        <div className="order-meta">
          {fmtTime(m.ts)}
          {m.channel && <span style={{marginLeft:8}}>{m.channel}</span>}
          {m.event_date && <span style={{marginLeft:8}}>📅 {m.event_date}</span>}
          {m.city && <span style={{marginLeft:8}}>📍 {m.city}</span>}
        </div>
        <div
          className="order-desc-preview"
          title={m.text || ''}
          style={{whiteSpace:'normal', lineHeight:1.35, maxHeight:46}}
        >
          💬 {m.text || '(текст не найден)'}
        </div>
      </div>
      <span className={`badge ${badgeCls}`}>{badgeText || 'sent'}</span>
      {hasDetails && (
        <div className="order-tip">
          <div className="order-tip-label">Отправленное сообщение</div>
          <div className="order-tip-body">{m.text || '(текст не найден)'}</div>
          <div style={{marginTop:8, fontSize:10, color:'#94a3b8'}}>
            {fmtTime(m.ts)}
            {m.channel && ` · ${m.channel}`}
            {m.status_label && ` · ${m.status_label}`}
            {m.source && ` · ${m.source}`}
          </div>
          {(m.event_type || m.event_date || m.city || username) && (
            <div style={{marginTop:6, fontSize:10, color:'#94a3b8'}}>
              {username && `@${username}`}
              {m.event_type && ` · ${m.event_type}`}
              {m.event_date && ` · ${m.event_date}`}
              {m.city && ` · ${m.city}`}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Wrapper: splits leads into LC Band (main) and Drum/Solo Show pipelines,

function ApprovalButtons({ approvalId, draft, username }) {
  const [busy, setBusy] = React.useState(false);
  const [status, setStatus] = React.useState(null);  // 'sent' | 'rejected' | 'error:...'
  const [editing, setEditing] = React.useState(false);
  const [editText, setEditText] = React.useState(draft || '');
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';

  const send = async (overrideText) => {
    if (busy) return;
    setBusy(true);
    try {
      const r = await fetch(`${backendUrl}/api/approval/send`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          approval_id: approvalId,
          override_text: overrideText || undefined,
        }),
      });
      const j = await r.json();
      if (j.ok) {
        setStatus('sent');
        setEditing(false);
      } else {
        setStatus('error:' + (j.error || j.out || '').slice(0, 60));
      }
    } catch (e) {
      setStatus('error:' + String(e).slice(0, 60));
    }
    setBusy(false);
  };

  const reject = async () => {
    if (busy) return;
    if (!confirm('Отклонить draft?')) return;
    setBusy(true);
    try {
      const r = await fetch(`${backendUrl}/api/approval/reject`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({approval_id: approvalId}),
      });
      const j = await r.json();
      if (j.ok) setStatus('rejected');
      else setStatus('error:' + (j.error || '').slice(0, 60));
    } catch (e) {
      setStatus('error:' + String(e).slice(0, 60));
    }
    setBusy(false);
  };

  if (status === 'sent') {
    return (
      <div style={{marginTop:6, fontSize:11, color:'var(--ok)', fontWeight:700}}>
        ✅ Отправлено {username && `@${username}`} — можно обновить дашборд
      </div>
    );
  }
  if (status === 'rejected') {
    return (
      <div style={{marginTop:6, fontSize:11, color:'#f87171', fontWeight:700}}>
        ❌ Отклонён
      </div>
    );
  }
  if (status?.startsWith('error:')) {
    return (
      <div style={{marginTop:6, fontSize:11, color:'#f87171'}}>
        ❌ {status.slice(6)}
      </div>
    );
  }

  if (editing) {
    return (
      <div style={{marginTop:6, display:'flex', flexDirection:'column', gap:5}}>
        <textarea
          value={editText}
          onChange={e => setEditText(e.target.value)}
          rows={4}
          style={{
            width:'100%', padding:'6px 8px', fontSize:12, lineHeight:1.4,
            background:'rgba(255,255,255,0.04)', color:'var(--text)',
            border:'1px solid var(--border)', borderRadius:5, resize:'vertical',
            fontFamily:'inherit',
          }}
        />
        <div style={{display:'flex', gap:6}}>
          <button
            onClick={() => send(editText)}
            disabled={busy || !editText.trim()}
            style={{
              flex:1, padding:'5px 10px', fontSize:11, fontWeight:600,
              background:'var(--ok)', color:'#0a0a12', border:'none',
              borderRadius:4, cursor: busy ? 'wait' : 'pointer',
            }}
          >{busy ? '⏳' : '✅ Отправить с правками'}</button>
          <button
            onClick={() => { setEditing(false); setEditText(draft || ''); }}
            disabled={busy}
            style={{
              padding:'5px 10px', fontSize:11,
              background:'transparent', color:'var(--muted)',
              border:'1px solid var(--border)', borderRadius:4, cursor:'pointer',
            }}
          >Отмена</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{marginTop:6, display:'flex', gap:5, flexWrap:'wrap'}}>
      <button
        onClick={() => send()}
        disabled={busy}
        style={{
          padding:'4px 10px', fontSize:11, fontWeight:700,
          background:'var(--ok)', color:'#0a0a12', border:'none',
          borderRadius:4, cursor: busy ? 'wait' : 'pointer',
        }}
      >{busy ? '⏳ Отправка…' : '✅ Отправить'}</button>
      <button
        onClick={() => setEditing(true)}
        disabled={busy}
        style={{
          padding:'4px 10px', fontSize:11, fontWeight:600,
          background:'rgba(96,165,250,0.15)', color:'var(--blue)',
          border:'1px solid rgba(96,165,250,0.4)',
          borderRadius:4, cursor:'pointer',
        }}
      >✏️ Редактировать</button>
      <button
        onClick={reject}
        disabled={busy}
        style={{
          padding:'4px 10px', fontSize:11, fontWeight:600,
          background:'rgba(248,113,113,0.1)', color:'#f87171',
          border:'1px solid rgba(248,113,113,0.35)',
          borderRadius:4, cursor:'pointer',
        }}
      >❌ Отклонить</button>
    </div>
  );
}


function FunnelSplitSections({ allLeads, archived, pendingDrafts, sessionLog, fallbackFunnel }) {
  const { bandLeads, bandArchived, drumLeads, drumArchived } = React.useMemo(() => {
    const bandL = [], drumL = [], bandA = [], drumA = [];
    (allLeads || []).forEach(o => (isDrumLead(o) ? drumL : bandL).push(o));
    (archived || []).forEach(o => (isDrumLead(o) ? drumA : bandA).push(o));
    return { bandLeads: bandL, bandArchived: bandA, drumLeads: drumL, drumArchived: drumA };
  }, [allLeads, archived]);

  // "Бриф Вадиму" leads — session_actions where status=awaiting_director,
  // joined with the drum lead (by username) to show real profile info.
  const briefLeads = React.useMemo(() => {
    const items = (sessionLog && sessionLog.items) ? sessionLog.items : [];
    // Latest awaiting_director action per username
    const latest = {};
    items.forEach(it => {
      if (it.status !== 'awaiting_director') return;
      const u = (it.username || '').toLowerCase();
      if (!u) return;
      if (!latest[u] || (it.ts || '') > (latest[u].ts || '')) latest[u] = it;
    });
    // For each awaiting_director username, prefer the DB drum lead; otherwise synthesize from session action.
    const byUsername = {};
    drumLeads.forEach(o => {
      const u = (o.username || '').toLowerCase();
      if (u) byUsername[u] = o;
    });
    return Object.entries(latest).map(([u, sa]) => {
      const dbLead = byUsername[u];
      if (dbLead) {
        // Augment with brief details
        return {
          ...dbLead,
          status: 'Бриф Вадиму',
          last_activity: (sa.ts || '').slice(0, 16).replace('T', ' ') || dbLead.last_activity,
        };
      }
      // Synthesize a minimal lead card from session action
      return {
        username: sa.username,
        client: sa.client || sa.username,
        desc: sa.details || sa.event_type || '',
        event_date: sa.event_date || '',
        location: sa.city || '',
        channel: sa.channel || 'TG',
        status: 'Бриф Вадиму',
        last_activity: (sa.ts || '').slice(0, 16).replace('T', ' '),
      };
    });
  }, [sessionLog, drumLeads]);

  const hasLiveFunnelData =
    bandLeads.length > 0 ||
    bandArchived.length > 0 ||
    drumLeads.length > 0 ||
    drumArchived.length > 0 ||
    (pendingDrafts || []).length > 0 ||
    briefLeads.length > 0;

  if (!hasLiveFunnelData) {
    return <FunnelSummarySection funnel={fallbackFunnel} />;
  }

  return (
    <>
      <FunnelSection
        title="Воронка LC Band"
        allLeads={bandLeads}
        archived={bandArchived}
        branchSpec={[{
          key: 'bot', label: 'Питч в боте', icon: '🤖', parent: 'sent', leads: pendingDrafts || [],
        }]}
      />
      <FunnelSection
        title="Воронка Drum Show / Solo"
        allLeads={drumLeads}
        archived={drumArchived}
        branchSpec={[{
          key: 'brief', label: 'Бриф Вадиму', icon: '🥁', parent: 'sent', leads: briefLeads,
        }]}
      />
    </>
  );
}
