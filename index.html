function RecentSentMessageCard({ message: m, index }) {
  const fmtTime = (ts) => {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    } catch { return String(ts).slice(0, 16).replace('T', ' '); }
  };
  const username = (m.username || '').replace(/^@/, '');
  const client = username
    ? <a href={`https://t.me/${username}`} target="_blank" rel="noopener"
         style={{color:'var(--blue)',textDecoration:'none'}}>{m.client || '@' + username}</a>
    : (m.client || '—');
  const [badgeCls, badgeText] = orderBadge(m.status_label || m.source || 'sent');
  const hasDetails = !!(m.text || m.event_type || m.source);
  const cardRef = React.useRef(null);
  const [tipSide, setTipSide] = React.useState('right');
  React.useLayoutEffect(() => {
    if (!hasDetails) return;
    const card = cardRef.current;
    if (!card) return;
    const compute = () => {
      const r = card.getBoundingClientRect();
      const TIP_W = 440, GAP = 8, MARGIN = 8;
      if (window.innerWidth <= 900) { setTipSide('bottom'); return; }
      if (window.innerWidth - r.right >= TIP_W + GAP + MARGIN) setTipSide('right');
      else if (r.left >= TIP_W + GAP + MARGIN) setTipSide('left');
      else setTipSide('bottom');
    };
    compute();
    window.addEventListener('resize', compute);
    return () => window.removeEventListener('resize', compute);
  }, [hasDetails]);

  return (
    <div
      ref={cardRef}
      className={`order-card order-card-hoverable order-tip-side-${tipSide}`}
      key={`${m.ts || index}-${m.client || ''}-${index}`}
    >
      <div className="order-info">
        <div className="order-client">{client}</div>
        <div className="order-meta">
          {fmtTime(m.ts)}
          {m.channel && <span style={{marginLeft:8}}>{m.channel}</span>}
          {m.event_date && <span style={{marginLeft:8}}>📅 {m.event_date}</span>}
          {m.city && <span style={{marginLeft:8}}>📍 {m.city}</span>}
        </div>
        <div
          className="order-desc-preview"
          title={m.text || ''}
          style={{whiteSpace:'normal', lineHeight:1.35, maxHeight:46}}
        >
          💬 {m.text || '(текст не найден)'}
        </div>
      </div>
      <span className={`badge ${badgeCls}`}>{badgeText || 'sent'}</span>
      {hasDetails && (
        <div className="order-tip">
          <div className="order-tip-label">Отправленное сообщение</div>
          <div className="order-tip-body">{m.text || '(текст не найден)'}</div>
          <div style={{marginTop:8, fontSize:10, color:'#94a3b8'}}>
            {fmtTime(m.ts)}
            {m.channel && ` · ${m.channel}`}
            {m.status_label && ` · ${m.status_label}`}
            {m.source && ` · ${m.source}`}
          </div>
          {(m.event_type || m.event_date || m.city || username) && (
            <div style={{marginTop:6, fontSize:10, color:'#94a3b8'}}>
              {username && `@${username}`}
              {m.event_type && ` · ${m.event_type}`}
              {m.event_date && ` · ${m.event_date}`}
              {m.city && ` · ${m.city}`}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Wrapper: splits leads into LC Band (main) and Drum/Solo Show pipelines,
// passes appropriate branchSpec to each FunnelSection.
function ApprovalButtons({ approvalId, draft, username }) {
  const [busy, setBusy] = React.useState(false);
  const [status, setStatus] = React.useState(null);  // 'sent' | 'rejected' | 'error:...'
  const [editing, setEditing] = React.useState(false);
  const [editText, setEditText] = React.useState(draft || '');
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';

  const send = async (overrideText) => {
    if (busy) return;
    setBusy(true);
    try {
      const r = await fetch(`${backendUrl}/api/approval/send`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          approval_id: approvalId,
          override_text: overrideText || undefined,
        }),
      });
      const j = await r.json();
      if (j.ok) {
        setStatus('sent');
        setEditing(false);
      } else {
        setStatus('error:' + (j.error || j.out || '').slice(0, 60));
      }
    } catch (e) {
      setStatus('error:' + String(e).slice(0, 60));
    }
    setBusy(false);
  };

  const reject = async () => {
    if (busy) return;
    if (!confirm('Отклонить draft?')) return;
    setBusy(true);
    try {
      const r = await fetch(`${backendUrl}/api/approval/reject`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({approval_id: approvalId}),
      });
      const j = await r.json();
      if (j.ok) setStatus('rejected');
      else setStatus('error:' + (j.error || '').slice(0, 60));
    } catch (e) {
      setStatus('error:' + String(e).slice(0, 60));
    }
    setBusy(false);
  };

  if (status === 'sent') {
    return (
      <div style={{marginTop:6, fontSize:11, color:'var(--ok)', fontWeight:700}}>
        ✅ Отправлено {username && `@${username}`} — можно обновить дашборд
      </div>
    );
  }
  if (status === 'rejected') {
    return (
      <div style={{marginTop:6, fontSize:11, color:'#f87171', fontWeight:700}}>
        ❌ Отклонён
      </div>
    );
  }
  if (status?.startsWith('error:')) {
    return (
      <div style={{marginTop:6, fontSize:11, color:'#f87171'}}>
        ❌ {status.slice(6)}
      </div>
    );
  }

  if (editing) {
    return (
      <div style={{marginTop:6, display:'flex', flexDirection:'column', gap:5}}>
        <textarea
          value={editText}
          onChange={e => setEditText(e.target.value)}
          rows={4}
          style={{
            width:'100%', padding:'6px 8px', fontSize:12, lineHeight:1.4,
            background:'rgba(255,255,255,0.04)', color:'var(--text)',
            border:'1px solid var(--border)', borderRadius:5, resize:'vertical',
            fontFamily:'inherit',
          }}
        />
        <div style={{display:'flex', gap:6}}>
          <button
            onClick={() => send(editText)}
            disabled={busy || !editText.trim()}
            style={{
              flex:1, padding:'5px 10px', fontSize:11, fontWeight:600,
              background:'var(--ok)', color:'#0a0a12', border:'none',
              borderRadius:4, cursor: busy ? 'wait' : 'pointer',
            }}
          >{busy ? '⏳' : '✅ Отправить с правками'}</button>
          <button
            onClick={() => { setEditing(false); setEditText(draft || ''); }}
            disabled={busy}
            style={{
              padding:'5px 10px', fontSize:11,
              background:'transparent', color:'var(--muted)',
              border:'1px solid var(--border)', borderRadius:4, cursor:'pointer',
            }}
          >Отмена</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{marginTop:6, display:'flex', gap:5, flexWrap:'wrap'}}>
      <button
        onClick={() => send()}
        disabled={busy}
        style={{
          padding:'4px 10px', fontSize:11, fontWeight:700,
          background:'var(--ok)', color:'#0a0a12', border:'none',
          borderRadius:4, cursor: busy ? 'wait' : 'pointer',
        }}
      >{busy ? '⏳ Отправка…' : '✅ Отправить'}</button>
      <button
        onClick={() => setEditing(true)}
        disabled={busy}
        style={{
          padding:'4px 10px', fontSize:11, fontWeight:600,
          background:'rgba(96,165,250,0.15)', color:'var(--blue)',
          border:'1px solid rgba(96,165,250,0.4)',
          borderRadius:4, cursor:'pointer',
        }}
      >✏️ Редактировать</button>
      <button
        onClick={reject}
        disabled={busy}
        style={{
          padding:'4px 10px', fontSize:11, fontWeight:600,
          background:'rgba(248,113,113,0.1)', color:'#f87171',
          border:'1px solid rgba(248,113,113,0.35)',
          borderRadius:4, cursor:'pointer',
        }}
      >❌ Отклонить</button>
    </div>
  );
}


function FunnelSplitSections({ allLeads, archived, pendingDrafts, sessionLog, fallbackFunnel }) {
  // 15.05.2026: переименовано drum* → broker*. Содержит drum_show, solo показы,
  // host, animation, dance, fire, dj — всё что идёт через broker pipeline.
  const { bandLeads, bandArchived, brokerLeads, brokerArchived } = React.useMemo(() => {
    const bandL = [], brokerL = [], bandA = [], brokerA = [];
    (allLeads || []).forEach(o => (isBrokerLead(o) ? brokerL : bandL).push(o));
    (archived || []).forEach(o => (isBrokerLead(o) ? brokerA : bandA).push(o));
    return { bandLeads: bandL, bandArchived: bandA, brokerLeads: brokerL, brokerArchived: brokerA };
  }, [allLeads, archived]);
  // Compat aliases — пока briefLeads ниже использует drumLeads (drum-only брифы).
  const drumLeads = brokerLeads;
  const drumArchived = brokerArchived;

  // "Бриф Вадиму" leads — session_actions where status=awaiting_director,
  // joined with the drum lead (by username) to show real profile info.
  const briefLeads = React.useMemo(() => {
    const items = (sessionLog && sessionLog.items) ? sessionLog.items : [];
    // Latest awaiting_director action per username
    const latest = {};
    items.forEach(it => {
      if (it.status !== 'awaiting_director') return;
      const u = (it.username || '').toLowerCase();
      if (!u) return;
      if (!latest[u] || (it.ts || '') > (latest[u].ts || '')) latest[u] = it;
    });
    // For each awaiting_director username, prefer the DB drum lead; otherwise synthesize from session action.
    const byUsername = {};
    drumLeads.forEach(o => {
      const u = (o.username || '').toLowerCase();
      if (u) byUsername[u] = o;
    });
    return Object.entries(latest).map(([u, sa]) => {
      const dbLead = byUsername[u];
      if (dbLead) {
        // Augment with brief details
        return {
          ...dbLead,
          status: 'Бриф Вадиму',
          last_activity: (sa.ts || '').slice(0, 16).replace('T', ' ') || dbLead.last_activity,
        };
      }
      // Synthesize a minimal lead card from session action
      return {
        username: sa.username,
        client: sa.client || sa.username,
        desc: sa.details || sa.event_type || '',
        event_date: sa.event_date || '',
        location: sa.city || '',
        channel: sa.channel || 'TG',
        status: 'Бриф Вадиму',
        last_activity: (sa.ts || '').slice(0, 16).replace('T', ' '),
      };
    });
  }, [sessionLog, drumLeads]);

  const hasLiveFunnelData =
    bandLeads.length > 0 ||
    bandArchived.length > 0 ||
    brokerLeads.length > 0 ||
    brokerArchived.length > 0 ||
    (pendingDrafts || []).length > 0 ||
    briefLeads.length > 0;

  if (!hasLiveFunnelData) {
    return <FunnelSummarySection funnel={fallbackFunnel} />;
  }

  return (
    <>
      <FunnelSection
        title="Воронка LC Band"
        allLeads={bandLeads}
        archived={bandArchived}
        branchSpec={[{
          key: 'bot', label: 'Питч в боте', icon: '🤖', parent: 'sent', leads: pendingDrafts || [],
        }]}
      />
      {/* 15.05.2026: «Воронка брокер» теперь = двухполосный SVG-funnel
          (BrokerDualFunnel) + список заказов с подрядчиками (BrokerOrdersList).
          Заворачиваем в BrokerFunnelArea чтобы fetch /api/broker_orders был один. */}
      <BrokerFunnelArea />
    </>
  );
}

  declined:               { icon: '❌', label: 'Отказался',         color: '#f87171' },
  no_price:               { icon: '🔍', label: 'Нет цены',          color: '#fbbf24' },
};

const _VS_CEILING_BADGE = {
  under:     { icon: '✓', label: 'под потолком',  color: '#34d399' },
  at:        { icon: '~', label: 'на потолке',    color: '#fbbf24' },
  over:      { icon: '⚠', label: 'выше потолка',  color: '#f87171' },
  no_price:  { icon: '?', label: 'нет цены',      color: '#94a3b8' },
  no_budget: { icon: '–', label: 'нет бюджета',   color: '#94a3b8' },
};

function _fmtRub(n) {
  if (!n || n <= 0) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + ' млн';
  if (n >= 1000) return Math.round(n / 1000) + 'к';
  return String(n);
}

function BrokerCandidateRow({ c }) {
  const stageBadge = _BROKER_STAGE_BADGE[c.stage] || { icon: '•', label: c.stage, color: '#94a3b8' };
  const vsBadge = _VS_CEILING_BADGE[c.vs_ceiling] || _VS_CEILING_BADGE.no_price;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 10, padding: '6px 10px',
      borderTop: '1px solid rgba(255,255,255,.04)', fontSize: 12,
    }}>
      <span style={{ minWidth: 22, fontSize: 14, textAlign: 'center' }} title={stageBadge.label}>
        {stageBadge.icon}
      </span>
      <a href={`https://t.me/${c.username}`} target="_blank" rel="noopener"
         style={{ color: 'var(--blue)', fontWeight: 700, minWidth: 130, textDecoration: 'none' }}>
        @{c.username}
      </a>
      {c.has_standard_package && (
        <span title={`Готовый пакет в roster${c.standard_price_rub ? ` (${_fmtRub(c.standard_price_rub)})` : ''} — pipeline может идти к pitch без ожидания подрядчика`}
              style={{ fontSize: 11, fontWeight: 700, padding: '1px 6px',
                       background: 'rgba(34,211,238,.15)', color: '#22d3ee',
                       border: '1px solid #22d3ee55', borderRadius: 10 }}>
          🎁 готов
        </span>
      )}
      {(() => {
        // 16.05.2026 Phase 3 — quality gate badge.
        // Кандидат «прошёл проверку» если: есть цена, не выше потолка,
        // есть медиа (фото/видео), score >= 6. Это все слои eligibility
        // + presend safety check от broker_pipeline / broker_quality_scorer.
        const passes = (
          c.price_rub > 0 &&
          c.vs_ceiling !== 'over' &&
          (c.media?.photos > 0 || c.media?.videos > 0) &&
          (c.quality_score == null || c.quality_score >= 6)
        );
        if (!passes) return null;
        return (
          <span title="Quality gate passed: цена ≤ потолка, есть фото/видео, score ≥6 — кандидат готов к relay клиенту"
                style={{ fontSize: 11, fontWeight: 700, padding: '1px 5px',
                         background: 'rgba(52,211,153,.15)', color: '#34d399',
                         border: '1px solid #34d39955', borderRadius: 10 }}>
            🛡️
          </span>
        );
      })()}
      <span style={{ minWidth: 56, color: '#cbd5e1' }}>
        {_fmtRub(c.price_rub)}
      </span>
      <span style={{ minWidth: 18, color: vsBadge.color, fontWeight: 700 }} title={vsBadge.label}>
        {vsBadge.icon}
      </span>
      {c.quality_score != null && (
        <span style={{ color: '#a78bfa', minWidth: 50 }} title="quality score (1-10) + media bonus">
          {c.quality_score}/10{c.quality_media_bonus > 0 ? `+${c.quality_media_bonus}` : ''}
        </span>
      )}
      {c.cost_quality_ratio != null && (
        <span style={{ color: '#94a3b8', minWidth: 60 }} title="cost / quality ratio (lower = better)">
          ratio {c.cost_quality_ratio}
        </span>
      )}
      {(c.media?.photos > 0 || c.media?.videos > 0) && (
        <span style={{ color: '#94a3b8' }}>
          {c.media.photos > 0 && `📷${c.media.photos} `}
          {c.media.videos > 0 && `🎥${c.media.videos}`}
        </span>
      )}
      <span style={{ color: '#94a3b8', flex: 1, marginLeft: 4, fontStyle: 'italic',
                     overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
        {c.summary || c.raw_message || ''}
      </span>
    </div>
  );
}

// Org-status badge label (читаемая стадия по сторонe организатора).
function _orgStageLabel(orderStatus) {
  const k = _orgStageKey(orderStatus);
  const found = BROKER_ORG_STAGES.find(s => s.key === k);
  return found ? found.label : orderStatus;
}

// 15.05.2026: двухполосная воронка брокер с SVG-связями. Вверху — организаторы
// (по broker_order.status), внизу — подрядчики (агрегат по candidate.stage всех
// заказов). Между ними тонкие линии — одна линия = (broker_order × candidate).
// Hover на ячейку или на линию подсвечивает связанный заказ полностью.
const BROKER_ORG_STAGES = [
  { key: 'incoming',   label: 'Поступил',     statuses: ['intake', 'brief_pending'] },
  { key: 'brief_sent', label: 'Бриф ушёл',    statuses: ['brief_sent', 'contractor_replied'] },
  { key: 'pitched',    label: 'Питч клиенту', statuses: ['client_relayed', 'contractor_relayed'] },
  { key: 'thinking',   label: 'Думает',       statuses: ['client_replied'] },
  { key: 'won',        label: 'Согласовали',  statuses: ['closed_won'] },
  { key: 'lost',       label: 'Отказ',        statuses: ['closed_lost'] },
];
const BROKER_CONTR_STAGES = [
  { key: 'searching',   label: 'Ищем',           candStages: ['__empty__'] },
  { key: 'briefed',     label: 'Бриф отправлен', candStages: ['briefed_waiting','awaiting_contractor','no_price'] },
  { key: 'replied',     label: 'Ответил',        candStages: ['replied_ready','in_casting_top'] },
  { key: 'with_client', label: 'У клиента',      candStages: ['sent_to_client'] },
  { key: 'declined',    label: 'Отказался',      candStages: ['declined','replied_not_selected','hidden_over_budget'] },
];

function _orgStageKey(orderStatus) {
  const s = (orderStatus || '').toLowerCase();
  for (const st of BROKER_ORG_STAGES) {
    if (st.statuses.includes(s)) return st.key;
  }
  return 'incoming';
}
function _contrStageKey(candStage) {
  const cs = candStage || '__empty__';
  for (const st of BROKER_CONTR_STAGES) {
    if (st.candStages.includes(cs)) return st.key;
  }
  return 'briefed';
}

function BrokerDualFunnel({ data, selectedFilter, onCellClick }) {
  // refs to cells for measuring centers
  const containerRef = React.useRef(null);
  const topRefs  = React.useRef({});
  const botRefs  = React.useRef({});
  const [tick, setTick] = React.useState(0);       // forces SVG recompute on resize
  const [hoverOrderId, setHoverOrderId] = React.useState(null);
  const [hoverCell, setHoverCell] = React.useState(null);  // {row: 'top'|'bot', key}

  React.useEffect(() => {
    const r = () => setTick(t => t + 1);
    window.addEventListener('resize', r);
    const ro = new ResizeObserver(r);
    if (containerRef.current) ro.observe(containerRef.current);
    return () => { window.removeEventListener('resize', r); ro.disconnect(); };
  }, []);
  React.useEffect(() => { setTick(t => t + 1); }, [data]);

  const items = (data?.items) || [];

  // Build connections: { orderId, orgKey, botKey, candidateUsername }
  const connections = [];
  const orgCounts = Object.fromEntries(BROKER_ORG_STAGES.map(s => [s.key, 0]));
  const botCounts = Object.fromEntries(BROKER_CONTR_STAGES.map(s => [s.key, 0]));
  items.forEach(o => {
    const ok = _orgStageKey(o.status);
    orgCounts[ok] = (orgCounts[ok] || 0) + 1;
    if (!o.candidates || o.candidates.length === 0) {
      connections.push({ orderId: o.id, orgKey: ok, botKey: 'searching', cand: null });
      botCounts['searching'] = (botCounts['searching'] || 0) + 1;
    } else {
      o.candidates.forEach(c => {
        const bk = _contrStageKey(c.stage);
        connections.push({ orderId: o.id, orgKey: ok, botKey: bk, cand: c.username });
        botCounts[bk] = (botCounts[bk] || 0) + 1;
      });
    }
  });

  // Compute SVG paths after layout
  const [pathsKey, setPathsKey] = React.useState(0);
  React.useEffect(() => {
    // Defer one frame so refs are populated
    const r = requestAnimationFrame(() => setPathsKey(k => k + 1));
    return () => cancelAnimationFrame(r);
  }, [tick, items.length]);

  const containerBox = containerRef.current?.getBoundingClientRect();
  const getCenter = (rowRefs, key) => {
    const el = rowRefs.current[key];
    if (!el || !containerBox) return null;
    const r = el.getBoundingClientRect();
    return {
      x: r.left + r.width / 2 - containerBox.left,
      y: rowRefs === topRefs ? r.bottom - containerBox.top : r.top - containerBox.top,
    };
  };

  const renderPaths = () => {
    if (!containerBox) return null;
    return connections.map((conn, i) => {
      const t = getCenter(topRefs, conn.orgKey);
      const b = getCenter(botRefs, conn.botKey);
      if (!t || !b) return null;
      const dy = b.y - t.y;
      // Smooth cubic Bezier
      const cp1 = { x: t.x, y: t.y + dy * 0.4 };
      const cp2 = { x: b.x, y: b.y - dy * 0.4 };
      const d = `M ${t.x.toFixed(1)} ${t.y.toFixed(1)} C ${cp1.x.toFixed(1)} ${cp1.y.toFixed(1)}, ${cp2.x.toFixed(1)} ${cp2.y.toFixed(1)}, ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
      const isHover = hoverOrderId === conn.orderId ||
        (hoverCell?.row === 'top' && hoverCell?.key === conn.orgKey) ||
        (hoverCell?.row === 'bot' && hoverCell?.key === conn.botKey);
      const dimmed = (hoverOrderId || hoverCell) && !isHover;
      return (
        <path
          key={`${conn.orderId}-${conn.cand || 'searching'}-${i}`}
          d={d}
          stroke={isHover ? '#22d3ee' : '#475569'}
          strokeWidth={isHover ? 2.2 : 1}
          fill="none"
          opacity={dimmed ? 0.15 : (isHover ? 0.95 : 0.55)}
          style={{ cursor: 'pointer', transition: 'opacity 120ms, stroke-width 120ms' }}
          onMouseEnter={() => setHoverOrderId(conn.orderId)}
          onMouseLeave={() => setHoverOrderId(null)}
        >
          <title>{`@${items.find(o => o.id === conn.orderId)?.client_username || '?'} → ${conn.cand ? '@' + conn.cand : '(ищем)'}`}</title>
        </path>
      );
    });
  };

  const cellStyle = (count, isHover, isSelected) => ({
    background: isSelected ? 'rgba(34,211,238,.28)'
              : count > 0   ? (isHover ? 'rgba(34,211,238,.18)' : 'rgba(255,255,255,.04)')
              : 'rgba(255,255,255,.015)',
    border: `1px solid ${isSelected ? '#22d3ee' : (isHover ? 'rgba(34,211,238,.6)' : 'rgba(255,255,255,.08)')}`,
    boxShadow: isSelected ? '0 0 12px rgba(34,211,238,.4)' : 'none',
    borderRadius: 8,
    padding: '8px 6px',
    minHeight: 60,
    display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center',
    cursor: count > 0 ? 'pointer' : 'default',
    transition: 'background 120ms, border 120ms, box-shadow 120ms',
  });

  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title">Воронка брокер</div>
      <div ref={containerRef} style={{ position: 'relative', userSelect: 'none' }}>
        <div style={{ fontSize: 10, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 4 }}>
          🧑‍💼 Организаторы
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: `repeat(${BROKER_ORG_STAGES.length}, 1fr)`, gap: 6 }}>
          {BROKER_ORG_STAGES.map(st => {
            const isHover = hoverCell?.row === 'top' && hoverCell?.key === st.key;
            const isSelected = selectedFilter?.row === 'top' && selectedFilter?.key === st.key;
            const count = orgCounts[st.key];
            return (
              <div key={st.key}
                   ref={el => { topRefs.current[st.key] = el; }}
                   onMouseEnter={() => setHoverCell({ row: 'top', key: st.key })}
                   onMouseLeave={() => setHoverCell(null)}
                   onClick={() => count > 0 && onCellClick && onCellClick('top', st.key, st.label)}
                   style={cellStyle(count, isHover, isSelected)}>
                <div style={{ fontSize: 22, fontWeight: 800, color: isSelected ? '#22d3ee' : (count > 0 ? '#fbbf24' : '#475569') }}>
                  {count}
                </div>
                <div style={{ fontSize: 10.5, color: '#cbd5e1', marginTop: 2, textAlign: 'center' }}>{st.label}</div>
              </div>
            );
          })}
        </div>
        <div style={{ position: 'relative', height: 90, margin: '4px 0' }}>
          <svg width="100%" height="100%" style={{ position: 'absolute', top: 0, left: 0, pointerEvents: 'none' }}>
            <g key={pathsKey} style={{ pointerEvents: 'visiblePainted' }}>
              {renderPaths()}
            </g>
          </svg>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: `repeat(${BROKER_CONTR_STAGES.length}, 1fr)`, gap: 6 }}>
          {BROKER_CONTR_STAGES.map(st => {
            const isHover = hoverCell?.row === 'bot' && hoverCell?.key === st.key;
            const isSelected = selectedFilter?.row === 'bot' && selectedFilter?.key === st.key;
            const count = botCounts[st.key];
            return (
              <div key={st.key}
                   ref={el => { botRefs.current[st.key] = el; }}
                   onMouseEnter={() => setHoverCell({ row: 'bot', key: st.key })}
                   onMouseLeave={() => setHoverCell(null)}
                   onClick={() => count > 0 && onCellClick && onCellClick('bot', st.key, st.label)}
                   style={cellStyle(count, isHover, isSelected)}>
                <div style={{ fontSize: 22, fontWeight: 800, color: isSelected ? '#22d3ee' : (count > 0 ? '#22d3ee' : '#475569') }}>
                  {count}
                </div>
                <div style={{ fontSize: 10.5, color: '#cbd5e1', marginTop: 2, textAlign: 'center' }}>{st.label}</div>
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 10, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: 1, marginTop: 4 }}>
          🤝 Подрядчики
        </div>
      </div>
    </div>
  );
}


// Объединённая обёртка: один fetch обслуживает и дуал-воронку, и список.
function BrokerFunnelArea() {
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState(false);
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
  React.useEffect(() => {
    let cancelled = false;
    async function fetchOnce() {
      try {
        const r = await fetch(`${backendUrl}/api/broker_orders`, { cache: 'no-store' });
        const j = await r.json();
        if (!cancelled && r.ok) { setData(j); setError(false); }
        else if (!cancelled) setError(true);
      } catch (e) {
        if (!cancelled) setError(true);
      }
    }
    fetchOnce();
    const t = setInterval(fetchOnce, 30000);
    return () => { cancelled = true; clearInterval(t); };
  }, [backendUrl]);

  // 15.05.2026 (variant C iteration 2): click-to-filter — клик на ячейку
  // воронки фильтрует список заказов снизу. selectedFilter = null | {row, key, label}.
  const [selectedFilter, setSelectedFilter] = React.useState(null);
  const onCellClick = (row, key, label) => {
    setSelectedFilter(prev =>
      prev && prev.row === row && prev.key === key ? null : { row, key, label }
    );
  };
  if (!data) return null;
  return (
    <>
      <BrokerSummaryCards data={data} selectedFilter={selectedFilter} onFilterByCode={(code) => setSelectedFilter({row: 'code', key: code, label: code})} />
      <BrokerPaymentLane data={data} />
      <BrokerDualFunnel data={data} selectedFilter={selectedFilter} onCellClick={onCellClick} />
      <BrokerRelayNowLane data={data} />
      <BrokerOrdersList data={data} error={error} selectedFilter={selectedFilter} clearFilter={() => setSelectedFilter(null)} />
    </>
  );
}

function BrokerOrdersList({ data, error, selectedFilter, clearFilter }) {
  if (!data) return null;
  if (error || !data.items || data.items.length === 0) {
    return (
      <div className="section" style={{ marginTop: 14 }}>
        <div className="section-title">Активные брокер-заказы</div>
        <div style={{ color: '#94a3b8', fontSize: 12 }}>
          {error ? '(не удалось загрузить /api/broker_orders)' : '(нет активных заказов)'}
        </div>
      </div>
    );
  }
  // Apply filter
  let items = data.items;
  if (selectedFilter) {
    if (selectedFilter.row === 'top') {
      items = items.filter(o => _orgStageKey(o.status) === selectedFilter.key);
    } else if (selectedFilter.row === 'code') {
      // 16.05 Phase 1: фильтр по block_code из summary cards.
      items = items.filter(o => o.block_code === selectedFilter.key);
    } else {
      // bot row: order matches if at least one candidate is in that stage,
      // OR if 'searching' selected and order has no candidates.
      const target = selectedFilter.key;
      items = items.filter(o => {
        const cands = o.candidates || [];
        if (target === 'searching') return cands.length === 0;
        return cands.some(c => _contrStageKey(c.stage) === target);
      });
    }
  }
  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title" style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <span>
          Активные брокер-заказы
          <span style={{ color: '#94a3b8', fontWeight: 600, marginLeft: 6 }}>
            · {items.length}{selectedFilter ? ` из ${data.total}` : ''}
          </span>
        </span>
        {selectedFilter && (
          <button onClick={clearFilter}
                  style={{
                    padding: '3px 10px', fontSize: 11, fontWeight: 600,
                    background: 'rgba(34,211,238,.15)', color: '#22d3ee',
                    border: '1px solid rgba(34,211,238,.5)',
                    borderRadius: 12, cursor: 'pointer',
                  }}>
            фильтр: {selectedFilter.row === 'top' ? '🧑‍💼' : selectedFilter.row === 'code' ? '🏷️' : '🤝'} {selectedFilter.label} ✕

      <div style={{ fontSize: 11, color: '#64748b', marginBottom: 8 }}>
        ⏳ ждём ответ  ✅ готов к relay  🎯 в кастинге  📤 у клиента  🥉 не выбран  💎 over budget  ❌ отказался  &nbsp;·&nbsp;

function OrderCard({ order: o }) {
  const [cls, txt] = orderBadge(o.status);
  const overdue = isOverdue(o);
  const clientEl = o.username
    ? <a href={`https://t.me/${o.username}`} target="_blank" rel="noopener"
         style={{color:'var(--blue)',textDecoration:'none'}}>{o.client || o.username}</a>
    : (o.client || '—');
  const descPreview = (o.desc || '').slice(0, 140);
  const hasDetails = !!(o.desc || o.history);
  const historyEntries = (o.history || '')
    .split(/\n(?=\[)/)
    .filter(Boolean)
    .slice(-3);

  const cardRef = React.useRef(null);
  const [tipSide, setTipSide] = React.useState('right');
  React.useLayoutEffect(() => {
    if (!hasDetails) return;
    const card = cardRef.current;
    if (!card) return;
    const compute = () => {
      const r = card.getBoundingClientRect();
      const TIP_W = 440, GAP = 8, MARGIN = 8;
      if (window.innerWidth <= 900) { setTipSide('bottom'); return; }
      if (window.innerWidth - r.right >= TIP_W + GAP + MARGIN) setTipSide('right');
      else if (r.left >= TIP_W + GAP + MARGIN) setTipSide('left');
      else setTipSide('bottom');
    };
    compute();
    window.addEventListener('resize', compute);
    return () => window.removeEventListener('resize', compute);
  }, [hasDetails]);

  return (
    <div
      ref={cardRef}
      className={`order-card order-card-hoverable order-tip-side-${tipSide}${overdue ? ' order-card-overdue' : ''}`}
    >
      <div className="order-info">
        <div className="order-client">
          {clientEl}
          {overdue && <span style={{marginLeft:6,fontSize:10,color:'#f87171',fontWeight:700}}>⚠ просрочено</span>}
        </div>
        <div className="order-meta">
          {o.date_event && <span>📅 {o.date_event}</span>}
          {o.location   && <span style={{marginLeft:8}}>📍 {o.location}</span>}
        </div>
        {descPreview && (
          <div className="order-desc-preview" title={o.desc}>
            💬 {descPreview}{o.desc && o.desc.length > 140 ? '…' : ''}
          </div>
        )}
      </div>
      <span className={`badge ${cls}`}>{txt || '?'}</span>
      {hasDetails && (
        <div className="order-tip">
          {o.desc && (
            <>
              <div className="order-tip-label">Изначальный запрос</div>
              <div className="order-tip-body">{o.desc}</div>
            </>
          )}
          {historyEntries.length > 0 && (
            <>
              <div className="order-tip-label" style={{marginTop:8}}>Переписка (последние {historyEntries.length})</div>
              <div className="order-tip-body order-tip-history">
                {historyEntries.map((e, i) => (
                  <div key={i} className="order-tip-hist-line">{e.trim()}</div>
                ))}
              </div>
            </>
          )}
          {o.source_chat && (
            <div style={{marginTop:8, fontSize:10, color:'var(--muted)'}}>
              Источник: {o.source_chat}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  async function getOrPromptToken() {
    let t = localStorage.getItem('lcband_admin_token') || '';
    if (!t) {
      t = (window.prompt('🔐 Admin token (~/lcband/.env: DASHBOARD_ADMIN_TOKEN):') || '').trim();
      if (!t) return null;
      localStorage.setItem('lcband_admin_token', t);
    }
    return t;
  }

  function toggleArm() {
    if (busy) return;
    setArmed(a => !a);
  }

  // 13.05.2026 Codex review: admin-safe кнопка. Перед /api/restart_agents
  // делаем health probe через текущий tunnel URL И localhost fallback.
  // Если оба недоступны — показываем понятную ошибку (tunnel протух vs
  // tunnel запускается vs backend dead).
  async function _probeBackend(url, timeoutMs = 4000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(`${url}/api/health`, {signal: ctrl.signal, mode: 'cors'});
      clearTimeout(t);
      if (!r.ok) return {ok: false, reason: `HTTP ${r.status}`};
      const j = await r.json();
      return {ok: !!j.ok, reason: 'live'};
    } catch (e) {
      clearTimeout(t);
      return {ok: false, reason: String(e.message || e).slice(0, 120)};
    }
  }

  async function _resolveBackend() {
    // Try cloudflare tunnel URL first (from backend_url.json), then localhost
    const candidates = [
      {url: backendUrl, label: 'cloudflare tunnel'},
      {url: 'http://127.0.0.1:8878', label: 'localhost (только на ноуте)'},
    ];
    const tried = [];
    for (const c of candidates) {
      if (!c.url) continue;
      const probe = await _probeBackend(c.url);
      tried.push({...c, ...probe});
      if (probe.ok) return {pick: c, tried};
    }
    return {pick: null, tried};
  }

  async function detonate() {
    if (busy || !armed) return;
    if (!window.confirm('🚨 ПЕРЕЗАГРУЗИТЬ ВСЕ launchd-АГЕНТЫ?\n\n47 из 49 будут stop/start.\nDashboard-backend и wa-export исключены.')) return;
    const token = await getOrPromptToken();
    if (!token) return;
    setBusy(true);
    setResult(null);

    // Pre-flight: убедиться что backend доступен прежде чем спрашивать рестарт
    const resolved = await _resolveBackend();
    if (!resolved.pick) {
      const summary = resolved.tried.map(t => `• ${t.label} (${t.url}): ${t.reason}`).join('\n');
      alert(
        '❌ Backend недоступен ни по одному пути.\n\n' +
        summary +
        '\n\nВозможные причины:\n' +
        '• Cloudflare tunnel протух — tunnel-watcher поднимает новый ' +
        '(жди 1-3 мин, в браузере жми Cmd+Shift+R)\n' +
        '• macOS DNS cache держит negative — sudo dscacheutil -flushcache\n' +
        '• Backend на ноуте умер — launchctl list | grep dashboard-backend'
      );
      setBusy(false);
      return;
    }

    const targetUrl = resolved.pick.url;
    try {
      const r = await fetch(`${targetUrl}/api/restart_agents`, {
        method:  'POST',
        headers: {'Content-Type':'application/json', 'X-Admin-Token': token},
        body:    JSON.stringify({}),
      });
      const j = await r.json();
      if (r.status === 403) {
        localStorage.removeItem('lcband_admin_token');
        alert('❌ Неверный токен — удалён. Попробуй ещё раз.');
      } else if (r.status === 503) {
        alert(`Endpoint disabled: ${j.error}`);
      } else if (!r.ok) {
        alert(`Ошибка: ${j.error || r.status}`);
      } else {
        setResult({
          ok: j.ok, failed: j.failed, total: j.total, results: j.results,
          via: resolved.pick.label,
        });
        setTimeout(() => { setResult(null); setArmed(false); }, 20000);
      }
    } catch (e) {
      alert(
        `Backend probe прошёл (${resolved.pick.label}), но POST упал:\n` +
        String(e).slice(0, 200)
      );
    } finally {
      setBusy(false);
    }
  }

  return (

            {!armed && (

        </div>
        <div
          className={`reset-status ${busy ? 'busy' : result ? (result.failed ? 'fail' : 'ok') : ''}`}
          title={result?.results?.filter(x => !x.ok).map(x => `${x.label}: ${x.msg}`).join('\n') || ''}
        >
          {busy ? '⏳ ПЕРЕЗАПУСК...' :
           result ? (result.failed
                      ? `⚠ ${result.ok}/${result.total} ok · ${result.failed} fail`
                      : `✅ ${result.ok}/${result.total} АГЕНТОВ ПЕРЕЗАПУЩЕНО`)
                  : ' '}
        </div>
      </div>

      <div className="reset-secondary-actions">
        <SingleAgentRestartButton
          endpoint="/api/restart_dashboard_backend"
          label="backend"
          why="Backend сам обрабатывает HTTP-ответ, поэтому рестартуется отдельной delayed-командой."
          backendUrl={backendUrl}

        />
        <SingleAgentRestartButton

          why="WA Web держит linked-device session; перезапускать отдельно, чтобы не ловить QR/флаги."
          backendUrl={backendUrl}

  );
}


function SingleAgentRestartButton({endpoint, label, why, backendUrl, getOrPromptToken}) {
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState(null);

  async function _probeBackend(url, timeoutMs = 4000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(`${url}/api/health`, {signal: ctrl.signal, mode: 'cors'});
      clearTimeout(t);
      if (!r.ok) return {ok: false, reason: `HTTP ${r.status}`};
      const j = await r.json();
      return {ok: !!j.ok, reason: 'live'};
    } catch (e) {
      clearTimeout(t);
      return {ok: false, reason: String(e.message || e).slice(0, 120)};
    }
  }

  async function _resolveBackend() {
    const candidates = [
      {url: backendUrl, label: 'cloudflare tunnel'},
      {url: 'http://127.0.0.1:8878', label: 'localhost (только на ноуте)'},
    ];
    for (const c of candidates) {
      if (!c.url) continue;
      const probe = await _probeBackend(c.url);
      if (probe.ok) return c;
    }
    return null;
  }

  async function fire() {
    if (busy) return;
    if (!window.confirm(`${label}?\n\n${why}`)) return;
    const token = await getOrPromptToken();
    if (!token) return;
    setBusy(true);
    setMsg(null);
    const pick = await _resolveBackend();
    if (!pick) {
      alert('❌ Backend недоступен (ни tunnel ни localhost)');
      setBusy(false);
      return;
    }
    try {
      const r = await fetch(`${pick.url}${endpoint}`, {
        method:  'POST',
        headers: {'Content-Type':'application/json', 'X-Admin-Token': token},
        body:    JSON.stringify({}),
      });
      const j = await r.json();
      if (r.status === 403) {
        localStorage.removeItem('lcband_admin_token');
        alert('❌ Неверный токен — удалён');
      } else if (!r.ok) {
        alert(`Ошибка: ${j.error || r.status}`);
      } else {
        setMsg({ok: !!j.ok, text: j.msg || (j.ok ? 'OK' : 'fail')});
        setTimeout(() => setMsg(null), 15000);
      }
    } catch (e) {
      // Self-restart endpoint может оборвать connection до response — это OK
      if (endpoint.includes('dashboard_backend')) {
        setMsg({ok: true, text: 'kickstart launched (connection broken — expected)'});
        setTimeout(() => setMsg(null), 15000);
      } else {
        alert('Network error: ' + String(e).slice(0, 200));
      }
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="single-agent-restart" title={why}>
      <button onClick={fire} disabled={busy}>
        {busy ? '⏳' : '⟳'} {label}
      </button>
      {msg && (
        <span className="msg" style={{color: msg.ok ? '#34d399' : '#fbbf24'}}>
          {msg.ok ? '✓' : '⚠'} {msg.text}
        </span>
      )}
      <div className="why">{why}</div>
    </div>
  );
}

function DeliveryEfficiencyCard({aiCalls24h, sentMessages24h, sentConversion24h, aiDelivery, aiDeliveryTrend, aiTrendRange = 'day', onAiTrendRangeChange, deliveryOutcomes = {}, deliveryTitle}) {
  if (!aiCalls24h) return null;
  const RANGE_TABS = [
    {key: 'day',   label: 'день'},
    {key: 'week',  label: 'неделя'},
    {key: 'month', label: 'месяц'},
    {key: '3m',    label: '3 мес'},
  ];
  const fmtHours = h => h < 24 ? `${h}h` : h < 48 ? '1d' : h < 168 ? `${Math.round(h/24)}d` : h < 720 ? `${Math.round(h/168)}w` : `${Math.round(h/720)}m`;

  // New shape: aiDeliveryTrend = {series:[...], sent_per_ai_pct, ai_calls, sent_total, hours, bucket_hours}
  // Old fallback: 24h-only data.
  const bundle = (aiDeliveryTrend && Array.isArray(aiDeliveryTrend.series) && aiDeliveryTrend.series.length)
    ? aiDeliveryTrend
    : null;
  const trend = (bundle ? bundle.series : [
    {sent_per_ai_pct: sentConversion24h, sent_total: sentMessages24h, ai_calls: aiCalls24h, start: null, end: null},
  ]).map((p, i, arr) => ({
    label: p.end ? new Date(p.end) : null,
    bucketIdx: i,
    bucketsTotal: arr.length,
    pct: Number(p.sent_per_ai_pct || 0),
    sent: Number(p.sent_total || 0),
    calls: Number(p.ai_calls || 0),
  }));

  // Headline pct/counts follow the selected range when bucketed data is available
  const headlinePct = bundle ? bundle.sent_per_ai_pct : sentConversion24h;
  const headlineCalls = bundle ? bundle.ai_calls : aiCalls24h;
  const headlineSent = bundle ? bundle.sent_total : sentMessages24h;
  const truncated = !!(bundle && bundle.truncated);
  // Axis labels: show 4-5 tick marks, formatted relative to range
  const totalHours = bundle ? bundle.hours : 24;
  const tickCount = Math.min(5, trend.length);
  const tickStep = (trend.length - 1) / (tickCount - 1 || 1);
  const fmtTick = (bucketIdx) => {
    const elapsed = totalHours * (bucketIdx + 1) / trend.length;
    const ago = totalHours - elapsed;
    if (ago <= 0.5) return 'сейчас';
    return `−${fmtHours(Math.round(ago))}`;
  };
  const maxPct = Math.max(5, ...trend.map(p => p.pct));
  const points = trend.map((p, i) => {
    const x = trend.length === 1 ? 100 : (i / (trend.length - 1)) * 100;
    const y = 42 - Math.min(1, p.pct / maxPct) * 34;
    return `${x},${y}`;
  }).join(' ');
  const outPct = Math.min(100, Number(headlinePct || 0));
  const skip = (deliveryOutcomes.ai_skip || 0) + (deliveryOutcomes.broker_skip || 0);

  return (
    <div className="delivery-card" title={deliveryTitle}>
      <div className="delivery-top">
        <div>
          <div className="delivery-kicker">AI → сообщения</div>
          <div className="delivery-main">{Number(headlinePct || 0).toFixed(1)}%</div>
        </div>
        <div className="delivery-counts">
          <span>🤖 {headlineCalls}</span>
          <span>📩 {headlineSent}</span>
          {truncated && (
            <span title="Логи длиннее окна чтения — старые bucket'ы могут недосчитывать" style={{color:'#fbbf24'}}>⚠ trunc</span>

        </div>
      </div>
      {onAiTrendRangeChange && (
        <div className="delivery-range-tabs" role="tablist" aria-label="Период графика">
          {RANGE_TABS.map(t => (
            <button
              key={t.key}
              type="button"
              role="tab"
              aria-selected={aiTrendRange === t.key}
              className={`delivery-range-tab${aiTrendRange === t.key ? ' is-active' : ''}`}
              onClick={() => onAiTrendRangeChange(t.key)}
            >
              {t.label}
            </button>
          ))}
        </div>
      )}
      <div className="delivery-meter">
        <span style={{width: `${outPct}%`}} />
      </div>
      <svg className="delivery-spark" viewBox="0 0 100 48" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="42" x2="100" y2="42" stroke="rgba(148,163,184,0.22)" strokeWidth="1" />
        <polyline points={points} fill="none" stroke="#60a5fa" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {trend.map((p, i) => {
          const x = trend.length === 1 ? 100 : (i / (trend.length - 1)) * 100;
          const y = 42 - Math.min(1, p.pct / maxPct) * 34;
          return <circle key={`${p.hours}-${i}`} cx={x} cy={y} r="2.2" fill="#93c5fd" />;
        })}
      </svg>
      <div className="delivery-axis">
        {Array.from({length: tickCount}, (_, k) => {
          const idx = Math.round(k * tickStep);
          return <span key={k}>{fmtTick(idx)}</span>;

      {aiDelivery && (
        <div className="delivery-outcomes">
          <span>stage {deliveryOutcomes.stage_changes || 0}</span>
          <span>broker {deliveryOutcomes.broker_intake || 0}</span>
          <span>skip {skip}</span>
          <span>fail {deliveryOutcomes.codex_fail || 0}</span>
        </div>
      )}
    </div>
  );
}

/* ───────────────────────────────────────────────────────────────────
 * AiEfficiencyTile — live picture of AI burn vs actual outbound.
 * Reads /api/ai_efficiency every 60s. Shows calls/outbound + top
 * expensive purposes + escalation rate for chained classifiers.
 * ─────────────────────────────────────────────────────────────────── */

function AiEfficiencyTile({backendUrl}) {
  const [data, setData] = React.useState(null);
  const [err, setErr] = React.useState(null);

  React.useEffect(() => {
    let alive = true;
    async function load() {
      try {
        const r = await fetch(`${backendUrl}/api/ai_efficiency?hours=6`);
        const j = await r.json();
        if (alive) { setData(j); setErr(null); }
      } catch (e) {
        if (alive) setErr(String(e.message || e).slice(0, 80));
      }
    }
    load();
    const t = setInterval(load, 60000);
    return () => { alive = false; clearInterval(t); };
  }, [backendUrl]);

  if (err) return <div style={tileStyle}>ai-eff: {err}</div>;
  if (!data) return <div style={tileStyle}>ai-eff: loading…</div>;

  const cpo = data.calls_per_outbound;
  const tpo = data.tokens_per_outbound;
  const cpoColor = cpo == null ? '#888' : cpo > 80 ? '#ef4444' : cpo > 50 ? '#f59e0b' : '#34d399';
  const fmt = n => n == null ? '—' : n >= 1000 ? (n/1000).toFixed(0) + 'K' : Math.round(n);

  return (
    <div style={tileStyle} title="AI calls / actual outbound. Click for details.">
      <div style={{fontSize: 10, color: '#94a3b8', letterSpacing: 0.5, marginBottom: 4}}>
        AI EFFICIENCY · {data.window_hours}h
      </div>
      <div style={{display: 'flex', gap: 12, alignItems: 'baseline'}}>
        <div>
          <div style={{fontSize: 26, fontWeight: 700, color: cpoColor, lineHeight: 1}}>
            {cpo == null ? '—' : cpo.toFixed(0)}
          </div>
          <div style={{fontSize: 9, color: '#94a3b8'}}>calls/outbound</div>
        </div>
        <div>
          <div style={{fontSize: 16, color: '#cde'}}>{fmt(tpo)}</div>
          <div style={{fontSize: 9, color: '#94a3b8'}}>tokens/outbound</div>
        </div>
        <div>
          <div style={{fontSize: 14, color: '#cde'}}>
            {data.outbound_count} <span style={{fontSize: 10, color: '#94a3b8'}}>sent</span>
          </div>
          <div style={{fontSize: 14, color: '#cde'}}>
            {data.total_calls} <span style={{fontSize: 10, color: '#94a3b8'}}>calls</span>
          </div>
        </div>
      </div>
      <div style={{marginTop: 8, fontSize: 10, color: '#94a3b8'}}>
        Top burn (tokens):
      </div>
      <div style={{fontSize: 10, fontFamily: 'monospace', lineHeight: 1.4}}>
        {(data.top_purposes || []).slice(0, 4).map(p => {
          const escFlag = p.escalation_pct > 80 ? ' 🔴' : p.escalation_pct > 50 ? ' 🟡' : '';
          return (
            <div key={p.purpose} style={{display: 'flex', justifyContent: 'space-between', gap: 8}}>
              <span style={{color: '#cde', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 200}}>
                {p.purpose}
              </span>
              <span style={{color: '#94a3b8'}}>
                {p.calls}× {fmt(p.tokens_in)}t {p.l1 > 0 ? `esc:${p.escalation_pct}%` : ''}{escFlag}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StatusSection({ status, activity24h, sent24h, aiDelivery, aiDeliveryTrend, aiTrendRange, onAiTrendRangeChange, onProcessClick }) {
  const [bwExpanded, setBwExpanded] = React.useState(false);
  const [bwFeed, setBwFeed] = React.useState(null);
  // 🔴 23.04: универсальный expand для любого процесса (не только Browser Walk).
  // procDetail[key] = {events, kind, summary, loading, error}
  const [procExpanded, setProcExpanded] = React.useState({});
  const [procDetail,   setProcDetail]   = React.useState({});
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';

  const fetchProcDetail = React.useCallback(async (key) => {
    setProcDetail(prev => ({ ...prev, [key]: { ...(prev[key]||{}), loading: true } }));
    try {
      const r = await fetch(`${backendUrl}/api/process_detail?key=${encodeURIComponent(key)}&limit=20`, { cache: 'no-store' });
      const j = await r.json();
      setProcDetail(prev => ({ ...prev, [key]: { ...j, loading: false } }));
    } catch (e) {
      setProcDetail(prev => ({ ...prev, [key]: { error: String(e), loading: false, events: [] } }));
    }
  }, [backendUrl]);

  const toggleProc = (key) => {
    setProcExpanded(prev => {
      const next = { ...prev, [key]: !prev[key] };
      if (next[key] && !procDetail[key]) fetchProcDetail(key);
      return next;
    });
  };

  const _fmtRelTime = (ts) => {
    if (!ts) return '';
    try {
      const t = new Date(ts).getTime();
      if (!t) return ts;
      const diff = (Date.now() - t) / 1000;
      if (diff < 60) return `${Math.round(diff)}с назад`;
      if (diff < 3600) return `${Math.round(diff/60)}м назад`;
      if (diff < 86400) return `${Math.round(diff/3600)}ч назад`;
      return `${Math.round(diff/86400)}д назад`;
    } catch { return ts; }
  };

  React.useEffect(() => {
    if (!bwExpanded) return;
    let cancelled = false;
    const fetchFeed = async () => {
      try {
        const r = await fetch(`${backendUrl}/api/browser_walk_progress`, { cache: 'no-store' });
        if (!r.ok) return;
        const j = await r.json();
        if (!cancelled) setBwFeed(j);
      } catch { /* offline */ }
    };
    fetchFeed();
    const t = setInterval(fetchFeed, 3000);
    return () => { cancelled = true; clearInterval(t); };
  }, [bwExpanded, backendUrl]);

  if (!status.length) return null;
  const act = activity24h || {};
  const aiCalls24h = Number(aiDelivery?.ai_calls || act._ai_calls_24h?.count || 0);
  const sentMessages24h = Number(aiDelivery?.sent_total || sent24h?.total || 0);
  const sentConversion24h = aiCalls24h > 0
    ? Math.round((sentMessages24h / aiCalls24h) * 1000) / 10
    : 0;
  const deliveryOutcomes = aiDelivery?.outcomes || {};
  const deliveryTitle = aiDelivery
    ? [
        `Факт TG out: ${aiDelivery.sent_total || 0}`,
        `Текст: ${aiDelivery.sent_text || 0}`,
        `Медиа: ${aiDelivery.sent_media || 0}`,
        `Новые лиды ждут питча: ${deliveryOutcomes.new_leads_waiting_pitch || 0}`,
        `Изменения шага: ${deliveryOutcomes.stage_changes || 0}`,
        `Broker intake: ${deliveryOutcomes.broker_intake || 0}`,
        `Broker skip: ${deliveryOutcomes.broker_skip || 0}`,
        `AI skip: ${deliveryOutcomes.ai_skip || 0}`,
        `Codex fail: ${deliveryOutcomes.codex_fail || 0}`,
        ...(aiDelivery.sent_by_source || []).map(([src, n]) => `${src}: ${n}`),
      ].join('\n')
    : 'Конверсия = реально отправленные сообщения за 24ч / AI-вызовы за 24ч';

  // Browser Walk row — предпочитаем row из Google Sheet (sync_dashboard_data.py),
  // потому что он уже стоит в правильной позиции (после TG Monitor).
  // Если Sheet-row нет (на всякий случай) — синтезируем.
  // 🔴 21.04 фикс дубля: раньше PUSH'или ещё одну строку — получали 2 Browser Walk'а
  // (одна после TG Monitor от Sheet, вторая в самом конце от push). Убрано.
  const bw = act.proc_browser_walk;
  const hasBwInStatus = status.some(s => s.key === 'proc_browser_walk');
  let rows = [...status];
  if (bw && !hasBwInStatus) {
    const running = bw.status === 'running';
    const queued  = bw.status === 'queued';
    const val = running
      ? (bw.progress ? `running ${bw.progress.scanned}/${bw.progress.total}` : 'running')
      : queued
        ? 'queued'
        : (bw.ran_at ? (() => {
            const h = Math.floor((Date.now() - new Date(bw.ran_at).getTime()) / 3600000);
            return h < 1 ? 'ok (<1h)' : `ok (${h}h)`;
          })() : 'idle');
    // Вставляем сразу ПОСЛЕ proc_tg_monitor для правильного порядка
    const tgIdx = rows.findIndex(s => s.key === 'proc_tg_monitor');
    const newRow = {
      key: 'proc_browser_walk',
      label: '👁️ Browser Walk',
      val,
      reason: '',
      action: running && bw.progress?.current ? `сейчас: ${bw.progress.current}` : '',
    };
    if (tgIdx >= 0) {
      rows = [...rows.slice(0, tgIdx + 1), newRow, ...rows.slice(tgIdx + 1)];
    } else {
      rows.push(newRow);
    }
  }

  const processState = (s) => {
    const a = act[s.key] || {};
    const val = String(s.val || '').toLowerCase();
    const running = (s.key === 'proc_browser_walk' && a.status === 'running')
      || val.includes('running')
      || a.status === 'running';
    const failed = val.includes('не работает')
      || val.includes('error')
      || val.includes('missing')
      || val.includes('stale')
      || val.includes('fail')
      || val.includes('exit=1')
      || val.includes('exit 1');
    if (failed) return 'fail';
    if (running) return 'run';
    return 'wait';
  };

  const processRank = { fail: 0, run: 1, wait: 2 };
  rows = rows
    .map((row, idx) => ({ ...row, _origIndex: idx }))
    .sort((a, b) => {
      const ra = processRank[processState(a)] ?? 9;
      const rb = processRank[processState(b)] ?? 9;
      if (ra !== rb) return ra - rb;
      return a._origIndex - b._origIndex;
    });

  const heartbeatLabels = {
    proc_tg_monitor: 'tg chats',
    proc_tg_dm_realtime: 'tg dm',
    proc_payment_handler: 'payment',
    proc_vk_longpoll: 'vk lp',
    proc_bot_commander: 'bot',
  };
  const heartbeatBeats = Object.keys(heartbeatLabels)
    .map(key => {
      const row = rows.find(s => s.key === key);
      if (!row) return null;
      return { key, short: heartbeatLabels[key], state: processState(row) };
    })
    .filter(Boolean);

  const processHover = (s) => {
    const a = act[s.key] || {};
    const state = processState(s);
    const info = PROCESS_RULES[s.key] || {};
    const reason = [s.reason, a.error, a.reason].filter(Boolean).join(' · ');
    const val = String(s.val || '').trim();
    const nextRun = a.next_run_sec > 0 ? _fmtCountdown(a.next_run_sec) : '';
    let why = '';
    let normal = '';
    if (state === 'fail') {
      why = reason || val || 'State/log просрочен или прошлый запуск завершился ошибкой.';
      normal = 'Нет. Это надо чинить или дождаться ближайшего tick только если причина явно transient/network.';
    } else if (state === 'run') {
      why = s.key === 'proc_browser_walk' && a.progress
        ? `Сейчас выполняется: ${a.progress.scanned || 0}/${a.progress.total || 0}${a.progress.current ? ` · ${a.progress.current}` : ''}.`
        : 'Процесс активен прямо сейчас.';
      normal = 'Да, это нормальный running-state. Если рядом виден -15 у launchd, для running daemon это обычно прошлый SIGTERM после рестарта, не текущая ошибка.';
    } else {
      why = nextRun
        ? `Ждёт следующий запуск launchd примерно через ${nextRun}.`
        : 'Ждёт входящее событие, расписание или следующий idle-tick.';
      normal = val.startsWith('ok')
        ? 'Да. Для scheduled/KeepAlive процессов waiting/ok между запусками нормален.'
        : 'Проверь, если ожидание длится дольше SLA или рядом есть stale/error.';
    }
    return {
      state,
      why,
      normal,
      impact: info.desc || 'Описание процесса не задано в PROCESS_RULES.',
      interval: info.interval || '',
    };
  };

  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title" style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
        <RestartAllButton />
        <div className="hb-stack">
          <AiEfficiencyTile backendUrl={backendUrl} />
          <AgentMatrixStatus />
          <HeartbeatFlowViz beats={heartbeatBeats} />
        </div>
        <DeliveryEfficiencyCard
          aiCalls24h={aiCalls24h}
          sentMessages24h={sentMessages24h}
          sentConversion24h={sentConversion24h}
          aiDelivery={aiDelivery}
          aiDeliveryTrend={aiDeliveryTrend}
          aiTrendRange={aiTrendRange}
          onAiTrendRangeChange={onAiTrendRangeChange}
          deliveryOutcomes={deliveryOutcomes}
          deliveryTitle={deliveryTitle}
        />
      </div>
      {false && <div className="status-list">
        {rows.map(s => {
          const hasRules = !!PROCESS_RULES[s.key];
          const a = act[s.key];
          const hover = processHover(s);
          const is_bw = s.key === 'proc_browser_walk';
          const count_label = a && typeof a.count === 'number' && a.unit
            ? `${a.count} ${a.unit}${a.extra ? ' · ' + a.extra : ''}`
            : null;
          // Для browser_walk при running state — override статуса (точки + текста),
          // иначе showing stale от прошлого walk_result.json пока текущий walk ещё идёт.
          const bwRunning = is_bw && a?.status === 'running';
          const effectiveVal = bwRunning ? 'running' : s.val;
          const effectiveDot = bwRunning ? 'warn' : dotClass(s.val);
          return (
            <div key={s.key} className="status-row order-card-hoverable process-tip-row"
              style={{flexWrap:'wrap', cursor: hasRules ? 'pointer' : 'default'}}
              onClick={() => hasRules && !is_bw && onProcessClick(s.key)}>
              <span className={`dot ${effectiveDot}`}
                    style={bwRunning ? {animation:'pulse 1.5s ease-in-out infinite'} : undefined} />
              <span className="status-name">{s.label}</span>
              <span className="status-age" style={bwRunning ? {color:'var(--blue)', fontWeight:700} : undefined}>
                {bwRunning ? `⟳ running ${a?.progress?.scanned ?? 0}/${a?.progress?.total ?? 17}` : s.val}
              </span>
              {/* 🔴 24.04: для morning_reconcile / gap_detector — 3-4 цифры в строчку справа */}
              {(s.key === 'proc_morning_reconcile' || s.key === 'proc_gap_detector') && a?.posts_total != null && (
                <span style={{
                  marginLeft: 'auto',
                  fontSize: 11,
                  color: 'var(--muted)',
                  fontVariantNumeric: 'tabular-nums',
                  display: 'flex',
                  gap: 12,
                  paddingRight: 8,
                }}>
                  <span title="Browser Walk hits"><span style={{color: a.walk_total > 0 ? 'var(--ok)' : '#fb923c'}}>walk:</span> {a.walk_total ?? 0}</span>
                  <span title="TG Monitor hits"><span style={{color:'var(--blue)'}}>monitor:</span> {a.monitor_total ?? 0}</span>
                  <span title="Всего постов в окне"><span style={{color:'var(--gold)'}}>постов:</span> {a.posts_total}</span>
                  {s.key === 'proc_gap_detector' && a?.blind_total != null && (
                    <span title="Слепые посты (не видели ни walk ни monitor)">
                      <span style={{color: a.blind_total > 0 ? '#fb923c' : 'var(--muted)'}}>слепых:</span> {a.blind_total}
                    </span>
                  )}
                </span>
              )}
              {hasRules && !is_bw && <span style={{color:'var(--muted)',fontSize:14,marginLeft:2}}>›</span>}
              {is_bw && (
                <button
                  onClick={(e) => { e.stopPropagation(); setBwExpanded(v => !v); }}
                  style={{
                    marginLeft: 6, fontSize: 11, padding: '2px 8px',
                    background: bwExpanded ? 'rgba(59,130,246,0.18)' : 'rgba(59,130,246,0.08)',
                    border: '1px solid rgba(59,130,246,0.45)',
                    borderRadius: 4, color: 'var(--blue)', fontWeight: 600,
                    cursor: 'pointer',
                  }}>
                  {bwExpanded ? '▲ скрыть' : '▼ подробно'}
                </button>
              )}
              {/* 🔴 23.04: универсальный «подробно» для мониторов и ответчиков */}
              {!is_bw && ['proc_tg_monitor','proc_vk_monitor','proc_tg_responder','proc_vk_responder','proc_gap_detector'].includes(s.key) && (
                <button
                  onClick={(e) => { e.stopPropagation(); toggleProc(s.key); }}
                  style={{
                    marginLeft: 6, fontSize: 11, padding: '2px 8px',
                    background: procExpanded[s.key] ? 'rgba(59,130,246,0.18)' : 'rgba(59,130,246,0.08)',
                    border: '1px solid rgba(59,130,246,0.45)',
                    borderRadius: 4, color: 'var(--blue)', fontWeight: 600,
                    cursor: 'pointer',
                  }}>
                  {procExpanded[s.key] ? '▲ скрыть' : '▼ подробно'}
                </button>
              )}
              {count_label && (
                <div style={{
                  width:'100%', paddingLeft:20, marginTop:2, fontSize:11,
                  color: is_bw ? '#fbbf24' : (a.count > 0 ? 'var(--ok)' : 'var(--muted)'),
                  fontVariantNumeric:'tabular-nums',
                }}>
                  {is_bw ? '👁️ за 24ч: ' : '📊 за 24ч: '}{count_label}
                </div>
              )}
              {(a?.next_run_sec > 0 || typeof a?.success === 'number') && (
                <div style={{
                  width:'100%', paddingLeft:20, marginTop:2, fontSize:10.5,
                  color:'var(--muted)', fontVariantNumeric:'tabular-nums',
                  display:'flex', gap:10, flexWrap:'wrap',
                }}>
                  {a?.next_run_sec > 0 && (
                    <span>⏱ до след: {_fmtCountdown(a.next_run_sec)}</span>
                  )}
                  {typeof a?.success === 'number' && (
                    <span style={{color: a.failures > 0 ? '#fb923c' : 'var(--ok)'}}>
                      ✓ {a.success} успех{a.failures > 0 ? ` · ✗ ${a.failures} пропущ` : ''}
                    </span>
                  )}
                </div>
              )}
              {is_bw && a?.status === 'running' && (
                <div style={{width:'100%', paddingLeft:20, marginTop:6}}>
                  {(() => {
                    const sc = a?.progress?.scanned ?? 0;
                    const tot = a?.progress?.total ?? 17;
                    const pct = tot > 0 ? Math.min(100, Math.round((sc / tot) * 100)) : 0;
                    const curr = a?.progress?.current || '';
                    return (
                      <>
                        <div style={{fontSize:11, color:'var(--blue)', fontWeight:700,
                                     fontVariantNumeric:'tabular-nums', marginBottom:3}}>
                          ⟳ Walk идёт · {sc}/{tot} · {pct}%
                        </div>
                        <div style={{
                          height:7, background:'rgba(59,130,246,0.18)',
                          borderRadius:4, overflow:'hidden',
                          border:'1px solid rgba(59,130,246,0.4)',
                        }}>
                          <div style={{
                            width: pct + '%', height:'100%',
                            background:'linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%)',
                            transition:'width .4s ease',
                            boxShadow: pct > 0 ? '0 0 8px rgba(59,130,246,0.5)' : 'none',
                          }}></div>
                        </div>
                        {curr && (
                          <div style={{fontSize:10.5, color:'var(--blue)', marginTop:3,
                                       fontWeight:600, overflow:'hidden',
                                       textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                            ▸ {curr}
                          </div>
                        )}
                      </>
                    );
                  })()}
                </div>
              )}
              {s.reason && (
                <div style={{width:'100%',paddingLeft:20,marginTop:2,fontSize:11,color:'#f87171'}}>{s.reason}</div>
              )}
              {s.action && (
                <div style={{width:'100%',paddingLeft:20,marginTop:1,fontSize:11,color:'var(--blue)'}}>{s.action}</div>
              )}
              <div className="order-tip">
                <div className="order-tip-label">
                  {hover.state === 'fail' ? 'Fail' : hover.state === 'run' ? 'Run' : 'Wait / ok'}
                </div>
                <div className="order-tip-body">
                  <b>Почему сейчас так:</b> {hover.why}
                  {'\n\n'}<b>На что влияет:</b> {hover.impact}
                  {hover.interval && <>{'\n'}<b>Нормальный ритм:</b> {hover.interval}</>}
                  {'\n\n'}<b>Нормально ли это:</b> {hover.normal}
                </div>
              </div>
              {/* 🔴 22.04: Morning Reconcile — inline top-5 пропущенных */}
              {s.key === 'proc_morning_reconcile' && Array.isArray(a?.missed_orders) && a.missed_orders.length > 0 && (
                <div style={{width:'100%',paddingLeft:20,marginTop:6,fontSize:11}}>
                  <div style={{color:'#fb923c',fontWeight:700,marginBottom:4}}>
                    ⚠️ Пропущенные лиды (top {Math.min(5, a.missed_orders.length)} из {a.missed_orders.length}):
                  </div>
                  {a.missed_orders.slice(0, 5).map((m, i) => (
                    <div key={i} style={{marginBottom:4,color:'var(--muted)'}}>
                      <span style={{color:'#fbbf24'}}>• {m.chat}</span>
                      {m.username && <span style={{color:'var(--fg)'}}> · @{m.username}</span>}
                      {m.msg_date_msk && <span style={{color:'var(--muted)',fontSize:10.5}}> · {m.msg_date_msk}</span>}
                      {m.ai_class && <span style={{color:'#60a5fa',fontSize:10.5}}> · {m.ai_class}</span>}
                      {m.text_snippet && (
                        <div style={{paddingLeft:12,fontSize:10.5,color:'var(--muted)',marginTop:2,
                                     overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          {m.text_snippet.slice(0, 120)}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}

              {/* 🔴 23.04: expand-блок для универсальных процессов (не browser walk) */}
              {!is_bw && procExpanded[s.key] && (
                <div style={{
                      width:'100%', marginTop:8, padding:'10px 12px',
                      background:'#0f172a', border:'1px solid #334155',
                      borderRadius:6, maxHeight:360, overflowY:'auto',
                      textAlign:'left', fontSize:11.5, lineHeight:1.45,
                    }}
                    onClick={(e) => e.stopPropagation()}>
                  {(() => {
                    const d = procDetail[s.key];
                    if (!d || d.loading) return <div style={{color:'#64748b'}}>Загружаю…</div>;
                    if (d.error) return <div style={{color:'#f87171'}}>Ошибка: {d.error}</div>;
                    const evs = d.events || [];
                    if (evs.length === 0) return <div style={{color:'#64748b'}}>Нет записей.</div>;
                    const kind = d.kind || '';
                    return (
                      <>
                        <div style={{fontSize:10, color:'#64748b', textTransform:'uppercase',
                                     letterSpacing:0.5, marginBottom:6, fontWeight:600}}>
                          {d.summary || `${evs.length} событий`}
                        </div>
                        {kind === 'monitor_cycles' && evs.map((e, i) => (
                          <div key={i} style={{
                                padding:'4px 0',
                                borderBottom: i < evs.length-1 ? '1px solid rgba(148,163,184,0.08)' : 'none',
                              }}>
                            <div style={{display:'grid', gridTemplateColumns:'auto 1fr auto', gap:8}}>
                              <span style={{color:'#94a3b8', fontVariantNumeric:'tabular-nums'}}>
                                {_fmtRelTime(e.ts)}
                              </span>
                              <span style={{color:'#cbd5e1'}}>
                                {e.chats_checked || 0} чат · <b style={{color:'#e2e8f0'}}>{e.messages_read || 0}</b> постов · <b style={{color: e.orders > 0 ? '#34d399' : '#64748b'}}>{e.orders || 0}</b> лид{e.refusals ? ` · ${e.refusals}❌` : ''}
                                {e.note ? <span style={{color:'#fb923c'}}> · {e.note}</span> : null}
                              </span>
                              <span style={{color:'#64748b', fontVariantNumeric:'tabular-nums'}}>
                                {e.duration_sec ? `${e.duration_sec}s` : ''}
                              </span>
                            </div>
                            {e.leads && e.leads.length > 0 && (
                              <div style={{marginTop:4, marginLeft:8, paddingLeft:8,
                                           borderLeft:'2px solid rgba(52,211,153,0.35)'}}>
                                {e.leads.map((ld, li) => {
                                  const tgUrl = ld.username ? `https://t.me/${ld.username}` : (ld.contact || '');
                                  return (
                                    <div key={li} style={{display:'flex', gap:6, alignItems:'center',
                                                          flexWrap:'wrap', padding:'2px 0', fontSize:11}}>
                                      {tgUrl ? (
                                        <a href={tgUrl} target="_blank" rel="noopener noreferrer"
                                           style={{color:'#93c5fd', textDecoration:'none', fontWeight:600}}>
                                          {ld.username ? `@${ld.username}` : (ld.client || '—')}
                                        </a>
                                      ) : (
                                        <span style={{color:'#e2e8f0', fontWeight:600}}>{ld.client || '—'}</span>
                                      )}
                                      {ld.source_chat && <span style={{color:'#64748b'}}>· {ld.source_chat}</span>}
                                      {ld.event_date && <span style={{color:'#94a3b8'}}>· 📅 {ld.event_date}</span>}
                                      {ld.location && <span style={{color:'#94a3b8'}}>· 📍 {ld.location}</span>}
                                      {ld.budget && <span style={{color:'#fbbf24'}}>· 💰 {ld.budget}</span>}
                                      {ld.status && (
                                        <span style={{
                                          fontSize:9.5, padding:'1px 5px', borderRadius:3,
                                          background:'rgba(96,165,250,0.12)', color:'#93c5fd',
                                        }}>{ld.status}</span>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        ))}
                        {kind === 'responder_log' && evs.map((e, i) => (
                          <div key={i} style={{
                                padding:'5px 0',
                                borderBottom: i < evs.length-1 ? '1px solid rgba(148,163,184,0.08)' : 'none',
                              }}>
                            <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
                              <span style={{color:'#94a3b8', fontVariantNumeric:'tabular-nums', fontSize:10.5}}>
                                {_fmtRelTime(e.timestamp)}
                              </span>
                              <span style={{color:'#e2e8f0', fontWeight:600}}>@{e.username || '—'}</span>
                              {e.category && (
                                <span style={{
                                  fontSize:9.5, padding:'1px 6px', borderRadius:3,
                                  background:'rgba(96,165,250,0.15)', color:'#93c5fd',
                                }}>{e.category}</span>
                              )}
                              {e.action && (
                                <span style={{
                                  fontSize:9.5, color: e.auto_sent ? '#34d399' : '#fbbf24',
                                }}>{e.action}</span>
                              )}
                            </div>
                            {e.incoming && (
                              <div style={{color:'#94a3b8', fontSize:10.5, marginTop:2,
                                           paddingLeft:8, borderLeft:'2px solid #334155'}}>
                                «{e.incoming.slice(0,120)}{e.incoming.length > 120 ? '…' : ''}»
                              </div>
                            )}
                          </div>
                        ))}
                        {kind === 'responder_log_vk' && evs.map((e, i) => (
                          <div key={i} style={{
                                display:'grid', gridTemplateColumns:'auto 1fr', gap:8,
                                padding:'4px 0',
                                borderBottom: i < evs.length-1 ? '1px solid rgba(148,163,184,0.08)' : 'none',
                              }}>
                            <span style={{color:'#94a3b8', fontVariantNumeric:'tabular-nums', fontSize:10.5}}>
                              {e.ts ? e.ts.slice(11,16) : ''}
                            </span>
                            <span style={{color:'#cbd5e1', fontSize:11}}>
                              {e.text}
                            </span>
                          </div>
                        ))}
                        {/* 🔴 25.04: Gap Detector detail */}
                        {kind === 'gap_detector' && (
                          <>
                            {d.window && (

                    onClick={(e) => e.stopPropagation()}>

                                     : ld.status === 'blocked_chat'    ? {c:'#a78bfa', t:'🔒 DM only'}

                        const tgLink = uname ? `https://t.me/${uname.replace(/^@/,'')}`
                                     : (ld.contact && ld.contact.includes('t.me/')) ? ld.contact
                                     : '';

                          <div key={i} style={{
                                display:'flex', flexDirection:'column', gap:3,
                                padding:'7px 10px', marginBottom:6,

                                fontWeight:700, whiteSpace:'nowrap',

                                {ld.author || uname || '—'}
