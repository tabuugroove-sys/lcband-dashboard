// ─── CartotekaSection ───────────────────────────────────────────────────────
const INTENT_COLOR = { active:'#22c55e', interested:'#3b82f6', silent:'#f59e0b', refused:'#ef4444', cold:'#94a3b8' };
const INTENT_LABEL = { active:'активный', interested:'интересуется', silent:'молчит', refused:'отказ', cold:'холодный' };
const CH_BADGE     = { tg:{bg:'#2b6cb0',label:'TG'}, wa:{bg:'#16a34a',label:'WA'}, vk:{bg:'#7c3aed',label:'VK'} };
const THREAD_STATUS_COLOR = { confirmed:'#22c55e', pending:'#f59e0b', no_contact:'#555', issue:'#ef4444', not_related:'#555' };
const THREAD_STATUS_LABEL = { confirmed:'подтверждён', pending:'ожидаем', no_contact:'нет контакта', issue:'проблема', not_related:'не связано' };
const TECH_CAT = {
  our_tech:  { label:'Наш / мы платим', icon:'🔧', color:'#22c55e', bg:'rgba(34,197,94,0.10)' },
  org_tech:  { label:'Тех орга / орг платит', icon:'🤝', color:'#f59e0b', bg:'rgba(245,158,11,0.10)' },
  venue_tech:{ label:'Тех площадки', icon:'🏛', color:'#60a5fa', bg:'rgba(96,165,250,0.10)' },
};

function EventThreads({ threads }) {
  const [open, setOpen] = React.useState(false);
  if (!threads || threads.length === 0) return null;

  const musicians = threads.filter(t => t.role === 'musician');
  const techs     = threads.filter(t => t.role === 'tech');

  const issueCount = threads.filter(t => t.thread_status === 'issue').length;
  const pendingCount = threads.filter(t => t.thread_status === 'pending').length;

  return (
    <div style={{ marginTop: 8, borderTop: '1px solid rgba(255,255,255,0.07)', paddingTop: 8 }}>
      <div
        onClick={() => setOpen(v => !v)}
        style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#9ca3af', userSelect: 'none' }}
      >
        <span>{open ? '▾' : '▸'} Команда мероприятия ({threads.length})</span>
        {issueCount > 0 && <span style={{ color: '#ef4444', fontWeight: 700 }}>⚠ {issueCount} проблем</span>}
        {pendingCount > 0 && <span style={{ color: '#f59e0b' }}>⏳ {pendingCount} ожидают</span>}
      </div>
      {open && (
        <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 6 }}>
          {/* Musicians */}
          {musicians.length > 0 && (
            <div>
              <div style={{ fontSize: 11, color: '#6b7280', marginBottom: 4 }}>🎤 Музыканты</div>
              {musicians.map(t => {
                const sc = THREAD_STATUS_COLOR[t.thread_status] || '#888';
                const sl = THREAD_STATUS_LABEL[t.thread_status] || t.thread_status;
                return (
                  <div key={t.username} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, padding: '5px 8px', background: 'rgba(255,255,255,0.03)', borderRadius: 7, marginBottom: 3 }}>
                    <span style={{ minWidth: 8, height: 8, borderRadius: '50%', background: sc, marginTop: 4, flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                        <span style={{ fontSize: 12, fontWeight: 600 }}>{t.name}</span>
                        <span style={{ fontSize: 10, color: '#6b7280' }}>@{t.username}</span>
                        <span style={{ fontSize: 10, color: sc }}>{sl}</span>
                      </div>
                      {t.thread_summary && (
                        <div style={{ fontSize: 11, color: '#9ca3af', marginTop: 2 }}>{t.thread_summary}</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {/* Tech crew */}
          {techs.length > 0 && (
            <div>
              <div style={{ fontSize: 11, color: '#6b7280', marginBottom: 4 }}>🎛 Техники</div>
              {techs.map(t => {
                const cat = TECH_CAT[t.tech_category] || { label: t.tech_category || 'неизвестно', icon: '?', color: '#888', bg: 'rgba(255,255,255,0.04)' };
                const sc  = THREAD_STATUS_COLOR[t.thread_status] || '#888';
                const sl  = THREAD_STATUS_LABEL[t.thread_status] || t.thread_status;
                return (
                  <div key={t.username} style={{ padding: '6px 8px', background: cat.bg, border: `1px solid ${cat.color}22`, borderRadius: 7, marginBottom: 3 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 12 }}>{cat.icon}</span>
                      <span style={{ fontSize: 12, fontWeight: 600 }}>{t.name}</span>
                      <span style={{ fontSize: 10, color: '#6b7280' }}>@{t.username}</span>
                      <span style={{ fontSize: 10, color: cat.color, fontWeight: 600 }}>{cat.label}</span>
                      {t.venue && <span style={{ fontSize: 10, color: '#6b7280' }}>· {t.venue}</span>}
                      {t.tech_specialty && <span style={{ fontSize: 10, color: '#6b7280' }}>· {t.tech_specialty}</span>}
                      <span style={{ fontSize: 10, color: sc, marginLeft: 'auto' }}>{sl}</span>
                    </div>
                    {t.thread_summary && (
                      <div style={{ fontSize: 11, color: '#9ca3af', marginTop: 3 }}>{t.thread_summary}</div>
                    )}
                    {t.tech_category === 'venue_tech' && (
                      <div style={{ fontSize: 10, color: '#60a5fa', marginTop: 2 }}>
                        ℹ Наш техник везёт беклайн, площадка — свои колонки
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function KartotekaCard({ card }) {
  const ch      = CH_BADGE[card.channel] || { bg: '#555', label: (card.channel || 'TG').toUpperCase() };
  const intentC = INTENT_COLOR[card.client_intent] || '#888';
  const hasEvent = !!card.event_date_confirmed;
  const hasThreads = hasEvent && card.event_threads && card.event_threads.length > 0;
  const threadIssues = hasThreads ? card.event_threads.filter(t => t.thread_status === 'issue').length : 0;

  return (
    <div style={{
      background: card.waiting_for_us ? 'rgba(239,68,68,0.07)' : hasEvent ? 'rgba(34,197,94,0.04)' : 'rgba(255,255,255,0.04)',
      border: card.waiting_for_us ? '1px solid rgba(239,68,68,0.35)' : hasEvent ? '1px solid rgba(34,197,94,0.2)' : '1px solid rgba(255,255,255,0.09)',
      borderRadius: 10, padding: '9px 12px', display: 'flex', flexDirection: 'column', gap: 4,
    }}>
      {/* Row 1: channel + username + intent + flags + silence */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
        <span style={{ background: ch.bg, color: '#fff', borderRadius: 5, padding: '1px 6px', fontSize: 10, fontWeight: 700, letterSpacing: 0.5 }}>
          {ch.label}
        </span>
        <span style={{ fontWeight: 600, fontSize: 13 }}>@{card.username}</span>
        <span style={{ background: intentC + '22', color: intentC, border: `1px solid ${intentC}44`, borderRadius: 6, padding: '1px 7px', fontSize: 11 }}>
          {INTENT_LABEL[card.client_intent] || card.client_intent}
        </span>
        {card.waiting_for_us  && <span style={{ color: '#ef4444', fontSize: 11, fontWeight: 700 }}>⚡ ждёт ответа</span>}
        {card.waiting_for_client && <span style={{ color: '#f59e0b', fontSize: 11 }}>⏳ ждём клиента</span>}
        {threadIssues > 0 && <span style={{ color: '#ef4444', fontSize: 11 }}>⚠ {threadIssues} проблем в команде</span>}
        <span style={{ marginLeft: 'auto', color: '#888', fontSize: 11 }}>
          {card.silence_days < 1 ? `${Math.round(card.silence_days * 24)}ч` : `${card.silence_days.toFixed(1)}д`} молчания
        </span>
      </div>

      {/* next_action_hint */}
      {card.next_action_hint && (
        <div style={{ fontSize: 12, color: '#d1d5db' }}>→ {card.next_action_hint}</div>
      )}

      {/* Pills: date, budget, key_asks, refusal */}
      <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginTop: 1 }}>
        {card.event_date_confirmed && (
          <span style={{ background: 'rgba(34,197,94,0.12)', color: '#22c55e', border: '1px solid rgba(34,197,94,0.25)', borderRadius: 6, padding: '1px 7px', fontSize: 11 }}>
            📅 {card.event_date_confirmed}
          </span>
        )}
        {card.budget_confirmed && (
          <span style={{ background: 'rgba(59,130,246,0.12)', color: '#60a5fa', border: '1px solid rgba(59,130,246,0.25)', borderRadius: 6, padding: '1px 7px', fontSize: 11 }}>
            💰 {card.budget_confirmed}
          </span>
        )}
        {(card.key_asks || []).slice(0, 3).map((ask, i) => (
          <span key={i} style={{ background: 'rgba(255,255,255,0.06)', color: '#9ca3af', borderRadius: 6, padding: '1px 7px', fontSize: 11 }}>
            {ask}
          </span>
        ))}
        {card.refusal_detected && card.refusal_signal && (
          <span style={{ background: 'rgba(239,68,68,0.1)', color: '#ef4444', border: '1px solid rgba(239,68,68,0.2)', borderRadius: 6, padding: '1px 7px', fontSize: 11 }}>
            ✗ {card.refusal_signal.slice(0, 40)}
          </span>
        )}
      </div>

      {/* Event threads (musicians + tech) — for confirmed events */}
      <EventThreads threads={card.event_threads} />
    </div>
  );
}

function CartotekaSection({ data }) {
  const [showAll, setShowAll] = React.useState(false);

  if (!data) return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title">🗂 Картотека лидов</div>
      <div style={{ color: '#888', fontSize: 13, padding: '8px 0' }}>загрузка...</div>
    </div>
  );

  const { cards = [], by_intent = {}, needs_action = 0, total_in_store = 0 } = data;
  const visible = showAll ? cards : cards.slice(0, 8);

  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title" style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <span>🗂 Картотека лидов</span>
        {needs_action > 0 && (
          <span style={{ background: '#ef4444', color: '#fff', borderRadius: 10, padding: '1px 8px', fontSize: 11, fontWeight: 700 }}>
            {needs_action} ждут ответа
          </span>
        )}
        <span style={{ marginLeft: 'auto', fontSize: 11, color: '#888', fontWeight: 400 }}>
          {total_in_store} карточек в базе
        </span>
      </div>

      {/* Intent summary bar */}
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', margin: '8px 0 12px' }}>
        {[['active','🟢'],['interested','🔵'],['silent','🟡'],['refused','🔴'],['cold','⚪']].map(([k, ico]) => (
          <span key={k} style={{
            display: 'inline-flex', alignItems: 'center', gap: 4,
            background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)',
            borderRadius: 8, padding: '3px 10px', fontSize: 12,
          }}>
            {ico} <strong style={{ color: INTENT_COLOR[k] }}>{by_intent[k] || 0}</strong>
            <span style={{ color: '#aaa' }}>{INTENT_LABEL[k]}</span>
          </span>
        ))}
      </div>

      {/* Legend for tech categories */}
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10 }}>
        {Object.entries(TECH_CAT).map(([k, v]) => (
          <span key={k} style={{ fontSize: 10, color: v.color, display: 'flex', alignItems: 'center', gap: 3 }}>
            {v.icon} {v.label}
          </span>
        ))}
      </div>

      {visible.length === 0 && (
        <div style={{ color: '#888', fontSize: 13 }}>Карточек нет (store пустой или все старше 7 дней)</div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
        {visible.map(card => <KartotekaCard key={card.key} card={card} />)}
      </div>

      {cards.length > 8 && (
        <div
          onClick={() => setShowAll(v => !v)}
          style={{ cursor: 'pointer', color: '#60a5fa', fontSize: 12, marginTop: 8, textAlign: 'center' }}
        >
          {showAll ? 'Свернуть' : `Показать все ${cards.length} карточек`}
        </div>
      )}

      <div style={{ fontSize: 10, color: '#555', marginTop: 6, textAlign: 'right' }}>
        обновляется при каждом входящем сообщении · {data.generated_at?.slice(11, 16) || ''}
      </div>
    </div>
  );
}

function App() {
  const [rows,      setRows]      = useState(null);
  const [dbSnapshot, setDbSnapshot] = useState(null);
  const [sessionLog, setSessionLog] = useState(null);
  const [activity24h, setActivity24h] = useState(null);
  const [aiDelivery, setAiDelivery] = useState(null);
  const [aiDeliveryTrend, setAiDeliveryTrend] = useState(null);
  const [aiTrendRange, setAiTrendRange] = useState(() => localStorage.getItem('lcb_ai_trend_range') || 'day');
  const [overviewStats, setOverviewStats] = useState(null);
  const [recentSent, setRecentSent] = useState(null);
  const [recentSent24h, setRecentSent24h] = useState(null);
  const [todos,     setTodos]     = useState(null);
  const [leadContext, setLeadContext] = useState(null);
  const [loading,   setLoading]   = useState(true);
  const [refreshing,setRefreshing]= useState(false);
  const [error,     setError]     = useState(null);
  const [updatedAt, setUpdatedAt] = useState(null);
  const [offline,   setOffline]   = useState(!navigator.onLine);
  const [showTGModal, setShowTGModal] = useState(false);
  const [showProcess, setShowProcess] = useState(null);
  const [chatTarget, setChatTarget] = useState(null);
  const [aiTags, setAiTags] = useState({});
  const [aiLoading, setAiLoading] = useState(false);
  const [activeTab, setActiveTab] = useState(() => {
    try { return localStorage.getItem('lcb_tab') || 'overview'; } catch { return 'overview'; }
  });
  useEffect(() => {
    try { localStorage.setItem('lcb_tab', activeTab); } catch {}
  }, [activeTab]);

  // На десктопе при открытом чате сдвигаем .app так, чтобы правая граница
  // упиралась в левый край слайд-панели (440px)
  useEffect(() => {
    document.body.classList.toggle('chat-open', !!chatTarget);
    return () => document.body.classList.remove('chat-open');
  }, [chatTarget]);

  useEffect(() => {
    const on  = () => setOffline(false);
    const off = () => setOffline(true);
    window.addEventListener('online',  on);
    window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);

  const load = useCallback(async (isRefresh = false) => {
    if (isRefresh) setRefreshing(true);
    try { await BACKEND_READY; } catch {}
    // 🔴 21.04: primary path — /api/dashboard_data endpoint (live, no 10-min Sheet sync lag).
    // Fallback: Google Sheet gviz (если backend упал).
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      let data = null;
      try {
        const r = await fetch(`${bu}/api/dashboard_data`, { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (Array.isArray(j.rows)) {
            data = j.rows;
          }
        }
      } catch (e) {
        console.warn('[load] /api/dashboard_data failed, trying Sheet fallback:', e?.message);
      }
      // Fallback to direct Sheet read if API didn't work
      if (!data) {
        data = await fetchSheet('Dashboard');
      }
      setRows(data);
      setError(null);
      setUpdatedAt(new Date());
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
    // ── DB snapshot (fast, bot-written rows visible immediately) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/db/snapshot`, { cache: 'no-store' });
      if (r.ok) {
        const snap = await r.json();
        setDbSnapshot(snap);
      }
    } catch { /* backend offline → fall back to gviz data only */ }

    // ── Session actions (what Claude did in the current work session) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/session_actions?limit=100`, { cache: 'no-store' });
      if (r.ok) {
        setSessionLog(await r.json());
      }
    } catch { /* backend offline → session tab will show "not available" */ }

    // ── Recent real outbound messages for the main overview block ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/recent_sent_messages?hours=48&limit=30`, { cache: 'no-store' });
      if (r.ok) {
        setRecentSent(await r.json());
      }
    } catch { /* backend offline → block shows empty state */ }

    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/recent_sent_messages?hours=24&limit=1`, { cache: 'no-store' });
      if (r.ok) {
        setRecentSent24h(await r.json());
      }
    } catch { /* backend offline → sent/AI conversion stays zero */ }

    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/ai_delivery_breakdown?hours=24`, { cache: 'no-store' });
      if (r.ok) {
        setAiDelivery(await r.json());
      }
    } catch { /* backend offline → fallback to recentSent24h */ }

    // ai delivery trend fetched in dedicated useEffect (depends on aiTrendRange)

    // ── Process activity over last 24h (counts per process + Browser Walk) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/process_activity_24h`, { cache: 'no-store' });
      if (r.ok) {
        setActivity24h(await r.json());
      }
    } catch { /* backend offline → status rows render without 24h counts */ }


    // ── TODOs (live read of todo_*.md from auto-memory) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/todos`, { cache: 'no-store' });
      if (r.ok) {
        setTodos(await r.json());
      }
    } catch { /* backend offline → TODO tab shows "loading…" */ }

    // ── Overview stats (scan + pitches + follow-ups) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/overview_stats`, { cache: 'no-store' });
      if (r.ok) setOverviewStats(await r.json());
    } catch {}

    // ── Картотека лидов (lead_context_store) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/lead_context?limit=100`, { cache: 'no-store' });
      if (r.ok) setLeadContext(await r.json());
    } catch { /* backend offline → section shows empty state */ }
  }, []);

  useEffect(() => {
    load();
    const t = setInterval(() => load(true), REFRESH_MS);
    return () => clearInterval(t);
  }, [load]);

  const data = useMemo(() => {
    if (!rows) return null;
    const d = processRows(rows);
    // ── Override orders + refused with fresh DB snapshot when available.
    // DB is populated by bots directly (instant) and by sheets_to_db_sync (60s).
    // If backend is down, d.* stays as gviz-derived values.
    if (dbSnapshot && dbSnapshot.active) {
      d.orders = dbSnapshot.active.slice(0, 30).map(o => ({
        status:       o.status,
        date_posted:  o.posted,
        date_event:   o.event_date,
        client:       o.client,
        username:     o.username,
        contact:      o.contact,
        desc:         o.desc,
        location:     o.location,
        source_chat:  o.source_chat,
        history:      o.history,
        channel:      o.channel,
        last_activity: o.last_activity,
      }));
      // Full list of active leads — for funnel stage drill-down (amoCRM-style click)
      d.allLeads = dbSnapshot.active;
      d.allArchived = dbSnapshot.archived || [];
      d.pendingDrafts = dbSnapshot.pending_drafts || [];
      d.dbSync = dbSnapshot.sync;
    }
    if (dbSnapshot && dbSnapshot.archived) {
      const total = dbSnapshot.stats?.archived || dbSnapshot.archived.length;
      d.refused = {
        total,
        recent: dbSnapshot.archived.slice(0, 10).map(o => ({
          status:  o.status,
          date:    o.last_activity || o.posted,
          name:    o.client,
          username: o.contact,
          reason:  (o.history || '').slice(-200),
        })),
      };
    }
    return d;
  }, [rows, dbSnapshot]);

  // После загрузки attention — классифицируем лиды через /api/classify_leads.
  // Кэшируем в aiTags, чтобы не гонять Claude каждый раз.
  useEffect(() => {
    const items = data?.attention?.items || [];
    const usernames = [...new Set(items
      .filter(it => it.channel === 'TG' && it.username)
      .map(it => String(it.username).toLowerCase()))];
    const missing = usernames.filter(u => !(u in aiTags));
    if (!missing.length) return;
    setAiLoading(true);
    // Читаем из кэша (attention_classify_cache.py пишет каждые 15 мин).
    // Cloudflare-tunnel-safe — endpoint отвечает <100мс, не завязан на Sonnet.
    const q = missing.map(encodeURIComponent).join(',');
    fetch(`${CHAT_BACKEND}/api/classifications?usernames=${q}`)
      .then(r => r.json())
      .then(j => {
        if (!j || typeof j !== 'object' || j.error) return;
        const normalized = {};
        for (const [k, v] of Object.entries(j)) normalized[k.toLowerCase()] = v;
        setAiTags(prev => ({ ...prev, ...normalized }));
      })
      .catch(() => {})
      .finally(() => setAiLoading(false));
  }, [data?.attention?.items?.length]);


  // 16.05.2026: scan-fast-poll removed (TG-scan widget удалён)

  useEffect(() => {
    if (activity24h?.proc_browser_walk?.status !== 'running') return;
    const fast = setInterval(() => load(true), 10000);
    return () => clearInterval(fast);
  }, [activity24h?.proc_browser_walk?.status, load]);

  // ── AI → сообщения trend, real time-bucketed series per range ──
  useEffect(() => {
    const RANGE_CFG = {
      day:   {hours: 24,   buckets: 12},  // 2h buckets
      week:  {hours: 168,  buckets: 14},  // 12h buckets
      month: {hours: 720,  buckets: 15},  // 2-day buckets — weekly dips visible
      '3m':  {hours: 2160, buckets: 18},  // 5-day buckets
    };
    const cfg = RANGE_CFG[aiTrendRange] || RANGE_CFG.day;
    let alive = true;
    async function load() {
      try {
        const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
        const r = await fetch(
          `${bu}/api/ai_delivery_buckets?hours=${cfg.hours}&buckets=${cfg.buckets}`,
          { cache: 'no-store' }
        );
        if (!r.ok) return;
        const j = await r.json();
        if (alive) setAiDeliveryTrend(j);
      } catch { /* keep previous trend */ }
    }
    load();
    const periodMs = aiTrendRange === 'day' ? 30000 : aiTrendRange === 'week' ? 120000 : 300000;
    const iv = setInterval(load, periodMs);
    return () => { alive = false; clearInterval(iv); };
  }, [aiTrendRange]);

  useEffect(() => {
    try { localStorage.setItem('lcb_ai_trend_range', aiTrendRange); } catch {}
  }, [aiTrendRange]);

  const saxFilterLeads = useMemo(
    () => (data?.allLeads || []).filter(hasSaxLead),
    [data?.allLeads]
  );
  const vocal3FilterLeads = useMemo(
    () => (data?.allLeads || []).filter(hasThreePlusVocalsLead),
    [data?.allLeads]
  );

  const timeStr = updatedAt
    ? updatedAt.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })
    : null;

  return (
    <AiTagsContext.Provider value={{ tags: aiTags, loading: aiLoading }}>
    <ChatContext.Provider value={{ openChat: setChatTarget }}>
    <div className="app">
      {/* Header */}
      <div className="header">
        <div className="header-row">
          <div className="header-brand">
            <span className="header-note">🎶</span>
            <div>
              <div className="header-title">
                LCB Dashboard
                {offline && <span className="offline-pill">offline</span>}
              </div>
              {timeStr && <div className="header-sub">Обновлено: {timeStr}</div>}
              <UnreadBadge />
            </div>
          </div>
          <nav className="header-nav">
            <a href="./events.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(63,185,80,0.15)', color:'#3fb950', border:'1px solid rgba(63,185,80,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Согласование events — состав, гонорары, финансы, контакты">
              <span>📋</span><span>Events</span>
            </a>
            <a href="./pricing.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(245,197,24,0.15)', color:'#f5c518', border:'1px solid rgba(245,197,24,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Pricing matrix — цены по сигналам клиента, бэклайн, прочие расходы">
              <span>💰</span><span>Pricing</span>
            </a>
            <a href="./architecture.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(188,140,255,0.15)', color:'#bc8cff', border:'1px solid rgba(188,140,255,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Архитектура проекта + AI usage breakdown">
              <span>🧠</span><span>Архитектура</span>
            </a>
            <a href="./broker.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(63,185,80,0.15)', color:'#3fb950', border:'1px solid rgba(63,185,80,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Broker pipeline — посреднические заказы, кастинг подрядчиков, маржа">
              <span>🤝</span><span>Broker</span>
            </a>

            <a href="./contacts.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(88,166,255,0.15)', color:'#58a6ff', border:'1px solid rgba(88,166,255,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Contact Roles — классификация всех TG-контактов по ролям">
              <span>🎭</span><span>Contacts</span>
            </a>
            <a href="./cost.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(255,159,10,0.15)', color:'#ff9f0a', border:'1px solid rgba(255,159,10,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Расход AI и лимитов">
              <span>💸</span><span>Расход</span>
            </a>
            <a href="./bw-catchup.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(139,92,246,0.15)', color:'#8b5cf6', border:'1px solid rgba(139,92,246,0.4)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Что пропустил TG Monitor — добавил BW">
              <span>🔍</span><span>BW catch-up</span>
            </a>
            <ThemeHeaderButton />
            <button
              className="refresh-btn"
              onClick={() => load(true)}
              disabled={refreshing}
            >
              <span className={refreshing ? 'spin' : ''}>↻</span>
            </button>
          </nav>
        </div>
      </div>

      {/* Error */}
      {error && (
        <div className="err-box">
          ⚠️ {error}
          <small>
            Убедитесь что Google Sheets доступна публично.<br/>
            Запустите: <code>python3 sync_dashboard_data.py</code>
          </small>
        </div>
      )}

      {/* Loading skeleton */}
      {loading && !rows && <SkeletonCards />}

      {/* Content */}
      {data && (
        <>
          <ConnectionStatus connection={data.connection} vkConnection={data.vkConnection} waConnection={data.waConnection} />
          <TabBar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            newLeadsCount={data.newLeads?.total || 0}
            attentionCount={data.attention?.total || 0}
            refusalCount={Object.values(data.refusalCategories || {}).reduce((a,b) => a+b, 0)}
            paidCount={data.paid?.total || 0}
            agentsMissing={(data.agents?.missing || 0) + (data.agents?.staleSla || 0)}
            aiCalls={data.aiUsage?.totalCalls || 0}
            todosCount={todos?.total || 0}
            saxCount={saxFilterLeads.length}
            vocal3Count={vocal3FilterLeads.length}
          />

          {activeTab === 'overview' && (
            <>
              <OverviewStatsSection stats={overviewStats} />
              <LeadFlowSection />
              <StatusSection
                status={data.status}
                activity24h={activity24h}
                sent24h={recentSent24h}
                aiDelivery={aiDelivery}
                aiDeliveryTrend={aiDeliveryTrend}
                aiTrendRange={aiTrendRange}
                onAiTrendRangeChange={setAiTrendRange}
                onProcessClick={setShowProcess}
              />
              <ActionButtons />
              <KPISection kpi={data.kpi} setActiveTab={setActiveTab}
                          browserWalk={data.browserWalk || {leads:0, refusals:0, chats:0, ranAt:'', hours:48, items:[]}} />
              <div className="section" style={{ marginTop: 8 }}>
                <TGLeadsButton
                  onClick={() => setShowTGModal(true)}
                  tgWeek={data.tgFunnel?.week}
                />
              </div>
              <FunnelSplitSections
                allLeads={data.allLeads || []}
                archived={data.allArchived || []}
                pendingDrafts={data.pendingDrafts || []}
                sessionLog={sessionLog || null}
                fallbackFunnel={data.funnel || []}
              />
              <CartotekaSection data={leadContext} />
              <RecentSentMessagesSection data={recentSent} />
              <FollowupsSection followups={data.followups} />
            </>
          )}

          {activeTab === 'new' && (
            <NewLeadsSection newLeads={data.newLeads || {total:0, items:[]}} />
          )}

          {activeTab === 'attention' && (
            <AttentionSection attention={data.attention || {total:0, items:[]}} />
          )}

          {activeTab === 'sax' && (
            <LeadFilterSection
              title="🎷 Лиды с саксом"
              subtitle="Все активные заявки, где в запросе или истории есть сакс: solo welcome и сакс в составе группы."
              leads={saxFilterLeads}
            />
          )}

          {activeTab === 'vocal3' && (
            <LeadFilterSection
              title="🎤 3+ вокала"
              subtitle="Активные заявки, где явно просят больше двух вокалистов/солистов."
              leads={vocal3FilterLeads}
            />
          )}

          {activeTab === 'paid' && (
            <PaidSection paid={data.paid || {total:0, items:[]}} />
          )}

          {activeTab === 'refusals' && (
            <>
              <AISkipSection aiSkips={data.aiSkips} />
              <RefusalsSection refused={data.refused} categories={data.refusalCategories || {}} />
            </>
          )}

          {activeTab === 'broadcasts' && (
            <BroadcastsSection categories={data.refusalCategories || {}} />
          )}

          {activeTab === 'todos' && (
            <TodoSection todos={todos} />
          )}

          {activeTab === 'processes' && (
            <ProcessesSection agents={data.agents || {total:0, running:0, missing:0, items:[]}} />
          )}

          {activeTab === 'timeline' && (
            <TimelineSection timeline={data.timeline || {total:0, items:[]}} />
          )}

          {activeTab === 'ai' && (
            <AIUsageSection aiUsage={data.aiUsage || {totalCalls:0, totalCost:0, skip:0, adapt:0, ok:0, services:{}}} />
          )}

          {showTGModal && (
            <TGFunnelModal
              tgFunnel={data.tgFunnel || {}}
              onClose={() => setShowTGModal(false)}
            />
          )}
          {showProcess && (
            <ProcessRulesModal
              processKey={showProcess}
              onClose={() => setShowProcess(null)}
            />
          )}
        </>
      )}
      {chatTarget && <ChatPanel target={chatTarget} onClose={() => setChatTarget(null)} />}
    </div>
    </ChatContext.Provider>
    </AiTagsContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
// Service Worker registration + periodic version check.
// Проблема была: SW кешировал index.html и пользователь не видел новые
// деплои даже после reload. v29 переключил SW на network-first, плюс
// этот блок сам ловит новые деплои каждые 60с по Last-Modified.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(r => {
        console.log('[SW] registered', r.scope);
        // Force update check on each page load
        r.update();
      })
      .catch(e => console.log('[SW] failed', e));
  });
}

// ─── Auto-update check (Last-Modified polling) ────────────────────
(function setupVersionCheck() {
  let initialLastModified = null;
  let bannerShown = false;

  async function checkVersion() {
    try {
      const r = await fetch('./index.html', {
        method: 'HEAD',
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' },
      });
      const lm = r.headers.get('Last-Modified') || r.headers.get('ETag');
      if (!lm) return;
      if (initialLastModified === null) {
        initialLastModified = lm;
        return;
      }
      if (lm !== initialLastModified && !bannerShown) {
        showUpdateBanner();
        bannerShown = true;
      }
    } catch (e) {
      // network down or other issue — silently retry next tick
    }
  }

  function showUpdateBanner() {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#3fb950;color:#0d1117;padding:10px 16px;font:600 14px system-ui;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,0.4);';
    banner.innerHTML = '🔄 Доступна новая версия дашборда — <button id="reload-now" style="background:#0d1117;color:#3fb950;border:none;padding:6px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;">обновить</button>';
    document.body.appendChild(banner);
    document.getElementById('reload-now').onclick = async () => {
      // Очистить SW caches и перезагрузить
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      location.reload();
    };
  }

  // First check after 5s (let page settle), then every 60s
  setTimeout(checkVersion, 5000);
  setInterval(checkVersion, 60000);
})();
</script>
