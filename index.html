function ScanStatus({ scan }) {
  if (!scan || scan.status === 'idle') return null;

  const isActive = scan.status === 'scanning';
  const needsPerm = scan.status === 'needs_permission';
  const isDone = scan.status === 'done';
  const isError = scan.status === 'error';

  const cardClass = needsPerm ? 'scan-card scan-card-permission'
    : isError ? 'scan-card scan-card-error'
    : isDone ? 'scan-card scan-card-done'
    : isActive ? 'scan-card scan-card-active'
    : 'scan-card';

  const statusEmoji = needsPerm ? '⚠️' : isError ? '❌' : isDone ? '✅' : '🔍';
  const statusLabel = needsPerm ? 'Требуется разрешение'
    : isError ? 'Ошибка'
    : isDone ? 'Сканирование завершено'
    : 'Сканирование...';

  const statusColor = needsPerm || isError ? '#f87171' : isDone ? 'var(--ok)' : 'var(--gold)';

  let timeAgo = '';
  if (scan.updated) {
    try {
      const d = new Date(scan.updated);
      const mins = Math.round((Date.now() - d.getTime()) / 60000);
      if (mins < 1) timeAgo = 'только что';
      else if (mins < 60) timeAgo = mins + ' мин назад';
      else timeAgo = Math.round(mins / 60) + ' ч назад';
    } catch { timeAgo = ''; }
  }

  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title">TG Сканирование</div>
      <div className={cardClass}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:14,fontWeight:700,color:statusColor}}>
            {statusEmoji} {statusLabel}
          </div>
          {timeAgo && <div style={{fontSize:10,color:'var(--muted)'}}>{timeAgo}</div>}
        </div>

        {scan.message && (
          <div style={{fontSize:12,color:'var(--text)',marginTop:6,lineHeight:1.4}}>{scan.message}</div>
        )}

        {isActive && (
          <div className="scan-progress-bar">
            <div className="scan-progress-fill" style={{width: scan.progress + '%'}} />
          </div>
        )}
        {isActive && (
          <div style={{fontSize:11,color:'var(--muted)',textAlign:'right'}}>{scan.progress}%</div>
        )}

        {scan.chatsChecked && scan.chatsChecked.length > 0 && (() => {
          const totalPosts = scan.chatsChecked.reduce((a, c) => a + (Number(c.posts) || 0), 0);
          return (
            <div style={{marginTop:8,padding:'6px 8px',background:'rgba(255,255,255,0.03)',borderRadius:6,fontSize:10,color:'var(--muted)'}}>
              <div style={{fontWeight:700,textTransform:'uppercase',letterSpacing:'1.2px',marginBottom:4}}>
                Проверено: {scan.chatsChecked.length} {scan.chatsChecked.length === 1 ? 'чат' : 'чатов'} · {totalPosts} постов
              </div>
              {scan.chatsChecked.map((c, i) => (
                <div key={i} style={{display:'flex',gap:6,flexWrap:'wrap',lineHeight:1.5}}>
                  <span style={{color:'var(--text)'}}>{c.chat || '—'}</span>
                  <span>· {c.posts || 0} постов</span>
                  {c.period_from && c.period_to && <span>· {c.period_from}–{c.period_to}</span>}
                </div>
              ))}
            </div>
          );
        })()}

        {scan.results && scan.results.length > 0 && (
          <div style={{marginTop:8}}>
            <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'1.2px',color:'var(--muted)',marginBottom:4}}>
              Найдено заявок: {scan.results.length}
            </div>
            {scan.results.map((r, i) => {
              // Build a Telegram Web link that opens the chat directly.
              // Priority: explicit post_link > @username (contact/link) > chat-source @username > source chat name map.
              const chatNameMap = {
                'Event Family': 'EventFamily',
                'EventFamily': 'EventFamily',
                'Event Russia': 'Event_Russian',
                'Event_Russian': 'Event_Russian',
                'Event Area': 'event_area',
                'event_area': 'event_area',
                'Event People': 'eventori',
                'eventori': 'eventori',
                'Event hunter': 'mskeventjob',
                'mskeventjob': 'mskeventjob',
                'myeventhunter': 'myeventhunter',
                'Bigfinger': 'bigfingerchat',
                'bigfingerchat': 'bigfingerchat',
                'eventchatrussia': 'eventchatrussia',
                'Event Мероприятия': 'eventchatrussia',
              };
              const unameMatch = (r.contact || '').match(/@([A-Za-z0-9_]+)/)
                || (r.link || '').match(/t\.me\/([A-Za-z0-9_]+)/)
                || (r.chat || '').match(/@([A-Za-z0-9_]+)/);
              let uname = unameMatch && unameMatch[1];
              // Fallback: use chat-name map when contact is "в ЛС" and link empty
              if (!uname && r.chat) {
                for (const [k, v] of Object.entries(chatNameMap)) {
                  if (r.chat.toLowerCase().includes(k.toLowerCase())) { uname = v; break; }
                }
              }
              // tg://resolve?domain=X opens Telegram Desktop DIRECTLY to the DM with that user.
              // Fallback: https://t.me/X for leads without explicit uname (Telegram Desktop handles it too).
              const tgLink = uname
                ? `tg://resolve?domain=${uname}`
                : r.post_link
                  ? r.post_link
                  : null;
              // If we fell back to source chat, adjust label
              const contactIsDM = (r.contact || '').trim() === 'в ЛС';
              const linkLabel = contactIsDM && uname && !unameMatch
                ? `→ чат @${uname}`
                : null;
              return (
              <div key={i} className="scan-result-item"
                onClick={() => tgLink && window.open(tgLink, '_blank')}
                style={{cursor: tgLink ? 'pointer' : 'default'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <span style={{color:'var(--gold)',marginRight:6}}>•</span>
                    {tgLink
                      ? <a href={tgLink} target="_blank" rel="noopener" style={{color:'var(--blue)',textDecoration:'none',fontWeight:700}}>{r.who || '—'}</a>
                      : <strong>{r.who || '—'}</strong>
                    }
                    {r.contact && (tgLink && uname
                      ? <a href={tgLink} style={{color:'var(--blue)',fontSize:10,marginLeft:4,textDecoration:'none'}} onClick={e=>e.stopPropagation()}>💬 {r.contact}</a>
                      : <span style={{color:'var(--muted)',fontSize:10,marginLeft:4}}>{r.contact}</span>
                    )}
                    {linkLabel && <span style={{color:'var(--blue)',fontSize:10,marginLeft:6}}>{linkLabel}</span>}
                  </div>
                  {r.note && <span style={{color:'#f87171',fontSize:9,fontWeight:700,flexShrink:0}}>⚠ {r.note}</span>}
                </div>
                <div style={{marginTop:2}}>{r.what || '—'}</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4,fontSize:10,color:'var(--muted)'}}>
                  {r.event_date && <span>📅 Событие: {r.event_date}</span>}
                  {r.post_date && <span>✉ Пост: {r.post_date}</span>}
                  {r.budget && r.budget !== 'не указан' && <span style={{color:'var(--ok)'}}>💰 {r.budget}</span>}
                  {r.post_link && !r.post_link.includes('@') && <a href={tgLink} target="_blank" rel="noopener" style={{color:'var(--blue)'}}>→ открыть пост</a>}
                </div>
              </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function StatusSection({ status, activity24h, sent24h, aiDelivery, onProcessClick }) {
  const [bwExpanded, setBwExpanded] = React.useState(false);
  const [bwFeed, setBwFeed] = React.useState(null);
  // 🔴 23.04: универсальный expand для любого процесса (не только Browser Walk).
  // procDetail[key] = {events, kind, summary, loading, error}
  const [procExpanded, setProcExpanded] = React.useState({});
  const [procDetail,   setProcDetail]   = React.useState({});
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';

  const fetchProcDetail = React.useCallback(async (key) => {
    setProcDetail(prev => ({ ...prev, [key]: { ...(prev[key]||{}), loading: true } }));
    try {
      const r = await fetch(`${backendUrl}/api/process_detail?key=${encodeURIComponent(key)}&limit=20`, { cache: 'no-store' });
      const j = await r.json();
      setProcDetail(prev => ({ ...prev, [key]: { ...j, loading: false } }));
    } catch (e) {
      setProcDetail(prev => ({ ...prev, [key]: { error: String(e), loading: false, events: [] } }));
    }
  }, [backendUrl]);

  const toggleProc = (key) => {
    setProcExpanded(prev => {
      const next = { ...prev, [key]: !prev[key] };
      if (next[key] && !procDetail[key]) fetchProcDetail(key);
      return next;
    });
  };

  const _fmtRelTime = (ts) => {
    if (!ts) return '';
    try {
      const t = new Date(ts).getTime();
      if (!t) return ts;
      const diff = (Date.now() - t) / 1000;
      if (diff < 60) return `${Math.round(diff)}с назад`;
      if (diff < 3600) return `${Math.round(diff/60)}м назад`;
      if (diff < 86400) return `${Math.round(diff/3600)}ч назад`;
      return `${Math.round(diff/86400)}д назад`;
    } catch { return ts; }
  };

  React.useEffect(() => {
    if (!bwExpanded) return;
    let cancelled = false;
    const fetchFeed = async () => {
      try {
        const r = await fetch(`${backendUrl}/api/browser_walk_progress`, { cache: 'no-store' });
        if (!r.ok) return;
        const j = await r.json();
        if (!cancelled) setBwFeed(j);
      } catch { /* offline */ }
    };
    fetchFeed();
    const t = setInterval(fetchFeed, 3000);
    return () => { cancelled = true; clearInterval(t); };
  }, [bwExpanded, backendUrl]);

  if (!status.length) return null;
  const act = activity24h || {};
  const aiCalls24h = Number(aiDelivery?.ai_calls || act._ai_calls_24h?.count || 0);
  const sentMessages24h = Number(aiDelivery?.sent_total || sent24h?.total || 0);
  const sentConversion24h = aiCalls24h > 0
    ? Math.round((sentMessages24h / aiCalls24h) * 1000) / 10
    : 0;
  const deliveryOutcomes = aiDelivery?.outcomes || {};
  const deliveryTitle = aiDelivery
    ? [
        `Факт TG out: ${aiDelivery.sent_total || 0}`,
        `Текст: ${aiDelivery.sent_text || 0}`,
        `Медиа: ${aiDelivery.sent_media || 0}`,
        `Новые лиды ждут питча: ${deliveryOutcomes.new_leads_waiting_pitch || 0}`,
        `Изменения шага: ${deliveryOutcomes.stage_changes || 0}`,
        `Broker intake: ${deliveryOutcomes.broker_intake || 0}`,
        `Broker skip: ${deliveryOutcomes.broker_skip || 0}`,
        `AI skip: ${deliveryOutcomes.ai_skip || 0}`,
        `Codex fail: ${deliveryOutcomes.codex_fail || 0}`,
        ...(aiDelivery.sent_by_source || []).map(([src, n]) => `${src}: ${n}`),
      ].join('\n')
    : 'Конверсия = реально отправленные сообщения за 24ч / AI-вызовы за 24ч';

  // Browser Walk row — предпочитаем row из Google Sheet (sync_dashboard_data.py),
  // потому что он уже стоит в правильной позиции (после TG Monitor).
  // Если Sheet-row нет (на всякий случай) — синтезируем.
  // 🔴 21.04 фикс дубля: раньше PUSH'или ещё одну строку — получали 2 Browser Walk'а
  // (одна после TG Monitor от Sheet, вторая в самом конце от push). Убрано.
  const bw = act.proc_browser_walk;
  const hasBwInStatus = status.some(s => s.key === 'proc_browser_walk');
  let rows = [...status];
  if (bw && !hasBwInStatus) {
    const running = bw.status === 'running';
    const queued  = bw.status === 'queued';
    const val = running
      ? (bw.progress ? `running ${bw.progress.scanned}/${bw.progress.total}` : 'running')
      : queued
        ? 'queued'
        : (bw.ran_at ? (() => {
            const h = Math.floor((Date.now() - new Date(bw.ran_at).getTime()) / 3600000);
            return h < 1 ? 'ok (<1h)' : `ok (${h}h)`;
          })() : 'idle');
    // Вставляем сразу ПОСЛЕ proc_tg_monitor для правильного порядка
    const tgIdx = rows.findIndex(s => s.key === 'proc_tg_monitor');
    const newRow = {
      key: 'proc_browser_walk',
      label: '👁️ Browser Walk',
      val,
      reason: '',
      action: running && bw.progress?.current ? `сейчас: ${bw.progress.current}` : '',
    };
    if (tgIdx >= 0) {
      rows = [...rows.slice(0, tgIdx + 1), newRow, ...rows.slice(tgIdx + 1)];
    } else {
      rows.push(newRow);
    }
  }

  const processState = (s) => {
    const a = act[s.key] || {};
    const val = String(s.val || '').toLowerCase();
    const running = (s.key === 'proc_browser_walk' && a.status === 'running')
      || val.includes('running')
      || a.status === 'running';
    const failed = val.includes('не работает')
      || val.includes('error')
      || val.includes('missing')
      || val.includes('stale')
      || val.includes('fail')
      || val.includes('exit=1')
      || val.includes('exit 1');
    if (failed) return 'fail';
    if (running) return 'run';
    return 'wait';
  };

  const processRank = { fail: 0, run: 1, wait: 2 };
  rows = rows
    .map((row, idx) => ({ ...row, _origIndex: idx }))
    .sort((a, b) => {
      const ra = processRank[processState(a)] ?? 9;
      const rb = processRank[processState(b)] ?? 9;
      if (ra !== rb) return ra - rb;
      return a._origIndex - b._origIndex;
    });

  const heartbeatLabels = {
    proc_tg_monitor: 'tg chats',
    proc_tg_dm_realtime: 'tg dm',
    proc_payment_handler: 'payment',
    proc_vk_longpoll: 'vk lp',
    proc_bot_commander: 'bot',
  };
  const heartbeatBeats = Object.keys(heartbeatLabels)
    .map(key => {
      const row = rows.find(s => s.key === key);
      if (!row) return null;
      return { key, short: heartbeatLabels[key], state: processState(row) };
    })
    .filter(Boolean);

  const processHover = (s) => {
    const a = act[s.key] || {};
    const state = processState(s);
    const info = PROCESS_RULES[s.key] || {};
    const reason = [s.reason, a.error, a.reason].filter(Boolean).join(' · ');
    const val = String(s.val || '').trim();
    const nextRun = a.next_run_sec > 0 ? _fmtCountdown(a.next_run_sec) : '';
    let why = '';
    let normal = '';
    if (state === 'fail') {
      why = reason || val || 'State/log просрочен или прошлый запуск завершился ошибкой.';
      normal = 'Нет. Это надо чинить или дождаться ближайшего tick только если причина явно transient/network.';
    } else if (state === 'run') {
      why = s.key === 'proc_browser_walk' && a.progress
        ? `Сейчас выполняется: ${a.progress.scanned || 0}/${a.progress.total || 0}${a.progress.current ? ` · ${a.progress.current}` : ''}.`
        : 'Процесс активен прямо сейчас.';
      normal = 'Да, это нормальный running-state. Если рядом виден -15 у launchd, для running daemon это обычно прошлый SIGTERM после рестарта, не текущая ошибка.';
    } else {
      why = nextRun
        ? `Ждёт следующий запуск launchd примерно через ${nextRun}.`
        : 'Ждёт входящее событие, расписание или следующий idle-tick.';
      normal = val.startsWith('ok')
        ? 'Да. Для scheduled/KeepAlive процессов waiting/ok между запусками нормален.'
        : 'Проверь, если ожидание длится дольше SLA или рядом есть stale/error.';
    }
    return {
      state,
      why,
      normal,
      impact: info.desc || 'Описание процесса не задано в PROCESS_RULES.',
      interval: info.interval || '',

  return (

          const bwRunning = is_bw && a?.status === 'running';

                                {_fmtRelTime(e.ts)}
                              </span>
                              <span style={{color:'#cbd5e1'}}>

                              </span>
                              <span style={{color:'#64748b', fontVariantNumeric:'tabular-nums'}}>
                                {e.duration_sec ? `${e.duration_sec}s` : ''}

                            </div>
                            {e.leads && e.leads.length > 0 && (
                              <div style={{marginTop:4, marginLeft:8, paddingLeft:8,
                                           borderLeft:'2px solid rgba(52,211,153,0.35)'}}>

                                {_fmtRelTime(e.timestamp)}
                              </span>
                              <span style={{color:'#e2e8f0', fontWeight:600}}>@{e.username || '—'}</span>

                                <span style={{

                        {kind === 'gap_detector' && (
                          <>

                              </div>
                            )}

                                    marginTop: 4, padding: '6px 8px',
                                    background: 'rgba(15,23,42,0.6)',
                                    border: '1px solid rgba(148,163,184,0.2)',

                                      fontSize: 9, color: '#64748b',

                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* Секция 2 — Отказы из последнего walk'а */}
                  {Array.isArray(a?.last_refusals) && a.last_refusals.length > 0 && (
                    <div style={{marginBottom:14}}>
                      <div style={{fontSize:10, color:'#f87171', textTransform:'uppercase',
                                   letterSpacing:0.5, marginBottom:6, fontWeight:700}}>
                        ❌ Отказы · {a.last_refusals.length}
                      </div>
                      {a.last_refusals.map((r_, i) => (
                        <div key={i} style={{
                              padding:'5px 9px', marginBottom:4, fontSize:11,
                              background:'rgba(248,113,113,0.06)',
                              border:'1px solid rgba(248,113,113,0.2)',
                              borderRadius:4,
                            }}>
                          <div style={{color:'#e2e8f0', fontWeight:600}}>
                            {r_.author || '?'} · {r_.date || ''}
                          </div>
                          <div style={{color:'#94a3b8', fontSize:10.5, marginTop:2}}>
                            {r_.reason || ''}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Секция 3 — Решения Claude per chat (walk_event) */}
                  {(!bwFeed || !Array.isArray(bwFeed.events) || bwFeed.events.length === 0) ? (
                    (!Array.isArray(a?.last_leads) || a.last_leads.length === 0) ? (
                      <div style={{color:'#64748b', fontSize:11}}>
                        Пока нет данных. Следующий walk через ⏱ {a?.next_run_sec > 0 ? _fmtCountdown(a.next_run_sec) : 'скоро'}.
                      </div>
                    ) : null
                  ) : (
                    <>
                      <div style={{fontSize:10, color:'#64748b', textTransform:'uppercase',
                                   letterSpacing:0.5, marginBottom:6, fontWeight:600}}>
                        Решения Claude по постам · {bwFeed.events.length}
                      </div>
                      {bwFeed.events.slice().reverse().map((ev, i) => {
                        const isSummary = ev.outcome === 'summary';
                        const icon = ev.outcome === 'kept'     ? '✅'
                                   : ev.outcome === 'dup'      ? '🔁'
                                   : isSummary                 ? '📋'
                                   : '❌';
                        const color = ev.outcome === 'kept'    ? '#34d399'
                                    : ev.outcome === 'dup'     ? '#fbbf24'
                                    : isSummary                ? '#93c5fd'
                                    : '#f87171';
                        return (
                          <div key={i} style={{
                                display:'flex', gap:7,
                                marginBottom: isSummary ? 9 : 5,
                                padding: isSummary ? '8px 10px' : '3px 0',
                                background: isSummary ? 'rgba(59,130,246,0.10)' : 'transparent',
                                borderLeft: isSummary ? '3px solid #3b82f6' : 'none',
                                borderRadius: isSummary ? 4 : 0,
                              }}>
                            <span style={{flexShrink:0, fontSize: isSummary ? 16 : 13,
                                          lineHeight:1.3}}>{icon}</span>
                            <span style={{flex:1, minWidth:0,
                                          whiteSpace:'normal', wordBreak:'break-word'}}>
                              <span style={{color:'#e2e8f0', fontWeight:700}}>{ev.chat}</span>
                              {ev.excerpt && (
                                <span style={{color: color}}> · {ev.excerpt}</span>
                              )}
                              {ev.reason && (
                                <div style={{color: isSummary ? '#cbd5e1' : '#94a3b8',
                                             fontSize: isSummary ? 12 : 11,
                                             marginTop: 3,
                                             fontStyle: isSummary ? 'normal' : 'italic'}}>
                                  {isSummary ? '💭 ' : '— '}{ev.reason}
                                </div>
                              )}
                            </span>
                          </div>
                        );
                      })}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

            borderLeft: `3px solid ${prioColor[t.priority] || prioColor['']}`,
            borderRadius: 8,
            padding: '10px 12px',
          }}>
            <div style={{display:'flex', alignItems:'baseline', gap:8, flexWrap:'wrap', marginBottom:4}}>
              <div style={{fontSize:13.5, fontWeight:600, color:'var(--text)', flex:1, minWidth:200}}>
                {t.title || t.file}
              </div>
              {t.date_hint && (
                <span style={{
                  fontSize:11,
                  background:'rgba(255,255,255,0.06)',
                  padding:'2px 7px',
                  borderRadius:10,
                  color:'var(--muted)',
                  whiteSpace:'nowrap',
                }}>{t.date_hint}</span>
              )}
              {t.priority && (
                <span style={{
                  fontSize:10.5,
                  color: prioColor[t.priority],
                  fontWeight:600,
                  whiteSpace:'nowrap',
                }}>{prioLabel[t.priority]}</span>
              )}
              {/* 🔴 25.04: ручное удаление TODO (file перемещается в /tmp backup) */}
              {t.file && (
                <button
                  onClick={async (e) => {
                    e.stopPropagation();
                    if (!confirm(`Удалить TODO «${t.title || t.file}»?\nФайл будет перемещён в /tmp как backup.`)) return;
                    // Capture refs BEFORE await — иначе React пересобирает event и currentTarget=null
                    const btn = e.currentTarget;
                    const card = btn.closest('div[style*="borderLeft"]');
                    const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
                    try {
                      const r = await fetch(`${bu}/api/todos/delete`, {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({file: t.file}),
                      });
                      const j = await r.json();
                      if (j.ok) {
                        if (card) { card.style.opacity = 0.25; card.style.pointerEvents = 'none'; }
                        if (btn)  btn.textContent = '✓';
                      } else {
                        alert(`Не удалось: ${j.error || '?'}`);
                      }
                    } catch (err) { alert(`Error: ${err}`); }
                  }}
                  title="Удалить TODO (move to /tmp backup)"
                  style={{
                    background:'rgba(248,113,113,0.10)',
                    border:'1px solid rgba(248,113,113,0.35)',
                    color:'#f87171',
                    borderRadius:5, padding:'2px 7px', fontSize:10.5,
                    cursor:'pointer', whiteSpace:'nowrap', marginLeft:'auto',
                  }}
                >✕</button>
              )}
            </div>
            {t.description && (
              <div style={{fontSize:11.5, color:'var(--muted)', marginBottom:6, fontStyle:'italic'}}>
                {t.description}
              </div>
            )}
            {(t.preview || []).map((p, j) => (
              <div key={j} style={{
                fontSize:12.5,
                color:'var(--text)',
                opacity:0.85,
                marginTop: j === 0 ? 0 : 4,
                lineHeight:1.45,
              }}>
                {p}
              </div>
            ))}
            <div style={{fontSize:10.5, color:'var(--muted)', marginTop:6, opacity:0.6}}>
              {t.file}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TGFunnelModal({ tgFunnel, onClose }) {
  const [period, setPeriod] = useState('week');
  const periods = [
    { key: 'day',   label: 'День' },
    { key: 'week',  label: 'Неделя' },
    { key: 'month', label: 'Месяц' },
    { key: 'year',  label: 'Год' },
  ];
  const cur    = tgFunnel[period] || { sent: 0, leads: 0, paid: 0, earned: 0 };
  const maxVal = Math.max(cur.sent || 1, 1);
  const steps  = [
    { key: 'sent',  label: 'Отправлено ответов',  val: cur.sent,  color: '#3b82f6' },
    { key: 'leads', label: 'Лиды (Customer TG)',  val: cur.leads, color: '#f5c518' },
    { key: 'paid',  label: 'Оплатили',            val: cur.paid,  color: '#10b981' },
  ];
  const hasData = Object.keys(tgFunnel).length > 0;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet" onClick={e => e.stopPropagation()}>
        <div className="modal-handle" />
        <div className="modal-header">
          <div className="modal-title">TG Воронка</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="period-tabs">
          {periods.map(p => (
            <button
              key={p.key}
              className={'period-tab' + (period === p.key ? ' active' : '')}
              onClick={() => setPeriod(p.key)}
            >{p.label}</button>
          ))}
        </div>
        <div className="tg-funnel-list">
          {steps.map((step, i) => {
            const prev = steps[i - 1];
            const conv = prev && prev.val > 0
              ? Math.round(step.val / prev.val * 100) + '%'
              : null;
            const barW = Math.max(8, Math.round(step.val / maxVal * 100));
            return (
              <div key={step.key} className="tg-funnel-item">
                <div className="tg-funnel-item-header">
                  <span className="tg-funnel-item-label">{step.label}</span>
                  {conv && i > 0 && <span className="tg-funnel-item-conv">{conv}</span>}
                </div>
                <div className="tg-funnel-bar-track">
                  <div
                    className="tg-funnel-bar-fill"
                    style={{ width: barW + '%', background: step.color }}
                  >
                    <span className="tg-funnel-bar-num">{step.val}</span>
                  </div>
                </div>
              </div>
            );
          })}
          <div className="tg-earned-row">
            <span className="tg-earned-label">Заработано</span>
            <span className="tg-earned-val">
              {cur.earned > 0 ? cur.earned.toLocaleString('ru-RU') + '\u00a0₽' : '—'}
            </span>
          </div>
        </div>
        {!hasData && (
          <div style={{marginTop:14, fontSize:11, color:'var(--muted)', textAlign:'center'}}>
            Запустите sync_dashboard_data.py для обновления данных
          </div>
        )}
      </div>
    </div>
  );
}

        {filteredItems.slice(0, 20).map((item, i) => {
          const uname = item.username;
          const tgUrl = uname
            ? `https://t.me/${uname}`
            : (item.contact?.startsWith('http') ? item.contact : '');
          const vkId = vkChatId(item);
          const canChat = (item.channel === 'TG' && !!item.username) || !!vkId;

          const openTarget = () => chatCtx?.openChat({
            user_id: null, username: chatUser, client: item.client, channel: chatChannel,
          });
          const onEnter = canChat ? () => {

                {(() => {
                  const tag = uname ? aiCtx.tags[uname.toLowerCase()] : null;

                  const meta = AI_TAG_META[tag.category] || AI_TAG_META.unknown;

                    <div style={{fontSize:12, color:'var(--muted)', marginTop:4, display:'flex', gap:10, alignItems:'center'}}>

function TgSafetyStatus() {
  // Live cold/reply daily counters + ban status (07.05.2026).
  // Backend: /api/tg_safety. Refresh каждые 30 сек.
  const backendUrl = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
  const [data, setData] = React.useState(null);
  React.useEffect(() => {
    let alive = true;
    const load = async () => {
      try {
        const r = await fetch(`${backendUrl}/api/tg_safety`, { cache: 'no-store' });
        if (!r.ok) return;
        const d = await r.json();
        if (alive) setData(d);
      } catch (_) {}
    };
    load();
    const iv = setInterval(load, 30000);
    return () => { alive = false; clearInterval(iv); };
  }, [backendUrl]);
  if (!data) {
    return (
      <div style={{marginTop:16,padding:12,background:'rgba(59,130,246,0.08)',borderRadius:8,fontSize:11,color:'var(--muted)'}}>
        💡 Anti-ban: jitter 15-35с, лимиты загружаются…
      </div>
    );
  }
  const { cold, reply, banned, ban_reason } = data;
  const colorFor = (pct) => pct >= 90 ? '#f85149' : (pct >= 70 ? '#f0883e' : '#3fb950');
  const bar = (label, info) => (
    <div style={{marginTop:6}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11}}>
        <span>{label}: <strong>{info.used}</strong> / {info.limit}</span>
        <span style={{color:'var(--muted)'}}>{info.remaining} осталось</span>
      </div>
      <div style={{height:6,background:'rgba(255,255,255,0.06)',borderRadius:3,marginTop:3,overflow:'hidden'}}>
        <div style={{
          width: `${Math.min(100, info.pct)}%`,
          height: '100%',
          background: colorFor(info.pct),
          transition: 'width 0.3s'
        }} />
      </div>
    </div>
  );
  return (
    <div style={{marginTop:16,padding:12,background:'rgba(59,130,246,0.08)',borderRadius:8,fontSize:11,color:'var(--muted)'}}>
      <div style={{fontWeight:600,marginBottom:6,color:'var(--text)'}}>
        💡 TG Send Limits сегодня
        {banned && (
          <span style={{marginLeft:8,padding:'2px 6px',background:'#3a1f1f',color:'#f85149',borderRadius:4,fontSize:10}}>
            ⚠️ BANNED: {ban_reason || 'PeerFlood cooldown'}
          </span>
        )}
      </div>
      {bar('Cold pitches (anti-PeerFlood)', cold)}
      {bar('Replies (active dialogs)', reply)}
      <div style={{marginTop:8,fontSize:10,color:'var(--muted)'}}>
        jitter 15-35с · cold limit anti-flood · reply limit мягкий (TG не штрафует за reply-traffic)
      </div>
    </div>
  );
}

// ── Processes (launchd agents) with SLA ──────────────────────────────────────
function ProcessesSection({ agents }) {
  const fmtInterval = (sec) => {
    if (!sec) return 'постоянно';
    if (sec < 60) return `${sec}с`;
    if (sec < 3600) return `${Math.round(sec/60)}м`;
    return `${Math.round(sec/3600)}ч`;
  };
  const fmtMinsAgo = (m) => {
    if (m == null) return '—';
    if (m < 1) return 'только что';
    if (m < 60) return `${m}м назад`;
    if (m < 1440) return `${Math.round(m/60)}ч назад`;
    return `${Math.round(m/1440)}д назад`;
  };
  const stateColor = (st) => {
    if (st === 'running')   return { dot:'#10b981', label:'работает',   bg:'rgba(16,185,129,0.1)' };
    if (st === 'not')       return { dot:'#f5c518', label:'ждёт',       bg:'rgba(245,197,24,0.08)' };
    if (st === 'missing')   return { dot:'#f87171', label:'НЕ В LAUNCHCTL', bg:'rgba(248,113,113,0.15)' };
    if (st === 'error')     return { dot:'#f87171', label:'ошибка',     bg:'rgba(248,113,113,0.15)' };
    return { dot:'#6b7280', label: st || '?', bg:'rgba(107,114,128,0.1)' };
  };
  const slaColor = (sla) => {
    if (sla === 'green')    return '#10b981';
    if (sla === 'yellow')   return '#f5c518';
    if (sla === 'red')      return '#f87171';
    if (sla === 'sleeping') return '#60a5fa';  // синий — штатный сон
    return 'var(--muted)';
  };
  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title">🛡️ Процессы (launchd)</div>
      <div style={{display:'flex',gap:16,padding:'4px 0',fontSize:12,color:'var(--muted)',marginBottom:10,flexWrap:'wrap'}}>
        <span>Всего: <b style={{color:'var(--text)'}}>{agents.total}</b></span>
        <span>● <b style={{color:'#10b981'}}>{agents.running}</b> работает</span>
        {agents.missing > 0 && <span>⚠️ <b style={{color:'#f87171'}}>{agents.missing}</b> не в launchctl</span>}
        {agents.staleSla > 0 && <span>⏱️ <b style={{color:'#f5c518'}}>{agents.staleSla}</b> SLA просрочен</span>}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {(agents.items || []).map((a, i) => {
          const sc = stateColor(a.state);
          const okExit = a.last_exit === '0' || a.last_exit === '(never exited)' || !a.last_exit;
          const slaCol = slaColor(a.sla);
          return (
            <div key={i} style={{
              padding:'8px 12px',
              background: sc.bg,
              borderRadius: 8,
              border: `1px solid ${a.sla === 'red' ? '#f87171' : 'var(--border)'}`,
              display: 'flex',
              alignItems: 'center',
              gap: 10,
            }}>
              <span style={{
                width:8,height:8,borderRadius:'50%',
                background: sc.dot,
                boxShadow: a.state === 'running' ? `0 0 6px ${sc.dot}` : 'none',
                flexShrink:0,
              }} />
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                  {a.desc}
                </div>
                <div style={{fontSize:10,color:'var(--muted)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                  <span style={{fontFamily:'monospace'}}>{a.label.replace('com.lcband.','')}</span>
                  <span style={{marginLeft:8}}>
                    · {a.note ? a.note : `каждые ${fmtInterval(a.interval)}`}
                  </span>
                  {a.minutes_since_success != null && (
                    <span style={{marginLeft:8,color:slaCol,fontWeight:600}}>
                      · успех {fmtMinsAgo(a.minutes_since_success)}
                      {a.sla === 'sleeping' && ' 💤'}
                    </span>
                  )}
                  {!okExit && <span style={{marginLeft:8,color:'#f87171'}}>· exit {a.last_exit}</span>}
                </div>
              </div>
              <span style={{
                fontSize:10,fontWeight:700,
                padding:'2px 8px',borderRadius:10,
                background:'rgba(0,0,0,0.25)',
                color:sc.dot,
                whiteSpace:'nowrap',
              }}>
                {sc.label.toUpperCase()}
              </span>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:12,padding:10,background:'rgba(59,130,246,0.08)',borderRadius:8,fontSize:11,color:'var(--muted)'}}>
        💡 Watchdog каждые 30 минут проверяет. SLA: 🟢 зелёный в пределах 2× интервала, 🟡 жёлтый просрочен, 🔴 красный &gt; 5× интервала, 🔵 синий «спит» (по расписанию).
      </div>
    </div>
  );
}

// ── Timeline — события дня ───────────────────────────────────────────────────
function TimelineSection({ timeline }) {
  const items = timeline.items || [];
  const fmtTs = (iso) => {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    } catch { return iso.slice(11, 16); }
  };
  const kindStyle = (kind) => {
    const map = {
      'ai_call':   { emoji: '🤖', color: '#60a5fa', label: 'LLM' },
      'ai_skip':   { emoji: '❌', color: '#f87171', label: 'AI-SKIP' },
      'ai_adapt':  { emoji: '✏️', color: '#a78bfa', label: 'ADAPT' },
      'sent':      { emoji: '📤', color: '#10b981', label: 'ОТПРАВЛЕНО' },
      'error':     { emoji: '⚠️', color: '#f87171', label: 'ОШИБКА' },
    };
    return map[kind] || { emoji: '·', color: 'var(--muted)', label: kind };
  };
  if (items.length === 0) {
    return (
      <div className="section" style={{ marginTop: 14 }}>
        <div className="section-title">🕒 Таймлайн сегодня</div>
        <div style={{padding:20,textAlign:'center',color:'var(--muted)',fontSize:13}}>
          Сегодня событий ещё нет. LLM-вызовы, отправки и AI-решения будут появляться здесь.
        </div>
      </div>
    );
  }
  return (
    <div className="section" style={{ marginTop: 14 }}>
      <div className="section-title">🕒 Таймлайн сегодня ({timeline.total})</div>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {items.map((ev, i) => {
          const s = kindStyle(ev.kind);
          return (
            <div key={i} style={{
              display:'flex', alignItems:'flex-start', gap:10,
              padding:'6px 10px',
              background: 'rgba(255,255,255,0.02)',
              borderLeft: `3px solid ${s.color}`,
              borderRadius: 4,
            }}>
              <span style={{fontSize:10,color:'var(--muted)',fontFamily:'monospace',flexShrink:0,minWidth:40}}>
                {fmtTs(ev.ts)}
              </span>
              <span style={{fontSize:14,flexShrink:0}}>{s.emoji}</span>
              <div style={{flex:1,minWidth:0,fontSize:12}}>
                <span style={{color:s.color,fontWeight:700,marginRight:6}}>{s.label}</span>
                {ev.purpose && <span style={{color:'var(--muted)',fontSize:10,marginRight:6}}>[{ev.purpose}]</span>}
                {ev.username && <span style={{fontFamily:'monospace'}}>@{ev.username}</span>}
                {ev.decision && <span style={{marginLeft:6,color:'var(--muted)'}}>→ {ev.decision}</span>}
                {ev.reason && <div style={{fontSize:10,color:'var(--muted)',marginTop:2}}>{ev.reason.slice(0,200)}</div>}
                {ev.context && !ev.reason && <div style={{fontSize:10,color:'var(--muted)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{String(ev.context).slice(0,200)}</div>}
                {ev.cost_usd > 0 && <span style={{marginLeft:6,fontSize:10,color:'#f5c518'}}>${ev.cost_usd.toFixed(5)}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Chat panel (CRM-style side panel) ────────────────────────────────────────
// Same-origin if we're already served by the backend (http://localhost:8878/),
// otherwise hit 127.0.0.1:8878 explicitly (works only on the same machine + browsers
// that allow mixed content to loopback — Chrome yes, Safari mostly no).
let CHAT_BACKEND = (location.port === '8878') ? '' : 'http://127.0.0.1:8878';
// Public Cloudflare tunnel URL, published by tunnel_watcher.py. If present,
// overrides the 127.0.0.1 fallback so the chat works on GitHub Pages (no mixed
// content — tunnel terminates HTTPS).
const BACKEND_READY = (async () => {
  if (CHAT_BACKEND === '') return;
  if (location.protocol === 'file:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost') return;
  try {
    const r = await fetch('./backend_url.json', { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && typeof j.url === 'string' && /^https:\/\//.test(j.url)) {
      CHAT_BACKEND = j.url;
    }
  } catch { /* leave fallback */ }
})();
const ChatContext = React.createContext(null);
// Module-level cache: q → { meta, messages }. Survives panel open/close so
// we don't re-download a conversation the user already looked at.
const CHAT_CACHE = new Map();

function UnreadBadge() {
  const [data, setData] = useState(null);
  useEffect(() => {
    let alive = true;
    const fetchUnread = async () => {
      try {
        const r = await fetch(`${CHAT_BACKEND}/api/unread`, { cache: 'no-store' });
        const j = await r.json();
        if (alive && !j.error) setData(j);
      } catch {}
    };
    fetchUnread();
    const id = setInterval(fetchUnread, 60000);
    return () => { alive = false; clearInterval(id); };
  }, []);
  if (!data) return null;
  if (!data.dm) return null;
  return (
    <div className="header-sub" style={{marginTop:3}}
      title={`Непрочитанные личные сообщения в Telegram: ${data.dm}. В чатах: ${data.groups || 0} (скрыты из бейджа).`}>
      ✉️ {data.dm} непрочитанных DM
    </div>
  );
}

  const bodyRef = React.useRef(null);
  const abortRef = React.useRef(null);

  const q = target?.username || (target?.user_id ? String(target.user_id) : '');
  // 🔴 26.04: VK channel uses /api/vk_chat + /api/vk_send (parallel to TG endpoints).
  const channel = (target?.channel || 'TG').toUpperCase();
  const chatEp = channel === 'VK' ? 'vk_chat' : 'chat';
  const sendEp = channel === 'VK' ? 'vk_send' : 'send';

  const fetchChat = useCallback(async (sinceId) => {
    if (!q) return;
    // Abort any previous in-flight fetch so responses for a DIFFERENT chat
    // (user hovered another card) don't land here and corrupt the panel.
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const activeQ = q;
    const url = sinceId
      ? `${CHAT_BACKEND}/api/${chatEp}?q=${encodeURIComponent(q)}&since_id=${sinceId}`
      : `${CHAT_BACKEND}/api/${chatEp}?q=${encodeURIComponent(q)}&limit=40`;
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      const j = await r.json();
      // If the user hovered another card while we were waiting, drop the response.
      if (activeQ !== q) return;
      if (j.error) { setErr(j.error); return; }
      setErr('');
      if (j.incremental) {
        // Merge new messages onto cached set (dedupe by id).
        const prev = CHAT_CACHE.get(activeQ) || data || { messages: [], meta: j.meta };
        const seen = new Set(prev.messages.map(m => m.id));
        const merged = prev.messages.concat(j.messages.filter(m => !seen.has(m.id)));
        const next = { meta: prev.meta || j.meta, messages: merged };
        CHAT_CACHE.set(activeQ, next);
        setData(next);
      } else {
        CHAT_CACHE.set(activeQ, { meta: j.meta, messages: j.messages });
        setData({ meta: j.meta, messages: j.messages });
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
      setErr(`Backend не отвечает (${e.message}). Запусти dashboard_backend.py.`);
    }
  }, [q, data]);

  useEffect(() => {
    if (!target) return;
    setErr(''); setDraft('');
    // Instant paint from cache (if we've seen this chat before), then request
    // only the tail (messages newer than what's cached).
    const cached = CHAT_CACHE.get(q);
    if (cached) {
      setData(cached);
      const lastId = cached.messages.length ? cached.messages[cached.messages.length - 1].id : 0;
      fetchChat(lastId);
    } else {
      setData(null);
      fetchChat();
    }
    // Autorefresh — incremental only, cheap on backend.
    const id = setInterval(() => {
      const c = CHAT_CACHE.get(q);
      const lastId = c && c.messages.length ? c.messages[c.messages.length - 1].id : 0;
      fetchChat(lastId || undefined);
    }, 15000);
    return () => {
      clearInterval(id);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [target]);   // intentionally NOT depending on fetchChat — avoid reset loops

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [data]);

  const send = async () => {
    const text = draft.trim();
    if (!text || sending) return;
    setSending(true); setErr('');
    try {
      const r = await fetch(`${CHAT_BACKEND}/api/${sendEp}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ q, text }),
      });
      const j = await r.json();
      if (j.error) setErr(j.error);
      else {
        setDraft('');
        const c = CHAT_CACHE.get(q);
        const lastId = c && c.messages.length ? c.messages[c.messages.length - 1].id : 0;
        fetchChat(lastId || undefined);
      }
    } catch (e) {
      setErr(e.message);
    } finally {
      setSending(false);
    }
  };

  const onKey = e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
    if (e.key === 'Escape') onClose();
  };

  const fmt = iso => {
    try { return new Date(iso).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    catch { return ''; }
  };

  const meta = data?.meta;
  const title = meta
    ? `${meta.first_name || ''} ${meta.last_name || ''}`.trim() || (meta.username ? `@${meta.username}` : `id${meta.user_id}`)
    : (target.client || `@${target.username}` || `id${target.user_id}`);
  const sub = meta?.username ? `@${meta.username}` : (target.username ? `@${target.username}` : '');

  return (
    <div className={`chat-panel ${target ? 'open' : ''}`}>
      <div className="chat-header">
        <div>
          <div className="chat-title">{title}</div>
          {sub && <div className="chat-sub">{sub}</div>}
        </div>
        <button className="chat-close" onClick={onClose} title="Закрыть (Esc)">×</button>
      </div>
      {err && <div className="chat-error">{err}</div>}
      <div className="chat-body" ref={bodyRef}>
        {!data && !err && <div className="chat-loading">Загружаю переписку…</div>}
        {data?.messages?.length === 0 && <div className="chat-loading">Нет сообщений</div>}
        {data?.messages?.map(m => (
          <div key={m.id} style={{display:'flex', flexDirection:'column', alignItems: m.out ? 'flex-end' : 'flex-start'}}>
            <div className={`chat-msg ${m.out ? 'chat-msg-out' : 'chat-msg-in'}`}>
              {m.text || (m.media ? '📎 медиа' : '')}
            </div>
            <div className="chat-msg-time">{fmt(m.date)}</div>
          </div>
        ))}
      </div>
      <div className="chat-input-row">
        <textarea
          className="chat-input"
          placeholder="Ответ клиенту… (Ctrl+Enter — отправить, Esc — закрыть)"
          value={draft}
          onChange={e => setDraft(e.target.value)}
          onKeyDown={onKey}
          rows={2}
        />
        <button className="chat-send" onClick={send} disabled={sending || !draft.trim()}>
          {sending ? '…' : '➤'}
        </button>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [rows,      setRows]      = useState(null);
  const [dbSnapshot, setDbSnapshot] = useState(null);
  const [sessionLog, setSessionLog] = useState(null);
  const [activity24h, setActivity24h] = useState(null);
  const [aiDelivery, setAiDelivery] = useState(null);
  const [dmDirectFunnel, setDmDirectFunnel] = useState(null);
  const [recentSent, setRecentSent] = useState(null);
  const [recentSent24h, setRecentSent24h] = useState(null);
  const [todos,     setTodos]     = useState(null);
  const [loading,   setLoading]   = useState(true);
  const [refreshing,setRefreshing]= useState(false);
  const [error,     setError]     = useState(null);
  const [updatedAt, setUpdatedAt] = useState(null);
  const [offline,   setOffline]   = useState(!navigator.onLine);
  const [showTGModal, setShowTGModal] = useState(false);
  const [showProcess, setShowProcess] = useState(null);
  const [chatTarget, setChatTarget] = useState(null);
  const [aiTags, setAiTags] = useState({});
  const [aiLoading, setAiLoading] = useState(false);
  const [activeTab, setActiveTab] = useState(() => {
    try { return localStorage.getItem('lcb_tab') || 'overview'; } catch { return 'overview'; }
  });
  useEffect(() => {
    try { localStorage.setItem('lcb_tab', activeTab); } catch {}
  }, [activeTab]);

  // На десктопе при открытом чате сдвигаем .app так, чтобы правая граница
  // упиралась в левый край слайд-панели (440px)
  useEffect(() => {
    document.body.classList.toggle('chat-open', !!chatTarget);
    return () => document.body.classList.remove('chat-open');
  }, [chatTarget]);

  useEffect(() => {
    const on  = () => setOffline(false);
    const off = () => setOffline(true);
    window.addEventListener('online',  on);
    window.addEventListener('offline', off);
    return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);

  const load = useCallback(async (isRefresh = false) => {
    if (isRefresh) setRefreshing(true);
    try { await BACKEND_READY; } catch {}
    // 🔴 21.04: primary path — /api/dashboard_data endpoint (live, no 10-min Sheet sync lag).
    // Fallback: Google Sheet gviz (если backend упал).
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      let data = null;
      try {
        const r = await fetch(`${bu}/api/dashboard_data`, { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (Array.isArray(j.rows)) {
            data = j.rows;
          }
        }
      } catch (e) {
        console.warn('[load] /api/dashboard_data failed, trying Sheet fallback:', e?.message);
      }
      // Fallback to direct Sheet read if API didn't work
      if (!data) {
        data = await fetchSheet('Dashboard');
      }
      setRows(data);
      setError(null);
      setUpdatedAt(new Date());
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
    // ── DB snapshot (fast, bot-written rows visible immediately) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/db/snapshot`, { cache: 'no-store' });
      if (r.ok) {
        const snap = await r.json();
        setDbSnapshot(snap);
      }
    } catch { /* backend offline → fall back to gviz data only */ }

    // ── Session actions (what Claude did in the current work session) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/session_actions?limit=100`, { cache: 'no-store' });
      if (r.ok) {
        setSessionLog(await r.json());
      }
    } catch { /* backend offline → session tab will show "not available" */ }

    // ── Recent real outbound messages for the main overview block ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/recent_sent_messages?hours=48&limit=30`, { cache: 'no-store' });
      if (r.ok) {
        setRecentSent(await r.json());
      }
    } catch { /* backend offline → block shows empty state */ }

    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/recent_sent_messages?hours=24&limit=1`, { cache: 'no-store' });
      if (r.ok) {
        setRecentSent24h(await r.json());
      }
    } catch { /* backend offline → sent/AI conversion stays zero */ }

    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/ai_delivery_breakdown?hours=24`, { cache: 'no-store' });
      if (r.ok) {
        setAiDelivery(await r.json());
      }
    } catch { /* backend offline → fallback to recentSent24h */ }

    // ── Process activity over last 24h (counts per process + Browser Walk) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/process_activity_24h`, { cache: 'no-store' });
      if (r.ok) {
        setActivity24h(await r.json());
      }
    } catch { /* backend offline → status rows render without 24h counts */ }

    // ── Separate direct-DM client funnel from local AI audit table ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/dm_direct_funnel`, { cache: 'no-store' });
      if (r.ok) {
        setDmDirectFunnel(await r.json());
      }
    } catch { /* optional block; main dashboard should stay usable */ }

    // ── TODOs (live read of todo_*.md from auto-memory) ──
    try {
      const bu = (typeof CHAT_BACKEND !== 'undefined') ? CHAT_BACKEND : '';
      const r = await fetch(`${bu}/api/todos`, { cache: 'no-store' });
      if (r.ok) {
        setTodos(await r.json());
      }
    } catch { /* backend offline → TODO tab shows "loading…" */ }
  }, []);

  useEffect(() => {
    load();
    const t = setInterval(() => load(true), REFRESH_MS);
    return () => clearInterval(t);
  }, [load]);

  const data = useMemo(() => {
    if (!rows) return null;
    const d = processRows(rows);
    // ── Override orders + refused with fresh DB snapshot when available.
    // DB is populated by bots directly (instant) and by sheets_to_db_sync (60s).
    // If backend is down, d.* stays as gviz-derived values.
    if (dbSnapshot && dbSnapshot.active) {
      d.orders = dbSnapshot.active.slice(0, 30).map(o => ({
        status:       o.status,
        date_posted:  o.posted,
        date_event:   o.event_date,
        client:       o.client,
        username:     o.username,
        contact:      o.contact,
        desc:         o.desc,
        location:     o.location,
        source_chat:  o.source_chat,
        history:      o.history,
        channel:      o.channel,
        last_activity: o.last_activity,
      }));
      // Full list of active leads — for funnel stage drill-down (amoCRM-style click)
      d.allLeads = dbSnapshot.active;
      d.allArchived = dbSnapshot.archived || [];
      d.pendingDrafts = dbSnapshot.pending_drafts || [];
      d.dbSync = dbSnapshot.sync;
    }
    if (dbSnapshot && dbSnapshot.archived) {
      const total = dbSnapshot.stats?.archived || dbSnapshot.archived.length;
      d.refused = {
        total,
        recent: dbSnapshot.archived.slice(0, 10).map(o => ({
          status:  o.status,
          date:    o.last_activity || o.posted,
          name:    o.client,
          username: o.contact,
          reason:  (o.history || '').slice(-200),
        })),
      };
    }
    return d;
  }, [rows, dbSnapshot]);

  // После загрузки attention — классифицируем лиды через /api/classify_leads.
  // Кэшируем в aiTags, чтобы не гонять Claude каждый раз.
  useEffect(() => {
    const items = data?.attention?.items || [];
    const usernames = [...new Set(items
      .filter(it => it.channel === 'TG' && it.username)
      .map(it => String(it.username).toLowerCase()))];
    const missing = usernames.filter(u => !(u in aiTags));
    if (!missing.length) return;
    setAiLoading(true);
    // Читаем из кэша (attention_classify_cache.py пишет каждые 15 мин).
    // Cloudflare-tunnel-safe — endpoint отвечает <100мс, не завязан на Sonnet.
    const q = missing.map(encodeURIComponent).join(',');
    fetch(`${CHAT_BACKEND}/api/classifications?usernames=${q}`)
      .then(r => r.json())
      .then(j => {
        if (!j || typeof j !== 'object' || j.error) return;
        const normalized = {};
        for (const [k, v] of Object.entries(j)) normalized[k.toLowerCase()] = v;
        setAiTags(prev => ({ ...prev, ...normalized }));
      })
      .catch(() => {})
      .finally(() => setAiLoading(false));
  }, [data?.attention?.items?.length]);


  // Fast polling (30s) when scan is active
  useEffect(() => {
    if (!data || !data.scan) return;
    const active = data.scan.status === 'scanning' || data.scan.status === 'needs_permission';
    if (!active) return;
    const fast = setInterval(() => load(true), 30000);
    return () => clearInterval(fast);
  }, [data?.scan?.status, load]);

  useEffect(() => {
    if (activity24h?.proc_browser_walk?.status !== 'running') return;
    const fast = setInterval(() => load(true), 10000);
    return () => clearInterval(fast);
  }, [activity24h?.proc_browser_walk?.status, load]);

  const saxFilterLeads = useMemo(
    () => (data?.allLeads || []).filter(hasSaxLead),
    [data?.allLeads]
  );
  const vocal3FilterLeads = useMemo(
    () => (data?.allLeads || []).filter(hasThreePlusVocalsLead),
    [data?.allLeads]
  );

  const timeStr = updatedAt
    ? updatedAt.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })
    : null;

  return (
    <AiTagsContext.Provider value={{ tags: aiTags, loading: aiLoading }}>
    <ChatContext.Provider value={{ openChat: setChatTarget }}>
    <div className="app">
      {/* Header */}
      <div className="header">
        <div className="header-row">
          <div className="header-brand">
            <span className="header-note">🎶</span>
            <div>
              <div className="header-title">
                LCB Dashboard
                {offline && <span className="offline-pill">offline</span>}
              </div>
              {timeStr && <div className="header-sub">Обновлено: {timeStr}</div>}
              <UnreadBadge />
            </div>
          </div>
          <nav className="header-nav">
            <a href="./events.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(63,185,80,0.15)', color:'#3fb950', border:'1px solid rgba(63,185,80,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Согласование events — состав, гонорары, финансы, контакты">
              <span>📋</span><span>Events</span>
            </a>
            <a href="./pricing.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(245,197,24,0.15)', color:'#f5c518', border:'1px solid rgba(245,197,24,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Pricing matrix — цены по сигналам клиента, бэклайн, прочие расходы">
              <span>💰</span><span>Pricing</span>
            </a>
            <a href="./architecture.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(188,140,255,0.15)', color:'#bc8cff', border:'1px solid rgba(188,140,255,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Архитектура проекта + AI usage breakdown">
              <span>🧠</span><span>Архитектура</span>
            </a>
            <a href="./broker.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(63,185,80,0.15)', color:'#3fb950', border:'1px solid rgba(63,185,80,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Broker pipeline — посреднические заказы, кастинг подрядчиков, маржа">
              <span>🤝</span><span>Broker</span>
            </a>
            <a href="./dm-direct-funnel.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(245,197,24,0.15)', color:'#f5c518', border:'1px solid rgba(245,197,24,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="DM-direct funnel — прямые TG лиды">
              <span>📨</span><span>DM funnel</span>
            </a>
            <a href="./contacts.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(88,166,255,0.15)', color:'#58a6ff', border:'1px solid rgba(88,166,255,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Contact Roles — классификация всех TG-контактов по ролям">
              <span>🎭</span><span>Contacts</span>
            </a>
            <a href="./cost.html"
               style={{padding:'8px 12px', borderRadius:8, fontSize:13, fontWeight:600, textDecoration:'none',
                       background:'rgba(255,159,10,0.15)', color:'#ff9f0a', border:'1px solid rgba(255,159,10,0.35)',
                       display:'inline-flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}
               title="Расход AI и лимитов">
              <span>💸</span><span>Расход</span>
            </a>
            <ThemeHeaderButton />
            <button
              className="refresh-btn"
              onClick={() => load(true)}
              disabled={refreshing}
            >
              <span className={refreshing ? 'spin' : ''}>↻</span>
            </button>
          </nav>
        </div>
      </div>

      {/* Error */}
      {error && (
        <div className="err-box">
          ⚠️ {error}
          <small>
            Убедитесь что Google Sheets доступна публично.<br/>
            Запустите: <code>python3 sync_dashboard_data.py</code>
          </small>
        </div>
      )}

      {/* Loading skeleton */}
      {loading && !rows && <SkeletonCards />}

      {/* Content */}
      {data && (
        <>
          <ConnectionStatus connection={data.connection} vkConnection={data.vkConnection} />
          <TabBar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            newLeadsCount={data.newLeads?.total || 0}
            attentionCount={data.attention?.total || 0}
            refusalCount={Object.values(data.refusalCategories || {}).reduce((a,b) => a+b, 0)}
            paidCount={data.paid?.total || 0}
            agentsMissing={(data.agents?.missing || 0) + (data.agents?.staleSla || 0)}
            aiCalls={data.aiUsage?.totalCalls || 0}
            todosCount={todos?.total || 0}
            saxCount={saxFilterLeads.length}
            vocal3Count={vocal3FilterLeads.length}
          />

          {activeTab === 'overview' && (
            <>
              <StatusSection
                status={data.status}
                activity24h={activity24h}
                sent24h={recentSent24h}
                aiDelivery={aiDelivery}
                onProcessClick={setShowProcess}
              />
              <ActionButtons />
              <KPISection kpi={data.kpi} setActiveTab={setActiveTab}
                          browserWalk={data.browserWalk || {leads:0, refusals:0, chats:0, ranAt:'', hours:48, items:[]}} />
              <div className="section" style={{ marginTop: 8 }}>
                <TGLeadsButton
                  onClick={() => setShowTGModal(true)}
                  tgWeek={data.tgFunnel?.week}
                />
              </div>
              <FunnelSplitSections
                allLeads={data.allLeads || []}
                archived={data.allArchived || []}
                pendingDrafts={data.pendingDrafts || []}
                sessionLog={sessionLog || null}
                fallbackFunnel={data.funnel || []}
              />
              <div className="section" style={{ marginTop: 20 }}>
                <div className="section-title">Дополнительные воронки</div>
                <DMDirectFunnelSection data={dmDirectFunnel} />
              </div>
              <RecentSentMessagesSection data={recentSent} />
              <ScanStatus scan={data.scan} />
              <FollowupsSection followups={data.followups} />
            </>
          )}

          {activeTab === 'new' && (
            <NewLeadsSection newLeads={data.newLeads || {total:0, items:[]}} />
          )}

          {activeTab === 'attention' && (
            <AttentionSection attention={data.attention || {total:0, items:[]}} />
          )}

          {activeTab === 'sax' && (
            <LeadFilterSection
              title="🎷 Лиды с саксом"
              subtitle="Все активные заявки, где в запросе или истории есть сакс: solo welcome и сакс в составе группы."
              leads={saxFilterLeads}
            />
          )}

          {activeTab === 'vocal3' && (
            <LeadFilterSection
              title="🎤 3+ вокала"
              subtitle="Активные заявки, где явно просят больше двух вокалистов/солистов."
              leads={vocal3FilterLeads}
            />
          )}

          {activeTab === 'paid' && (
            <PaidSection paid={data.paid || {total:0, items:[]}} />
          )}

          {activeTab === 'refusals' && (
            <>
              <AISkipSection aiSkips={data.aiSkips} />
              <RefusalsSection refused={data.refused} categories={data.refusalCategories || {}} />
            </>
          )}

          {activeTab === 'broadcasts' && (
            <BroadcastsSection categories={data.refusalCategories || {}} />
          )}

          {activeTab === 'todos' && (
            <TodoSection todos={todos} />
          )}

          {activeTab === 'processes' && (
            <ProcessesSection agents={data.agents || {total:0, running:0, missing:0, items:[]}} />
          )}

          {activeTab === 'timeline' && (
            <TimelineSection timeline={data.timeline || {total:0, items:[]}} />
          )}

          {activeTab === 'ai' && (
            <AIUsageSection aiUsage={data.aiUsage || {totalCalls:0, totalCost:0, skip:0, adapt:0, ok:0, services:{}}} />
          )}

          {showTGModal && (
            <TGFunnelModal
              tgFunnel={data.tgFunnel || {}}
              onClose={() => setShowTGModal(false)}
            />
          )}
          {showProcess && (
            <ProcessRulesModal
              processKey={showProcess}
              onClose={() => setShowProcess(null)}
            />
          )}
        </>
      )}
      {chatTarget && <ChatPanel target={chatTarget} onClose={() => setChatTarget(null)} />}
    </div>
    </ChatContext.Provider>
    </AiTagsContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
// Service Worker registration + periodic version check.
// Проблема была: SW кешировал index.html и пользователь не видел новые
// деплои даже после reload. v29 переключил SW на network-first, плюс
// этот блок сам ловит новые деплои каждые 60с по Last-Modified.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(r => {
        console.log('[SW] registered', r.scope);
        // Force update check on each page load
        r.update();
      })
      .catch(e => console.log('[SW] failed', e));
  });
}

// ─── Auto-update check (Last-Modified polling) ────────────────────
(function setupVersionCheck() {
  let initialLastModified = null;
  let bannerShown = false;

  async function checkVersion() {
    try {
      const r = await fetch('./index.html', {
        method: 'HEAD',
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' },
      });
      const lm = r.headers.get('Last-Modified') || r.headers.get('ETag');
      if (!lm) return;
      if (initialLastModified === null) {
        initialLastModified = lm;
        return;
      }
      if (lm !== initialLastModified && !bannerShown) {
        showUpdateBanner();
        bannerShown = true;
      }
    } catch (e) {
      // network down or other issue — silently retry next tick
    }
  }

  function showUpdateBanner() {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#3fb950;color:#0d1117;padding:10px 16px;font:600 14px system-ui;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,0.4);';
    banner.innerHTML = '🔄 Доступна новая версия дашборда — <button id="reload-now" style="background:#0d1117;color:#3fb950;border:none;padding:6px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;">обновить</button>';
    document.body.appendChild(banner);
    document.getElementById('reload-now').onclick = async () => {
      // Очистить SW caches и перезагрузить
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      location.reload();
    };
  }

  // First check after 5s (let page settle), then every 60s
  setTimeout(checkVersion, 5000);
  setInterval(checkVersion, 60000);
})();
</script>
