<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LCB AI Layer</title>
  <style>
    :root {
      --bg:#0a0a12; --card:#13131f; --card2:#1a1a2a; --border:#23233a;
      --text:#e2e8f0; --muted:#64748b; --gold:#f5c518; --ok:#10b981;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
      font-size:14px; line-height:1.45;
    }
    .wrap { max-width:1040px; margin:0 auto; padding:18px 16px 42px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    a { color:#93c5fd; text-decoration:none; }
    .back {
      display:inline-flex; align-items:center; gap:6px; color:var(--muted);
      border:1px solid var(--border); border-radius:8px; padding:7px 10px;
      background:var(--card);
    }
    h1 { margin:0; font-size:22px; letter-spacing:0; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; margin:16px 0; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:8px;
      padding:12px; min-width:0;
    }
    .label {
      color:var(--gold); font-size:11px; font-weight:800; text-transform:uppercase;
      letter-spacing:1px; margin-bottom:8px;
    }
    .item { color:var(--text); font-size:13px; margin:6px 0; }
    code {
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      color:#93c5fd; font-size:12px;
    }
    .prompt-head {
      display:flex; justify-content:space-between; gap:10px; align-items:baseline;
      margin:18px 0 8px;
    }
    pre {
      margin:0; background:#0d1117; border:1px solid rgba(148,163,184,.22);
      border-radius:8px; padding:12px; overflow:auto; max-height:460px;
      white-space:pre-wrap; color:#cbd5e1;
      font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .tab {
      border:1px solid rgba(139,92,246,.35); background:rgba(139,92,246,.1);
      color:#c4b5fd; border-radius:8px; padding:8px 10px; font-weight:700;
    }
    .tab.active { border-color:rgba(245,197,24,.55); color:var(--gold); }
    .err { color:#fca5a5; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.25); border-radius:8px; padding:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 id="title">AI Layer</h1>
        <div class="sub" id="runtime">Загрузка текущего prompt/context/source из локального repo…</div>
      </div>
      <a class="back" href="./index.html">← Dashboard</a>
    </div>
    <div class="tabs">
      <a class="tab" data-layer="agent1" href="./ai-layer.html?layer=agent1">Agent 1</a>
      <a class="tab" data-layer="agent2" href="./ai-layer.html?layer=agent2">Agent 2</a>
      <a class="tab" data-layer="agent3" href="./ai-layer.html?layer=agent3">Agent 3</a>
    </div>
    <div id="content"></div>
  </div>
  <script src="backend_url.json"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const layer = qs.get('layer') || 'agent1';
    const promptName = qs.get('prompt') || '';
    document.querySelectorAll('.tab').forEach(a => {
      if (a.dataset.layer === layer) a.classList.add('active');
    });
    const apiBase = (typeof CHAT_BACKEND !== 'undefined' && CHAT_BACKEND) ? CHAT_BACKEND : '';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
    function list(title, items) {
      return `<div class="card"><div class="label">${esc(title)}</div>${(items || []).map(x => `<div class="item">${esc(x)}</div>`).join('')}</div>`;
    }
    function render(doc) {
      document.getElementById('title').textContent = doc.title || 'AI Layer';
      document.getElementById('runtime').textContent = `${doc.runtime || ''} · ${String(doc.generated_at || '').slice(11,19)}`;
      const prompts = (doc.prompts || []).map(p => `
        <div class="prompt-head" id="prompt-${esc(p.name)}">
          <div><code>${esc(p.name)}</code> <span class="sub">· ${esc(p.file)}${p.line ? ':' + p.line : ''}</span></div>
          ${p.chars ? `<div class="sub">${p.chars} chars</div>` : ''}
        </div>
        ${p.error ? `<div class="err">${esc(p.error)}</div>` : `<pre>${esc(p.text)}${p.truncated ? '\n\n...truncated in dashboard...' : ''}</pre>`}
      `).join('');
      document.getElementById('content').innerHTML = `
        <div class="grid">
          ${list('Source files', (doc.source_files || []).map(x => '<' + x + '>'))}
          ${list('Context', doc.context_sources || [])}
          ${list('Skills / gates', doc.skills || [])}
        </div>
        <div class="label">Current prompts · read from local source files</div>
        ${prompts}
      `;
      if (promptName) {
        requestAnimationFrame(() => {
          const el = document.getElementById(`prompt-${promptName}`);
          if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
        });
      }
    }
    fetch(`${apiBase}/api/ai_layer_docs?layer=${encodeURIComponent(layer)}`, { cache:'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(render)
      .catch(e => {
        document.getElementById('content').innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
      });
  </script>
</body>
</html>
